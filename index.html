      let last = 0;
      setInterval(() => {
        const vis = document.visibilityState === 'visible';
        if (vis || Date.now() - last > 5 * 60000) { last = Date.now(); this.run(); }
      }, CONFIG.SYNC_INTERVAL_MS);
      Events.on('settings:changed', ({ key }) => { if (key === 'quiet') this.pushSettings(); });
    },
    async start() {
      if (!this.enabled()) return;
      if (await Store.metaGet('syncFullUpload', false)) { await this.enqueueAll(); await Store.metaSet('syncFullUpload', false); }
      await this.processPending();
      this.startLoops();
      const first = this.run();
      await Promise.race([first, new Promise(r => setTimeout(r, 3000))]); // Start max. 3 s blockieren
    },
    /** Einrichten ('setup') oder mit bestehendem Konto verbinden ('login') */
    async connect({ api, mode, setupSecret, password, deviceName, reset }) {
      if (!Crypto.supported()) throw new Error('Verschlüsselung wird hier nicht unterstützt (nur über https).');
      api = Api.normalize(api);
      const cfg = await Api.req('GET', '/v1/config', null, { base: api, token: null });
      if (cfg.apiVersion !== 1) throw new Error('Unbekannte Server-Version.');
      deviceName = String(deviceName || '').trim().slice(0, 60) || 'Gerät';
      let keys, res;
      if (mode === 'setup') {
        const salt = Crypto.randomB64u(16);
        keys = await Crypto.derive(password, salt, CONFIG.KDF_ITER);
        res = await Api.req('POST', '/v1/setup', { setupSecret, kdfSalt: salt, kdfIter: CONFIG.KDF_ITER, authHash: keys.authHash, deviceName, reset: !!reset }, { base: api, token: null });
      } else {
        const kdf = await Api.req('GET', '/v1/kdf', null, { base: api, token: null });
        keys = await Crypto.derive(password, kdf.kdfSalt, kdf.kdfIter);
        res = await Api.req('POST', '/v1/login', { loginKey: keys.loginKey, deviceName }, { base: api, token: null });
      }
      await Store.metaSet('cryptoKey', keys.dataKey);
      this.key = keys.dataKey;
      await this.saveState({ api, deviceId: res.deviceId, token: res.deviceToken, deviceName, cursor: 0, enabled: true, revoked: false, lastOkAt: Date.now(), connectedAt: Date.now() });
      UI.banner('sync', null);
      await this.clearOutbox();
      await this.enqueueAll();   // lokale Daten hochladen; neuere Server-Stände gewinnen beim Zusammenführen
      this.startLoops();
      await this.pushSettings();
      await this.run();
      if (this.status !== 'ok') throw new Error('Verbunden, aber die erste Synchronisierung schlug fehl: ' + this.lastError);
      Log.info(`Push & Sync ${mode === 'setup' ? 'eingerichtet' : 'verbunden'} (${deviceName})`);
    },
    async changePassword(current, next) {
      await this.run();
      if (this.status !== 'ok') throw new Error('Bitte zuerst erfolgreich synchronisieren: ' + this.lastError);
      const kdf = await Api.req('GET', '/v1/kdf', null, { token: null });
      const old = await Crypto.derive(current, kdf.kdfSalt, kdf.kdfIter);
      const salt = Crypto.randomB64u(16);
      const nk = await Crypto.derive(next, salt, CONFIG.KDF_ITER);
      const res = await Api.req('POST', '/v1/account/rekey', { loginKey: old.loginKey, kdfSalt: salt, kdfIter: CONFIG.KDF_ITER, authHash: nk.authHash });
      await Store.metaSet('cryptoKey', nk.dataKey);
      this.key = nk.dataKey;
      await this.saveState({ cursor: res.cursor || 0 });
      await this.clearOutbox();
      await this.enqueueAll();
      await this.run();
      Log.info('Sync-Passwort geändert, Daten neu verschlüsselt hochgeladen');
    },
    async disconnect() {
      try { await Push.disable(); } catch (_) {}
      if (this.state && this.state.token) { try { await Api.req('DELETE', `/v1/devices/${encodeURIComponent(this.state.deviceId)}`); } catch (_) {} }
      await this.clearOutbox();
      this.state = { api: this.state && this.state.api, enabled: false };
      await Store.metaSet('sync', this.state);
      await Store.metaSet('cryptoKey', null);
      this.key = null;
      this.setStatus('off');
      Log.info('Gerät vom Push-Dienst abgemeldet (lokale Daten bleiben)');
    },
  };
  Sync.schedule = U.debounce(() => Sync.run(), 2000);

  /* ---- CORE: Schedule ---- */
  /* Eskalationsregel – identisch zu worker/src/schedule.js (Architektur 10.2). Änderungen immer an beiden Stellen! */
  const Schedule = {
    STAGES: [
      { id: '1m', label: '1 Minute (Test)', short: '1 Min', min: 1 },   // zum Testen von Erinnerungen/Push
      { id: '30m', label: '30 Minuten', short: '30 Min', min: 30 },
      { id: '90m', label: '90 Minuten', short: '90 Min', min: 90 },
      { id: '3h', label: '3 Stunden', short: '3 Std', min: 180 },
      { id: '6h', label: '6 Stunden', short: '6 Std', min: 360 },
      { id: '1d', label: '1 Tag', short: '1 Tag', min: 1440 },
      { id: '3d', label: '3 Tage', short: '3 Tage', min: 4320 },
      { id: '1w', label: '1 Woche', short: '1 Woche', min: 10080 },
      { id: '2w', label: '2 Wochen', short: '2 Wochen', min: 20160 },
      { id: '1mo', label: '1 Monat', short: '1 Monat', min: 43200 },
    ],
    DEADLINE_STEPS: [5, 10, 15, 30, 60, 90, 180, 360, 720, 1440, 4320, 10080],
    stageMin(id) { const s = this.STAGES.find(x => x.id === id); return s ? s.min : 1440; },
    stageLabel(id) { const s = this.STAGES.find(x => x.id === id); return s ? s.label : id; },
    stageShort(id) { const s = this.STAGES.find(x => x.id === id); return s ? s.short : id; },
    nextInterval(stageMin, deadline, overdueMin, now) {
      if (!deadline) return stageMin;
      const remainingMin = (deadline - now) / 60000;
      if (remainingMin <= 0) return overdueMin || 15;
      const target = remainingMin / 4;
      let step = 5;
      for (const s of this.DEADLINE_STEPS) if (s <= target) step = s;
      return Math.min(stageMin, step);
    },
    nextAt(r, now) {
      let t = now + this.nextInterval(r.stageMin, r.deadline, r.overdueMin, now) * 60000;
      if (r.deadline && now < r.deadline && t > r.deadline) t = r.deadline;
      return t;
    },
    /** Ende der Ruhezeit, falls `now` darin liegt, sonst null */
    quietEnd(now, start, end) {
      if (start == null || end == null || start === end) return null;
      const d = new Date(now), m = d.getHours() * 60 + d.getMinutes();
      const active = start < end ? (m >= start && m < end) : (m >= start || m < end);
      if (!active) return null;
      const e = new Date(now); e.setHours(Math.floor(end / 60), end % 60, 0, 0);
      if (e.getTime() <= now) e.setDate(e.getDate() + 1);
      return e.getTime();
    },
    /** Verschiebung wegen Ruhezeit (oder null = jetzt senden) */
    quietDefer(now, r, q) {
      if (!q || !q.enabled) return null;
      const end = this.quietEnd(now, q.start, q.end);
      if (end == null) return null;
      if (q.breakForDeadline && r.deadline && r.deadline >= now - 60000 && r.deadline <= Math.max(end, now + 2 * 3600000)) return null;
      return end;
    },
    snoozeOptions(now = Date.now()) {
      const tm = new Date(now); tm.setDate(tm.getDate() + 1); tm.setHours(8, 0, 0, 0);
      return [
        { label: '15 Minuten', until: now + 15 * 60000 },
        { label: '1 Stunde', until: now + 60 * 60000 },
        { label: '3 Stunden', until: now + 180 * 60000 },
        { label: 'Morgen 08:00', until: tm.getTime() },
      ];
    },
    /** Testtabelle aus Architektur 10.2 (Stufe „1 Tag“) */
    selfTest() {
      const now = Date.UTC(2026, 0, 1, 12, 0, 0);
      const M = 60000, H = 60 * M, D = 24 * H;
      const cases = [
        ['5 Tage', 5 * D, 1440], ['2 Tage', 2 * D, 720], ['1 Tag', D, 360], ['12 Stunden', 12 * H, 180],
        ['6 Stunden', 6 * H, 90], ['2 Stunden', 2 * H, 30], ['1 Stunde', H, 15], ['30 Minuten', 30 * M, 5],
        ['überfällig', -10 * M, 15],
      ];
      const res = cases.map(([label, rem, exp]) => { const got = this.nextInterval(1440, now + rem, 15, now); return { label, expected: exp, got, ok: got === exp }; });
      const noDl = this.nextInterval(90, null, 15, now); res.push({ label: 'ohne Abgabe, Stufe 90 Min', expected: 90, got: noDl, ok: noDl === 90 });
      const cl = this.nextAt({ stageMin: 1440, deadline: now + 3 * M, overdueMin: 15 }, now); res.push({ label: 'Abgabe in 3 Min → pünktlich zur Abgabe', expected: '+3 Min', got: `+${(cl - now) / M} Min`, ok: cl === now + 3 * M });
      return res;
    },
  };

  /* ---- CORE: Notify ---- */
  const Notify = {
    reg: null,
    audio: null,
    supported: () => 'Notification' in window,
    pushGranted: false,  // iOS-Workaround: Push-Berechtigung/Abo zählt als „erlaubt“
    permission() {
      if (!this.supported()) return 'unsupported';
      const p = Notification.permission;
      // iOS-Home-Screen-Apps melden nach einem Fenster-Öffnen aus einer Benachrichtigung fälschlich „default“
      return p === 'default' && this.pushGranted ? 'granted' : p;
    },
    /** Tatsächlichen Zustand über die Push-API prüfen (zuverlässiger als Notification.permission auf iOS) */
    async refreshPermission() {
      const before = this.permission();
      try {
        const reg = this.reg || (navigator.serviceWorker && await Promise.race([navigator.serviceWorker.getRegistration(), new Promise(r => setTimeout(r, 3000))]));
        if (reg && reg.pushManager) {
          const st = reg.pushManager.permissionState ? await reg.pushManager.permissionState({ userVisibleOnly: true }).catch(() => null) : null;
          const sub = await reg.pushManager.getSubscription().catch(() => null);
          this.pushGranted = st === 'granted' || !!sub;
        }
      } catch (_) {}
      if (this.permission() !== before) Events.emit('notify:permission', this.permission());
      return this.permission();
    },
    async request() {
      if (!this.supported()) return 'unsupported';
      if (this.permission() === 'granted') return 'granted'; // nie erneut fragen, wenn schon erlaubt
      try { const p = await Notification.requestPermission(); Events.emit('notify:permission', p); return p; } catch (_) { return Notification.permission; }
    },
    unlockAudio() {
      if (this.audio) return;
      try { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.audio = new AC(); } catch (_) {}
    },
    beep() {
      if (!Settings.data.sound || !this.audio) return;
      try {
        const a = this.audio; if (a.state === 'suspended') a.resume();
        [0, 0.22].forEach((off, i) => {
          const o = a.createOscillator(), g = a.createGain();
          o.frequency.value = i ? 880 : 660; o.type = 'sine';
          g.gain.setValueAtTime(0.0001, a.currentTime + off);
          g.gain.exponentialRampToValueAtTime(0.25, a.currentTime + off + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + off + 0.18);
          o.connect(g).connect(a.destination); o.start(a.currentTime + off); o.stop(a.currentTime + off + 0.2);
        });
      } catch (_) {}
    },
    vibrate() { if (Settings.data.vibrate && navigator.vibrate) try { navigator.vibrate([200, 100, 200]); } catch (_) {} },
    async getReg() {
      try { return this.reg || (navigator.serviceWorker && await Promise.race([navigator.serviceWorker.getRegistration(), new Promise(r => setTimeout(r, 2000))])) || null; } catch (_) { return null; }
    },
    /** Bereits angezeigte Mitteilungen schließen (filter: Notification → true = schließen) */
    async close(filter) {
      const reg = await this.getReg();
      if (!reg || !reg.getNotifications) return 0;
      let n = 0;
      try { for (const x of await reg.getNotifications()) { if (filter(x)) { x.close(); n++; } } } catch (_) {}
      return n;
    },
    async show({ title, body, tag, data, actions, silent }) {
      if (!silent) { this.beep(); this.vibrate(); }
      if (this.permission() !== 'granted') return false;
      data = { ...(data || {}), at: Date.now() };
      const opts = { body, tag, data, renotify: !!tag, icon: 'icons/icon-192-v5.png', badge: 'icons/icon-192-v5.png', requireInteraction: false };
      try {
        const reg = await this.getReg();
        if (reg && reg.showNotification) {
          // Einmal-Benachrichtigung: ältere Mitteilung desselben Eintrags vorher schließen (iOS ersetzt gleiche Tags nicht zuverlässig)
          if (tag) { const ids = new Set(data.ids || []); await this.close(x => x.tag === tag || (ids.size && x.data && ids.has(`${x.data.m}/${x.data.id}`))); }
          await reg.showNotification(title, { ...opts, actions: actions || [] }); return true;
        }
      } catch (e) { Log.warn('showNotification: ' + e.message); }
      try { const n = new Notification(title, opts); n.onclick = () => { window.focus(); if (data && data.m) Router.navigate(data.m); n.close(); }; return true; }
      catch (e) { Log.warn('Notification: ' + e.message); return false; }
    },
    setBadge(n) {
      document.title = n ? `(${n}) ${CONFIG.APP_TITLE}` : CONFIG.APP_TITLE;
      try { if (n && navigator.setAppBadge) navigator.setAppBadge(n); else if (navigator.clearAppBadge) navigator.clearAppBadge(); } catch (_) {}
    },
    forModule(id) {
      const def = () => Registry.modules.get(id);
      return {
        permission: () => Notify.permission(),
        request: () => Notify.request(),
        show: (title, body, opts = {}) => Notify.show({ title, body, tag: opts.tag ? `${id}-${opts.tag}` : undefined, data: { m: id, id: opts.itemId }, silent: opts.silent }),
      };
    },
  };

  /* ---- CORE: Reminders ---- */
  const Reminders = {
    C: '__reminders',
    key(m, id) { return `${m}/c:${this.C}/${id}`; },
    async getRec(m, id) { const r = await Store.kvGet(this.key(m, id)); return r ? r.v : null; },
    async putRec(m, rec, { silent = false } = {}) {
      rec.updatedAt = Math.max(Date.now(), (rec.updatedAt || 0) + 1);
      const kv = { k: this.key(m, rec.id), m, c: this.C, n: rec.id, v: rec, u: rec.updatedAt };
      if (Sync.enabled()) await Sync.putWithOutbox(kv, 'reminder'); else await Store.kvPut(kv);
      Tabs.post({ type: 'changed', moduleId: m, collection: this.C });
      if (!silent) { Events.emit('reminders:changed', { moduleId: m }); this.updateBadge(); }
    },
    info(r) {
      return { id: r.id, stage: r.stage, deadline: r.deadline ?? null, overdueMin: r.overdueMin, nextAt: r.nextAt ?? null, lastSentAt: r.lastSentAt ?? null, sentCount: r.sentCount || 0, done: !!r.done, unseen: !!r.unseen && !r.done };
    },
    forModule(m) {
      const R = this;
      const guard = () => { if (Registry.isReadOnly(m)) throw new Error('Modul ist schreibgeschützt.'); };
      const mutate = async (id, fn) => { guard(); const r = await R.getRec(m, id); if (!r || r.deletedAt) return null; fn(r, Date.now()); await R.putRec(m, r); return R.info(r); };
      return {
        STAGES: Schedule.STAGES.map(s => ({ ...s })),
        stageLabel: id => Schedule.stageLabel(id),
        stageShort: id => Schedule.stageShort(id),
        /** intervalMin (frei in Minuten) hat Vorrang vor der Stufen-ID */
        preview: ({ stage, intervalMin, deadline = null, overdueMin = 15 }, now = Date.now()) => Schedule.nextAt({ stageMin: intervalMin ? Math.max(1, Math.round(intervalMin)) : Schedule.stageMin(stage), deadline, overdueMin }, now),
        snoozeOptions: () => Schedule.snoozeOptions(),
        async set(id, { stage, intervalMin, deadline = null, overdueMin = 15, title = '' }) {
          guard();
          const now = Date.now();
          let r = await R.getRec(m, id);
          const stageMin = intervalMin ? Math.max(1, Math.round(intervalMin)) : Schedule.stageMin(stage);
          if (intervalMin) stage = 'custom';
          const t = String(title || '').slice(0, 120);
          deadline = deadline || null;
          if (!r || r.deletedAt) {
            // lastSentAt/sentCount einer gelöschten Vorgängerin übernehmen – der Server führt sie per MAX zusammen
            r = { id, stage, stageMin, deadline, overdueMin, title: t, nextAt: null, lastSentAt: (r && r.lastSentAt) || null, sentCount: (r && r.sentCount) || 0, done: false, unseen: false, createdAt: now, deletedAt: null };
            r.nextAt = Schedule.nextAt(r, now);   // erste Erinnerung nach einem Intervall, nicht sofort
          } else {
            const changed = r.stage !== stage || r.stageMin !== stageMin || (r.deadline || null) !== deadline || r.overdueMin !== overdueMin;
            Object.assign(r, { stage, stageMin, deadline, overdueMin, title: t });
            if (changed && !r.done) r.nextAt = Schedule.nextAt(r, now);
          }
          await R.putRec(m, r);
          return R.info(r);
        },
        async get(id) { const r = await R.getRec(m, id); return r && !r.deletedAt ? R.info(r) : null; },
        async list() { return (await Store.kvByCollection(m, R.C)).map(x => x.v).filter(r => !r.deletedAt).map(r => R.info(r)); },
        snooze(id, minutes) { return mutate(id, (r, now) => { r.nextAt = now + minutes * 60000; r.unseen = false; }); },
        snoozeUntil(id, ts) { return mutate(id, r => { r.nextAt = ts; r.unseen = false; }); },
        /** Nur den nächsten Zeitpunkt verschieben (z. B. Ausrichten auf eine Uhrzeit), „gesehen“-Status bleibt */
        moveTo(id, ts) { return mutate(id, r => { r.nextAt = ts; }); },
        done(id) { return mutate(id, r => { r.done = true; r.nextAt = null; r.unseen = false; }); },
        reopen(id) { return mutate(id, (r, now) => { r.done = false; r.unseen = false; r.nextAt = Schedule.nextAt(r, now); }); },
        seen(id) { return mutate(id, r => { r.unseen = false; }); },
        remove(id) { return mutate(id, (r, now) => { r.deletedAt = now; r.done = true; r.nextAt = null; r.unseen = false; }); },
      };
    },
    describe(r, now, atDeadline) {
      if (r.deadline) {
        if (atDeadline || Math.abs(now - r.deadline) < 60000) return 'Jetzt fällig!';
        if (now > r.deadline) return `Überfällig seit ${U.formatDuration((now - r.deadline) / 60000)}`;
        return `Abgabe ${U.relTime(r.deadline, now)} (${U.formatDate(r.deadline)})`;
      }
      return `${r.sentCount}. Erinnerung · alle ${U.formatDuration(r.stageMin || Schedule.stageMin(r.stage))}`;
    },
    async tick({ catchUp = false } = {}) {
      // Mit erreichbarem Push-Dienst löst der Server aus; die App zeigt nur an (Architektur 10.4)
      if (Sync.active()) { await this.updateBadge(); return; }
      const run = async () => {
        const now = Date.now(), fired = [];
        const q = Settings.data.quiet;
        for (const def of Registry.list()) {
          if (Registry.isReadOnly(def.id)) continue;
          const recs = await Store.kvByCollection(def.id, this.C);
          for (const { v: r } of recs) {
            if (r.deletedAt || r.done || r.nextAt == null || r.nextAt > now) continue;
            const qEnd = Schedule.quietDefer(now, r, q);
            if (qEnd) { r.nextAt = qEnd; await this.putRec(def.id, r, { silent: true }); continue; }
            const atDeadline = !!r.deadline && r.nextAt === r.deadline;
            r.lastSentAt = now; r.sentCount = (r.sentCount || 0) + 1; r.unseen = true;
            r.nextAt = Schedule.nextAt(r, now);
            await this.putRec(def.id, r, { silent: true });
            fired.push({ def, r, atDeadline });
          }
        }
        if (fired.length) {
          await this.announce(fired, now, catchUp);
          Events.emit('reminders:changed', {});
          fired.forEach(f => Events.emit('reminder:fired', { moduleId: f.def.id, itemId: f.r.id }));
        }
        await this.updateBadge();
      };
      try {
        if (navigator.locks && navigator.locks.request) await navigator.locks.request('pa-reminder-tick', run);
        else await run();
      } catch (e) { Log.error('Erinnerungstakt: ' + e.message); }
    },
    async announce(fired, now, catchUp) {
      if (fired.length <= 5) {
        for (const { def, r, atDeadline } of fired) {
          const body = this.describe(r, now, atDeadline);
          await Notify.show({ title: `${r.title || def.name}`, body, tag: `${def.id}-${r.id}`, data: { m: def.id, id: r.id }, actions: [{ action: 'done', title: 'Erledigt' }, { action: 'snooze', title: '1 Std später' }] });
          if (def.reminderToast !== false && document.visibilityState === 'visible') UI.toast(`${r.title || def.name} – ${body}`, { action: 'Öffnen', onAction: () => Router.navigate(def.id) });
        }
      } else {
        const first = fired[0].r.title || fired[0].def.name;
        const title = `${first} + ${fired.length - 1} weitere${catchUp ? ' (verpasst)' : ''}`;
        const body = fired.slice(0, 6).map(f => '• ' + (f.r.title || f.def.name)).join('\n') + (fired.length > 6 ? `\n… und ${fired.length - 6} weitere` : '');
        await Notify.show({ title, body, tag: 'pa-summary', data: { m: fired[0].def.id, ids: fired.map(f => `${f.def.id}/${f.r.id}`) } });
        const tf = fired.filter(f => f.def.reminderToast !== false);
        if (tf.length && document.visibilityState === 'visible') UI.toast(tf.length === fired.length ? title : `${tf[0].r.title || tf[0].def.name}${tf.length > 1 ? ` + ${tf.length - 1} weitere` : ''}`, { action: 'Ansehen', onAction: () => Router.navigate(tf[0].def.id) });
      }
    },
    async counts() {
      const out = {};
      for (const def of Registry.list()) {
        const recs = await Store.kvByCollection(def.id, this.C);
        const n = recs.filter(({ v }) => !v.deletedAt && !v.done && v.unseen).length;
        if (n) out[def.id] = n;
      }
      return out;
    },
    async updateBadge() {
      try {
        const c = await this.counts();
        Notify.setBadge(Object.values(c).reduce((a, b) => a + b, 0));
        Shell.setCounts(c);
      } catch (_) {}
    },
    /** Angezeigte Mitteilungen aufräumen: Eine Mitteilung bleibt nur, solange ihre Erinnerung offen und ungesehen ist.
        Gesehen (Modul geöffnet), erledigt, geschlummert oder gelöscht → Mitteilung verschwindet aus der Mitteilungszentrale. */
    async prune() {
      const stale = async (m, id, at) => {
        const r = await this.getRec(m, id);
        if (!r || r.deletedAt || r.done) return true;
        return !r.unseen && (r.updatedAt || 0) >= (at || 0);   // nach dem Anzeigen als gesehen markiert
      };
      const reg = await Notify.getReg();
      if (!reg || !reg.getNotifications) return;
      try {
        for (const n of await reg.getNotifications()) {
          const d = n.data || {};
          const at = d.at || n.timestamp || 0;
          if (d.m && d.id) { if (await stale(d.m, d.id, at)) n.close(); }
          else if (Array.isArray(d.ids) && d.ids.length) {
            let all = true;
            for (const k of d.ids) { const i = k.indexOf('/'); if (!(await stale(k.slice(0, i), k.slice(i + 1), at))) { all = false; break; } }
            if (all) n.close();
          } else if (n.tag === 'pa-summary' || n.tag === 'pa-push') {
            if (!Object.keys(await this.counts()).length) n.close();
          }
        }
      } catch (e) { Log.warn('Mitteilungen aufräumen: ' + e.message); }
    },
    /** Aktion aus einer Benachrichtigung (über Service Worker/Outbox) */
    async handleAction(m, id, action) {
      const def = Registry.modules.get(m);
      if (!def || Registry.isReadOnly(m)) return;
      const api = this.forModule(m);
      if (action === 'snooze') await api.snooze(id, 60);
      try { await Registry.call(m, 'onReminderAction', id, action); } catch (_) {}
      if (action === 'done') await api.done(id);
      Events.emit('reminders:changed', { moduleId: m });
    },
    /** Lokaler Namensindex für den Service Worker (meta.notifyTitles), damit Push-Mitteilungen den ToDo-Namen zeigen,
        auch wenn das Entschlüsseln im Service Worker zu lange dauert. Bleibt auf dem Gerät, geht nie an den Server. */
    async syncTitles() {
      try {
        const map = {};
        for (const def of Registry.modules.values()) {
          for (const { v } of await Store.kvByCollection(def.id, this.C)) if (!v.deletedAt && !v.done && v.title) map[`${def.id}/${v.id}`] = String(v.title).slice(0, 120);
        }
        await Store.metaSet('notifyTitles', map);
      } catch (e) { Log.warn('Namensindex: ' + e.message); }
    },
    start() {
      const titles = U.debounce(() => this.syncTitles(), 800);
      const prune = U.debounce(() => this.prune(), 1500);
      this.syncTitles();
      prune();
      Events.on('reminders:changed', () => { titles(); prune(); });
      Events.on('app:visible', prune);
      Events.on('store:changed', e => { if (e && e.collection === this.C) titles(); });
      this.tick({ catchUp: true });
      setInterval(() => this.tick(), CONFIG.TICK_MS);
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { this.tick({ catchUp: true }); Events.emit('app:visible', {}); } });
      Events.on('settings:changed', () => this.updateBadge());
    },
  };

  /* ---- CORE: Outbox (Aktionen aus dem Service Worker) ---- */
  const Outbox = {
    async process() {
      const run = async () => {
        const items = await IDB.run('outbox', 'readonly', s => IDB.rq(s.getAll()));
        for (const it of items.filter(i => i.kind === 'action')) {
          try { await Reminders.handleAction(it.module, it.itemId, it.action); } catch (e) { Log.error('Outbox-Aktion: ' + e.message); }
          await IDB.run('outbox', 'readwrite', s => { s.delete(it.id); });
        }
      };
      try { if (navigator.locks && navigator.locks.request) await navigator.locks.request('pa-outbox', run); else await run(); }
      catch (e) { Log.error('Outbox: ' + e.message); }
    },
  };

  /* ---- CORE: Push ---- */
  /* Web-Push-Abo dieses Geräts beim Worker (Architektur 8.4). */
  const Push = {
    subscribedHere: false,
    supported: () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window && location.protocol !== 'file:',
    async reg() {
      if (SWReg.reg) return SWReg.reg;
      if (!('serviceWorker' in navigator)) return null;
      return Promise.race([navigator.serviceWorker.ready, new Promise(r => setTimeout(() => r(null), 5000))]);
    },
    async current() {
      try { const r = await this.reg(); return r && r.pushManager ? await r.pushManager.getSubscription() : null; } catch (_) { return null; }
    },
    unsupportedReason() {
      if (U.isIOS() && !U.isStandalone()) return 'iPhone/iPad: Die App zuerst über „Teilen → Zum Home-Bildschirm“ installieren und dann vom Icon aus öffnen.';
      return 'Dieser Browser unterstützt kein Web Push.';
    },
    /** Muss durch ein Tippen ausgelöst werden (iOS) */
    async enable() {
      if (!this.supported()) throw new Error(this.unsupportedReason());
      if (!Sync.enabled()) throw new Error('Bitte zuerst Push & Sync einrichten.');
      const p = await Notify.request();
      if (p !== 'granted') throw new Error(p === 'denied' ? 'Benachrichtigungen sind blockiert – bitte in den Browser-/Systemeinstellungen erlauben.' : 'Benachrichtigungen wurden nicht erlaubt.');
      const cfg = await Api.req('GET', '/v1/config', null, { token: null });
      if (!cfg.vapidPublicKey) throw new Error('Auf dem Server fehlt der VAPID-Schlüssel.');
      const reg = await this.reg();
      if (!reg) throw new Error('Service Worker nicht bereit. Bitte die App neu laden.');
      let sub = await reg.pushManager.getSubscription();
      const st = await Store.metaGet('push', {});
      if (sub && st.vapid && st.vapid !== cfg.vapidPublicKey) { try { await sub.unsubscribe(); } catch (_) {} sub = null; }
      if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: Crypto.unb64u(cfg.vapidPublicKey) });
      await Api.req('PUT', '/v1/subscription', sub.toJSON());
      await Store.metaSet('push', { v: 3, subscribed: true, endpoint: sub.endpoint, at: Date.now(), vapid: cfg.vapidPublicKey });
      this.subscribedHere = true;
      Events.emit('push:changed', {});
      Log.info('Push auf diesem Gerät aktiviert');
    },
    async disable() {
      const sub = await this.current();
      if (sub) {
        if (Sync.enabled()) { try { await Api.req('DELETE', '/v1/subscription', { endpoint: sub.endpoint }); } catch (_) {} }
        try { await sub.unsubscribe(); } catch (_) {}
      }
      await Store.metaSet('push', { subscribed: false });
      this.subscribedHere = false;
      Events.emit('push:changed', {});
    },
    /** Beim Start: Abo prüfen und einmal täglich beim Server auffrischen */
    async refresh() {
      const st = await Store.metaGet('push', {});
      if (!Sync.enabled() || !this.supported()) { this.subscribedHere = false; return; }
      const reg = await this.reg();
      if (!reg || !reg.pushManager) return;              // Service Worker (noch) nicht bereit: Zustand nicht verändern
      const sub = await reg.pushManager.getSubscription().catch(() => null);
      const was = this.subscribedHere;
      if (!sub) {
        this.subscribedHere = false;
        if (st.subscribed) { await Store.metaSet('push', { subscribed: false }); Log.warn('Push-Abo wurde vom Browser entfernt – bitte erneut aktivieren'); }
        if (was) Events.emit('push:changed', {});
        return;
      }
      // Vorhandenes Abo gilt immer als aktiv (unabhängig von Notification.permission, siehe iOS-Fehler)
      this.subscribedHere = true; Notify.pushGranted = true;
      if (!was) Events.emit('push:changed', {});
      if (!st.subscribed || st.v !== 3 || sub.endpoint !== st.endpoint || Date.now() - (st.at || 0) > 6 * 3600000) {
        try { await Api.req('PUT', '/v1/subscription', sub.toJSON()); await Store.metaSet('push', { ...st, v: 3, subscribed: true, endpoint: sub.endpoint, at: Date.now() }); }
        catch (e) { Log.warn('Push-Abo auffrischen: ' + e.message); }
      }
    },
    test() { return Api.req('POST', '/v1/test-push', {}); },
  };

  /* Service-Worker-Registrierung */
  const SWReg = {
    reg: null, wantReload: false,
    async register() {
      if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
      try {
        const reg = await navigator.serviceWorker.register('./sw.js', { scope: './' });
        this.reg = reg; Notify.reg = reg;
        const onWaiting = () => { if (reg.waiting && navigator.serviceWorker.controller) VersionGuard.showUpdate('Neue Version bereit.'); };
        onWaiting();
        reg.addEventListener('updatefound', () => { const w = reg.installing; w && w.addEventListener('statechange', () => { if (w.state === 'installed') onWaiting(); }); });
        navigator.serviceWorker.addEventListener('controllerchange', () => { if (this.wantReload) { this.wantReload = false; location.reload(); } });
        navigator.serviceWorker.addEventListener('message', e => {
          const d = e.data || {};
          if (d.type === 'outbox') Outbox.process();
          if (d.type === 'sync') Sync.run();
          if (d.type === 'navigate' && d.hash) { location.hash = d.hash; }
        });
        navigator.serviceWorker.ready.then(r => { this.reg = r; Notify.reg = r; });
      } catch (e) { Log.warn('Service Worker nicht registriert: ' + e.message); }
    },
    applyUpdate() {
      if (this.reg && this.reg.waiting) { this.wantReload = true; this.reg.waiting.postMessage({ type: 'skipWaiting' }); setTimeout(() => this.hardReload(), 3000); }
      else this.hardReload();
    },
    /** Neu laden an allen Caches vorbei: Adresse mit ?u=<Zeit> (wird beim Start wieder entfernt) */
    hardReload() {
      const u = new URL(location.href); u.searchParams.set('u', Date.now());
      location.replace(u.href);
    },
  };

  /* ---- CORE: Shell ---- */
  const Shell = {
    counts: {},
    render() {
      const nav = document.getElementById('nav');
      nav.replaceChildren(...Registry.list().map(d => UI.h('a', { href: Router.link(d.id === 'start' ? '' : d.id), 'data-id': d.id, 'aria-label': d.name, title: d.name },
        UI.h('span', { class: 'ic', 'aria-hidden': 'true' }, UI.icon(d.icon)), UI.h('span', { class: 'lbl', 'aria-hidden': 'true' }, d.name), this.counts[d.id] ? UI.h('span', { class: 'count' }, this.counts[d.id]) : null)));
      if (Router.current) this.highlight(Router.current.moduleId);
    },
    highlight(id) {
      document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('active', a.dataset.id === id));
      // untere Leiste: aktives Symbol in den sichtbaren Bereich scrollen
      const nav = document.getElementById('nav'), a = nav && nav.querySelector('a.active');
      if (a && nav.scrollWidth > nav.clientWidth + 1 && getComputedStyle(nav).flexDirection === 'row') {
        const l = a.offsetLeft, r = l + a.offsetWidth;
        if (l < nav.scrollLeft || r > nav.scrollLeft + nav.clientWidth) nav.scrollTo({ left: Math.max(0, l - (nav.clientWidth - a.offsetWidth) / 2), behavior: 'smooth' });
      }
    },
    setCounts(c) { const changed = JSON.stringify(c) !== JSON.stringify(this.counts); this.counts = c; if (changed) this.render(); },
    status(text) { document.getElementById('status').textContent = text || ''; },
  };

  /* ---- CORE: System (nur für System-Module start/einstellungen) ---- */
  const System = {
    CONFIG, CHANGELOG, Registry, Backup, Settings, Notify, Reminders, Schedule, Log, Theme, VersionGuard, SWReg, Sync, Push, Api, Router: Router.api,
    async storage() {
      const out = { persisted: null, usage: null, quota: null };
      try { if (navigator.storage?.persisted) out.persisted = await navigator.storage.persisted(); } catch (_) {}
      try { if (navigator.storage?.estimate) { const e = await navigator.storage.estimate(); out.usage = e.usage; out.quota = e.quota; } } catch (_) {}
      return out;
    },
    lastExportAt: () => Store.metaGet('lastExportAt', null),
    /** Vom Service Worker protokollierte Push-Empfänge (neueste zuerst), alte werden aufgeräumt */
    async pushLog() {
      const all = (await IDB.run('outbox', 'readonly', s => IDB.rq(s.getAll()))).filter(e => e.kind === 'pushlog').sort((a, b) => b.at - a.at);
      const old = all.slice(30);
      if (old.length) await IDB.run('outbox', 'readwrite', s => { old.forEach(e => s.delete(e.id)); });
      return all.slice(0, 30);
    },
    async requestPersist() { try { return navigator.storage?.persist ? await navigator.storage.persist() : false; } catch (_) { return false; } },
    async hints() {
      const hints = [];
      const st = await this.storage();
      const lastExport = await Store.metaGet('lastExportAt', null);
      const app = await Store.metaGet('app', {});
      const since = lastExport || app.installedAt || Date.now();
      const days = Sync.enabled() ? 30 : st.persisted === false ? 7 : 14;
      const hasData = (await Store.kvAll()).some(r => r.c && r.c !== '__reminders');
      if (hasData && Date.now() - since > days * 86400000) hints.push({ id: 'export', icon: 'save', text: lastExport ? `Letzter Export vor ${U.formatDuration((Date.now() - lastExport) / 60000)}` : 'Noch kein Export', action: 'Export', run: () => Backup.exportFile() });
      const p = Notify.permission();
      if (p === 'default') hints.push({ id: 'notify', icon: 'bell', text: 'Benachrichtigungen aus', action: 'Erlauben', run: () => Notify.request() });
      else if (p === 'denied') hints.push({ id: 'notify', icon: 'bell-off', text: 'Benachrichtigungen blockiert' });
      else if (p === 'unsupported' && U.isIOS() && !U.isStandalone()) hints.push({ id: 'ios', icon: 'phone', text: 'Für Push: zum Home-Bildschirm hinzufügen' });
      if (!Sync.enabled()) {
        const revoked = !!(Sync.state && Sync.state.revoked);
        hints.push({ id: 'push', icon: revoked ? 'alert' : 'cloud', muted: !revoked,
          text: revoked ? 'Sync abgemeldet' : 'Sync aus – Daten nur auf diesem Gerät',
          action: revoked ? 'Verbinden' : 'Einrichten', run: () => Router.navigate('einstellungen/sync') });
      } else if (Push.supported() && !Push.subscribedHere) {
        hints.push({ id: 'push', icon: 'bell', text: 'Push aus', action: 'Aktivieren',
          run: async () => { try { await Push.enable(); UI.toast('Push aktiviert'); } catch (e) { UI.toast(e.message, { type: 'error', timeout: 8000 }); } } });
      }
      return hints;
    },
  };

  /* ---- CORE: Boot ---- */
  const App = {
    register: def => Registry.register(def),
    async boot() {
      VersionGuard.cleanUrl();
      Theme.start();
      window.addEventListener('error', e => { Log.error(`${e.message} (${e.filename?.split('/').pop()}:${e.lineno})`); });
      window.addEventListener('unhandledrejection', e => { Log.error('Unbehandelt: ' + (e.reason && e.reason.message || e.reason)); });
      try { await IDB.open(); }
      catch (e) {
        document.getElementById('view').replaceChildren(UI.errorCard(e, 'Datenspeicher nicht verfügbar'), UI.h('p', { class: 'muted' }, 'Möglicherweise ist privates Surfen aktiv oder der Speicher ist voll. Deine bisherigen Daten wurden nicht verändert.'));
        return;
      }
      await Log.load();
      await Settings.load();
      await Sync.load();
      Push.subscribedHere = !!(await Store.metaGet('push', {})).subscribed;
      Notify.pushGranted = Push.subscribedHere;
      Tabs.start();
      await VersionGuard.check();
      await Migrator.runAll();
      Shell.render();
      await Router.start();
      VersionGuard.start();
      SWReg.register();
      await Sync.start();
      Notify.refreshPermission().then(() => Push.refresh()).catch(e => Log.warn('Push: ' + e.message));
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') Notify.refreshPermission().then(() => Push.refresh()).catch(() => {}); });
      Outbox.process();
      for (const def of Registry.list()) if (typeof def.background === 'function') Registry.call(def.id, 'background').catch(() => {});
      Reminders.start();
      Backup.daily();
      Events.on('settings:changed', ({ key }) => { if (key === 'hiddenModules') { Shell.render(); } });
      const firstGesture = async () => {
        Notify.unlockAudio();
        if (!(await Store.metaGet('persistAsked', false))) { await Store.metaSet('persistAsked', true); System.requestPersist(); }
        window.removeEventListener('pointerdown', firstGesture); window.removeEventListener('keydown', firstGesture);
      };
      window.addEventListener('pointerdown', firstGesture); window.addEventListener('keydown', firstGesture);
      Log.info(`Start ${CONFIG.APP_VERSION}`);
    },
  };
  window.App = App;
  /* ==== ENDE CORE ==== */
  </script>

  <script>
  /* ==== MODUL: start ==== */
  (() => {
    App.register({
      id: 'start', name: 'Start', icon: 'home', order: 0, system: true,
      version: '1.3.0', schemaVersion: 1, migrations: {},
      async mount(el, ctx) {
        const { h } = ctx.ui;
        const S = ctx.system;
        const d = new Date();
        const hintsBox = h('div');
        const widgetsBox = h('div', { class: 'widgets' });
        const tiles = h('div', { class: 'tiles' });
        const statsBox = h('div', { class: 'hstats' });
        el.append(h('div', { class: 'topline' }, h('span', { class: 'muted date' }, d.toLocaleDateString('de-DE', { weekday: 'short', day: 'numeric', month: 'long' })), statsBox), hintsBox, widgetsBox, tiles);

        // Kennzahlen der Module (Hook homeStats, z. B. Serie und Punkte aus „Tägliche Ziele“) – klein oben rechts
        const statMods = () => S.Registry.list().filter(m => !m.system && typeof m.homeStats === 'function');
        const renderStats = async () => {
          const items = [];
          for (const m of statMods()) { try { items.push(...((await S.Registry.call(m.id, 'homeStats')) || [])); } catch (_) {} }
          statsBox.replaceChildren(...items.map(x => h('a', { class: 'hstat', href: ctx.router.link(x.route || ''), title: x.title || '' }, ctx.ui.icon(x.icon), String(x.value))));
        };
        const reStats = ctx.util.debounce(renderStats, 300);
        ctx.events.on('store:changed', e => { if (e && statMods().some(m => m.id === e.moduleId)) reStats(); });
        ctx.events.on('app:visible', reStats);
        renderStats();

        // Ausschnitte der Module (Hook widget), z. B. aktive ToDos – über den Kern, nie direkt
        const renderWidgets = async () => {
          this._disposeWidgets && this._disposeWidgets();
          const disposers = [];
          this._disposeWidgets = () => { disposers.splice(0).forEach(f => f()); };
          const mods = S.Registry.list().filter(m => !m.system && typeof m.widget === 'function');
          const boxes = mods.map(() => h('div', { class: 'widget card' }));
          widgetsBox.replaceChildren(...boxes);
          for (let i = 0; i < mods.length; i++) disposers.push(await S.Registry.widget(mods[i].id, boxes[i]));
        };

        const renderHints = async () => {
          const hints = await S.hints();
          hintsBox.replaceChildren(...hints.map(x => h('div', { class: 'card hint' },
            ctx.ui.icon(x.icon, 'hint-ic'), h('div', { class: 'grow' }, x.text),
            x.action ? h('button', { class: 'btn btn-sm btn-primary', onclick: async () => { await x.run(); renderHints(); } }, x.action) : null)));
        };
        const renderTiles = () => {
          // Module mit homeTile: false (über Tab-Leiste, Widget oder Kennzahl erreichbar) bekommen keine Schaltfläche
          const mods = S.Registry.list().filter(m => !m.system && m.homeTile !== false);
          tiles.replaceChildren(...mods.map(m => h('a', { class: 'btn module-btn', href: ctx.router.link(m.id) }, ctx.ui.icon(m.icon), h('span', {}, m.name))));
        };
        renderTiles();
        await renderWidgets();
        await renderHints();
        ctx.events.on('notify:permission', renderHints);
        ctx.events.on('push:changed', renderHints);
        ctx.events.on('sync:status', ctx.util.debounce(renderHints, 500));
        ctx.events.on('settings:changed', ({ key }) => { if (key === 'hiddenModules') { renderTiles(); renderWidgets(); } });
      },
      unmount() { this._disposeWidgets && this._disposeWidgets(); this._disposeWidgets = null; },
    });
  })();
  /* ==== ENDE MODUL: start ==== */
  </script>

  <script>
  /* ==== MODUL: einstellungen ==== */
  (() => {
    App.register({
      id: 'einstellungen', name: 'Einstellungen', icon: 'settings', order: 1000, system: true,
      version: '1.2.0', schemaVersion: 1, migrations: {},
      async onRoute(route) { this._show && this._show(route.parts[0]); },
      unmount() { this._show = null; },
      async mount(el, ctx, route) {
        const { h, toast, confirm, choose } = ctx.ui;
        const S = ctx.system, U = ctx.util;
        const card = (title, ...children) => { const [ic, ...rest] = String(title).split(' '); return h('div', { class: 'card' }, h('h3', {}, ctx.ui.icon(ic), rest.join(' ')), ...children); };
        const sw = (label, checked, onchange) => h('label', { class: 'switch' }, h('input', { type: 'checkbox', checked, onchange: e => onchange(e.target.checked) }), h('span', {}, label));

        const parts = {};
        const sections = ['darstellung', 'sync', 'benachrichtigungen', 'sicherung', 'speicher', 'module', 'doku', 'ueber', 'diagnose'];
        sections.forEach(s => parts[s] = h('div'));

        // Menü: jeder Punkt öffnet eine Unterseite #/einstellungen/<id> mit seinen Bereichen
        const MENU = [
          { id: 'sync', icon: 'cloud', name: 'Push & Sync', parts: ['sync'],
            sub: () => !S.Sync.enabled() ? 'aus' : S.Sync.status === 'auth' ? 'abgemeldet' : S.Push.subscribedHere ? 'an · Push an' : 'an · Push aus' },
          { id: 'benachrichtigungen', icon: 'bell', name: 'Benachrichtigungen', parts: ['benachrichtigungen'],
            sub: () => { const q = S.Settings.get('quiet'); const p = { granted: 'erlaubt', denied: 'blockiert', default: 'nicht gefragt', unsupported: '–' }[S.Notify.permission()]; return q.enabled ? `${p} · Ruhe ${U.minToTime(q.start)}–${U.minToTime(q.end)}` : p; } },
          { id: 'darstellung', icon: 'sun', name: 'Darstellung', parts: ['darstellung'],
            sub: () => ({ system: 'System', light: 'Hell', dark: 'Dunkel' })[S.Theme.get()] },
          { id: 'daten', icon: 'save', name: 'Daten & Speicher', parts: ['sicherung', 'speicher'],
            sub: async () => { const t = S.lastExportAt ? await S.lastExportAt() : null; return t ? `Export ${U.formatDate(t)}` : 'kein Export'; } },
          { id: 'module', icon: 'grid', name: 'Module', parts: ['module'],
            sub: () => { const all = S.Registry.list({ includeHidden: true }).filter(m => !m.system); const on = S.Registry.list().filter(m => !m.system); return `${on.length} von ${all.length} aktiv`; } },
          { id: 'doku', icon: 'book', name: 'Dokumentation', parts: ['doku'], sub: () => '' },
          { id: 'ueber', icon: 'info', name: 'Über & Diagnose', parts: ['ueber', 'diagnose'], sub: () => 'v' + S.CONFIG.APP_VERSION },
        ];
        const menuBox = h('div', { class: 'set-menu card' });
        const head = h('div', { class: 'head' });
        const body = h('div', { class: 'set-body' });
        el.append(head, menuBox, body);
        const renderMenu = async () => {
          const subs = await Promise.all(MENU.map(async m => { try { return (await m.sub()) || ''; } catch (_) { return ''; } }));
          menuBox.replaceChildren(...MENU.map((m, i) => {
            const sub = subs[i];
            return h('a', { class: 'set-item', href: ctx.router.link('einstellungen/' + m.id) },
              ctx.ui.icon(m.icon, 'set-ic'),
              h('div', { class: 'grow' }, h('div', { class: 'set-name' }, m.name), sub ? h('div', { class: 'set-sub' }, sub) : null),
              ctx.ui.icon('chevron-right', 'set-chev'));
          }));
        };
        const show = id => {
          const m = MENU.find(x => x.id === id);
          sections.forEach(s => { parts[s].hidden = true; });
          if (!m) {
            head.replaceChildren(h('h2', {}, 'Einstellungen'));
            renderMenu(); menuBox.hidden = false; body.replaceChildren(); return;
          }
          menuBox.hidden = true;
          head.replaceChildren(
            h('a', { class: 'btn btn-ghost set-back', href: ctx.router.link('einstellungen'), 'aria-label': 'Zurück' }, ctx.ui.icon('chevron-left')),
            h('h2', {}, m.name));
          body.classList.toggle('single', m.parts.length === 1);   // eine Karte: deren Titel steht schon oben
          body.replaceChildren(...m.parts.map(s => { parts[s].hidden = false; return parts[s]; }));
          window.scrollTo(0, 0);
        };
        this._show = show;

        /* Darstellung */
        const themeSel = h('select', { onchange: e => S.Theme.set(e.target.value) },
          [['system', 'System'], ['light', 'Hell'], ['dark', 'Dunkel']].map(([v, l]) => h('option', { value: v, selected: S.Theme.get() === v }, l)));
        parts.darstellung.append(card('sun Darstellung', themeSel));

        /* Benachrichtigungen & Ruhezeiten */
        const renderNotify = () => {
          const p = S.Notify.permission();
          const q = S.Settings.get('quiet');
          const status = { granted: 'erlaubt', denied: 'blockiert', default: 'nicht gefragt', unsupported: 'nicht unterstützt' }[p];
          const saveQ = async patch => { await S.Settings.set('quiet', { ...S.Settings.get('quiet'), ...patch }); };
          const startIn = h('input', { type: 'time', value: U.minToTime(q.start), onchange: e => { const v = U.timeToMin(e.target.value); if (v != null) saveQ({ start: v }); } });
          const endIn = h('input', { type: 'time', value: U.minToTime(q.end), onchange: e => { const v = U.timeToMin(e.target.value); if (v != null) saveQ({ end: v }); } });
          parts.benachrichtigungen.replaceChildren(card('bell Benachrichtigungen',
            h('dl', { class: 'kv' }, h('dt', {}, 'Status'), h('dd', {}, status)),
            h('div', { class: 'row', style: { marginTop: '10px' } },
              p === 'default' ? h('button', { class: 'btn btn-primary', onclick: async () => { await S.Notify.request(); renderNotify(); } }, 'Erlauben') : null,
              h('button', { class: 'btn', onclick: async () => { S.Notify.unlockAudio(); const ok = await S.Notify.show({ title: 'Test', body: 'So sieht eine Erinnerung aus.', tag: 'pa-test', actions: [] }); toast(ok ? 'Gesendet' : 'Nicht erlaubt'); } }, ctx.ui.icon('bell'), 'Test')),
            sw('Ton', S.Settings.get('sound'), v => S.Settings.set('sound', v)),
            sw('Vibration', S.Settings.get('vibrate'), v => S.Settings.set('vibrate', v)),
            h('h3', { style: { marginTop: '16px' } }, ctx.ui.icon('moon'), 'Ruhezeiten'),
            sw('Aktiv', q.enabled, v => { saveQ({ enabled: v }); }),
            h('div', { class: 'row nowrap' }, h('label', { class: 'field grow' }, h('span', {}, 'Von'), startIn), h('label', { class: 'field grow' }, h('span', {}, 'Bis'), endIn)),
            sw('Abgaben dürfen stören', q.breakForDeadline, v => saveQ({ breakForDeadline: v }))));
        };
        renderNotify();

        /* Push & Sync */
        const renderSync = async () => {
          const Y = S.Sync, P = S.Push;
          const busy = (btn, fn) => async () => {
            const label = btn.textContent; btn.disabled = true; btn.textContent = 'Bitte warten …';
            try { await fn(); } catch (err) { toast(err.message || String(err), { type: 'error', timeout: 9000 }); }
            finally { btn.disabled = false; btn.textContent = label; renderSync(); }
          };
          const field = (label, input, hint) => h('label', { class: 'field' }, h('span', {}, label), input, hint ? h('span', { class: 'small muted', style: { display: 'block', marginTop: '4px' } }, hint) : null);
          const defaultName = () => (U.isIOS() ? 'iPhone' : /Android/.test(navigator.userAgent) ? 'Android' : /Mac/.test(navigator.platform) ? 'Mac' : /Win/.test(navigator.platform) ? 'Windows-PC' : 'Gerät') + (U.isStandalone() ? ' (App)' : '');

          const connectDialog = mode => ctx.ui.dialog(close => {
            const apiIn = h('input', { type: 'text', inputmode: 'url', autocomplete: 'off', placeholder: 'https://pa-push.<konto>.workers.dev', value: (Y.state && Y.state.api) || S.CONFIG.PUSH_API || '' });
            const secretIn = h('input', { type: 'password', autocomplete: 'off' });
            const pw1 = h('input', { type: 'password', autocomplete: mode === 'setup' ? 'new-password' : 'current-password' });
            const pw2 = h('input', { type: 'password', autocomplete: 'new-password' });
            const nameIn = h('input', { type: 'text', value: defaultName(), maxlength: 60 });
            const resetBox = h('input', { type: 'checkbox' });
            const msg = h('div', { class: 'small', style: { color: 'var(--danger)', minHeight: '1.2em' } });
            const submit = h('button', { type: 'submit', class: 'btn btn-primary' }, mode === 'setup' ? 'Einrichten' : 'Verbinden');
            const form = h('form', { onsubmit: async e => {
              e.preventDefault(); msg.textContent = '';
              const pw = pw1.value;
              if (mode === 'setup') {
                if (!secretIn.value) { msg.textContent = 'Bitte den Einrichtungs-Code (SETUP_SECRET) eingeben.'; return; }
                if (pw.length < 12) { msg.textContent = 'Das Sync-Passwort muss mindestens 12 Zeichen haben.'; return; }
                if (pw !== pw2.value) { msg.textContent = 'Die Passwörter stimmen nicht überein.'; return; }
                if (resetBox.checked && !await confirm('Konto zurücksetzen löscht alle Daten auf dem Server und meldet alle anderen Geräte ab. Die Daten auf den Geräten bleiben erhalten. Fortfahren?', { ok: 'Zurücksetzen', danger: true })) return;
              } else if (!pw) { msg.textContent = 'Bitte das Sync-Passwort eingeben.'; return; }
              submit.disabled = true; submit.textContent = 'Schlüssel werden berechnet …';
              try {
                await Y.connect({ api: apiIn.value, mode, setupSecret: secretIn.value, password: pw, deviceName: nameIn.value, reset: resetBox.checked });
                close(true);
              } catch (err) {
                msg.textContent = err.code === 'account_exists' ? 'Es gibt bereits ein Konto. Nutze „Mit bestehendem Konto verbinden“ oder setze das Konto zurück.' : err.message;
                submit.disabled = false; submit.textContent = mode === 'setup' ? 'Einrichten' : 'Verbinden';
              }
            } },
              h('h3', {}, mode === 'setup' ? 'Einrichten' : 'Verbinden'),
              h('div', { class: 'stack' },
                field('Server', apiIn),
                mode === 'setup' ? field('SETUP_SECRET', secretIn) : null,
                field('Sync-Passwort', pw1, mode === 'setup' ? 'Min. 12 Zeichen – gut merken!' : null),
                mode === 'setup' ? field('Sync-Passwort wiederholen', pw2) : null,
                field('Gerätename', nameIn),
                mode === 'setup' ? h('label', { class: 'switch small' }, resetBox, h('span', {}, 'Bestehendes Konto ersetzen')) : null,
                msg),
              h('div', { class: 'dlg-actions' }, h('button', { type: 'button', class: 'btn', onclick: () => close(false) }, 'Abbrechen'), submit));
            return form;
          }, { modal: true, label: 'Push & Sync' });

          if (!Y.enabled()) {
            const revoked = !!(Y.state && Y.state.revoked);
            parts.sync.replaceChildren(card('cloud Push & Sync',
              revoked ? h('div', { class: 'ro-banner' }, 'Abgemeldet – neu verbinden, Daten sind noch da') : h('p', { class: 'small muted', style: { marginTop: 0 } }, 'Aus – Daten nur auf diesem Gerät'),
              h('div', { class: 'row' },
                h('button', { class: 'btn btn-primary', onclick: async () => { if (await connectDialog('setup')) { toast('Push & Sync eingerichtet'); renderSync(); } } }, 'Einrichten'),
                h('button', { class: 'btn', onclick: async () => { if (await connectDialog('login')) { toast('Verbunden – Daten werden abgeglichen'); renderSync(); } } }, 'Verbinden'))));
            return;
          }

          const st = Y.state;
          const pending = await Y.pendingCount();
          const statusText = { idle: 'bereit', ok: 'ok', syncing: '⟳ läuft …', offline: 'offline', error: 'Fehler: ' + Y.lastError, auth: 'abgemeldet' }[Y.status] || Y.status;
          const pushText = !P.supported() ? 'nicht unterstützt' : P.subscribedHere ? 'an' : S.Notify.permission() === 'denied' ? 'blockiert' : 'aus';
          const devBox = h('div');
          const b = {};
          b.sync = h('button', { class: 'btn btn-primary' }, ctx.ui.icon('refresh'), 'Sync');
          b.sync.onclick = busy(b.sync, async () => { await Y.run(); if (Y.status !== 'ok') throw new Error(Y.lastError || 'Synchronisierung fehlgeschlagen'); toast('Synchronisiert'); });
          b.push = h('button', { class: 'btn' + (P.subscribedHere ? '' : ' btn-primary') }, P.subscribedHere ? 'Push aus' : 'Push an');
          b.push.onclick = busy(b.push, async () => { if (P.subscribedHere) { await P.disable(); toast('Push aus'); } else { await P.enable(); toast('Push an'); } });
          b.test = h('button', { class: 'btn' }, 'Test-Push');
          b.test.onclick = busy(b.test, async () => {
            const r = await P.test();
            if (!r.total) { toast('Kein Gerät hat Push aktiviert'); return; }
            const bad = (r.results || []).filter(x => !x.ok);
            toast(bad.length ? `Test-Push: ${r.sent} von ${r.total} angenommen. Abgelehnt: ${bad.map(x => `${x.host} → ${x.status} ${x.reason}`).join('; ')}` : `Test-Push an ${r.sent} von ${r.total} Geräten gesendet`, { type: bad.length ? 'error' : undefined, timeout: bad.length ? 15000 : 4000 });
          });
          const diagBox = h('div', { class: 'small' });
          const loadDiag = async () => {
            try {
              const d = await S.Api.req('GET', '/v1/status');
              const cronAge = d.cronAt ? (d.now - d.cronAt) / 1000 : null;
              const rows = [
                h('dt', {}, 'Server-Takt'), h('dd', {}, cronAge == null ? 'Cron ist noch nie gelaufen (Cron-Trigger im Worker prüfen)' : cronAge < 150 ? `läuft (zuletzt vor ${Math.round(cronAge)} s)` : `zuletzt vor ${U.formatDuration(cronAge / 60)} – Cron-Trigger prüfen`),
                h('dt', {}, 'Absender'), h('dd', {}, d.vapidSubject === 'ungültig' ? 'VAPID_SUBJECT fehlt/ungültig' : d.vapidSubject),
              ];
              if (!d.subscriptions.length) rows.push(h('dt', {}, 'Abo'), h('dd', {}, P.subscribedHere ? 'Server kennt kein Abo dieses Geräts – „Push hier deaktivieren“ und neu aktivieren' : 'keins'));
              d.subscriptions.forEach(s => rows.push(h('dt', {}, 'Letzter Push'), h('dd', {}, s.lastAt
                ? `${U.relTime(s.lastAt)} an ${s.host}: ${s.lastStatus >= 200 && s.lastStatus < 300 ? 'angenommen (' + s.lastStatus + ')' : 'abgelehnt ' + s.lastStatus + ' ' + (s.lastReason || '')}${s.failCount ? ` · ${s.failCount} Fehler in Folge` : ''}`
                : `noch keiner an ${s.host}`)));
              // Empfang laut Service Worker dieses Geräts (auch bei geschlossener App)
              const logs = (await S.pushLog()).slice(0, 5);
              rows.push(h('dt', {}, 'Empfangen hier'), h('dd', {}, logs.length ? logs.map(l => `${new Date(l.at).toLocaleTimeString('de-DE')}${l.type === 'test' ? ' (Test)' : ''}`).join(' · ') : 'noch kein Push empfangen'));
              if (d.lastReceivedAt) rows.push(h('dt', {}, 'Server weiß'), h('dd', {}, `letzter Empfang ${U.relTime(d.lastReceivedAt)}`));
              if (d.migrationMissing) rows.push(h('dt', {}, 'Hinweis'), h('dd', {}, 'D1-Migration 0002 fehlt: npx wrangler d1 migrations apply pa-db --remote'));
              diagBox.replaceChildren(h('dl', { class: 'kv', style: { marginTop: '8px' } }, rows));
            } catch (err) { diagBox.replaceChildren(h('span', { class: 'muted' }, err.status === 404 ? 'Diagnose braucht Worker-Version 1.1 (Worker neu deployen).' : 'Diagnose nicht verfügbar: ' + err.message)); }
          };
          loadDiag();
          b.dev = h('button', { class: 'btn btn-sm' }, 'Geräte');
          b.dev.onclick = async () => {
            try {
              const { devices } = await S.Api.req('GET', '/v1/devices');
              devBox.replaceChildren(h('table', { class: 'simple' }, h('tbody', {}, devices.map(d => h('tr', {},
                h('td', {}, h('strong', {}, d.name || 'Gerät'), d.current ? h('span', { class: 'pill blue', style: { marginLeft: '6px' } }, 'dieses') : null,
                  h('div', { class: 'small muted' }, `${d.push ? 'Push' : 'ohne Push'} · zuletzt ${d.lastSeenAt ? U.relTime(d.lastSeenAt) : '–'} · seit ${U.formatDate(d.createdAt, false)}`)),
                h('td', { style: { textAlign: 'right' } }, d.current ? null : h('button', { class: 'btn btn-sm', onclick: async () => {
                  if (!await confirm(`Gerät „${d.name}“ abmelden? Es erhält dann keine Pushes mehr und synchronisiert nicht mehr. Seine lokalen Daten bleiben erhalten.`, { ok: 'Abmelden', danger: true })) return;
                  try { await S.Api.req('DELETE', `/v1/devices/${encodeURIComponent(d.id)}`); toast('Gerät abgemeldet'); b.dev.onclick(); } catch (err) { toast(err.message, { type: 'error' }); }
                } }, 'Abmelden')))))));
            } catch (err) { toast(err.message, { type: 'error' }); }
          };
          b.pw = h('button', { class: 'btn btn-sm' }, 'Passwort');
          b.pw.onclick = async () => {
            const ok = await ctx.ui.dialog(close => {
              const cur = h('input', { type: 'password', autocomplete: 'current-password' });
              const n1 = h('input', { type: 'password', autocomplete: 'new-password' });
              const n2 = h('input', { type: 'password', autocomplete: 'new-password' });
              const msg = h('div', { class: 'small', style: { color: 'var(--danger)', minHeight: '1.2em' } });
              const sub = h('button', { type: 'submit', class: 'btn btn-primary' }, 'Ändern');
              return h('form', { onsubmit: async e => {
                e.preventDefault(); msg.textContent = '';
                if (n1.value.length < 12) { msg.textContent = 'Mindestens 12 Zeichen.'; return; }
                if (n1.value !== n2.value) { msg.textContent = 'Die neuen Passwörter stimmen nicht überein.'; return; }
                sub.disabled = true; sub.textContent = 'Bitte warten …';
                try { await Y.changePassword(cur.value, n1.value); close(true); }
                catch (err) { msg.textContent = err.message; sub.disabled = false; sub.textContent = 'Ändern'; }
              } },
                h('h3', {}, 'Sync-Passwort ändern'),
                h('p', { class: 'small muted' }, 'Alle Daten werden mit dem neuen Passwort neu verschlüsselt und hochgeladen. Alle anderen Geräte werden abgemeldet und müssen sich mit dem neuen Passwort neu verbinden (ihre lokalen Daten bleiben erhalten).'),
                h('div', { class: 'stack' }, field('Bisheriges Sync-Passwort', cur), field('Neues Sync-Passwort', n1), field('Neues Sync-Passwort wiederholen', n2), msg),
                h('div', { class: 'dlg-actions' }, h('button', { type: 'button', class: 'btn', onclick: () => close(false) }, 'Abbrechen'), sub));
            }, { modal: true, label: 'Sync-Passwort ändern' });
            if (ok) { toast('Sync-Passwort geändert'); renderSync(); }
          };
          b.off = h('button', { class: 'btn btn-sm' }, 'Abmelden');
          b.off.onclick = async () => {
            if (!await confirm('Dieses Gerät vom Push-Dienst abmelden? Es bekommt dann keine Pushes mehr und gleicht nicht mehr ab. Alle Daten auf diesem Gerät bleiben erhalten.', { ok: 'Abmelden', danger: true })) return;
            await Y.disconnect(); toast('Abgemeldet – lokale Daten bleiben erhalten'); renderSync();
          };
          parts.sync.replaceChildren(card('cloud Push & Sync',
            h('dl', { class: 'kv' },
              h('dt', {}, 'Status'), h('dd', {}, statusText),
              h('dt', {}, 'Zuletzt'), h('dd', {}, st.lastOkAt ? U.relTime(st.lastOkAt) : '–'),
              h('dt', {}, 'Offen'), h('dd', {}, String(pending)),
              h('dt', {}, 'Push hier'), h('dd', {}, pushText),
              h('dt', {}, 'Gerät'), h('dd', {}, st.deviceName || '–'),
              h('dt', {}, 'Server'), h('dd', {}, st.api)),
            h('div', { class: 'row', style: { marginTop: '12px' } }, b.sync, P.supported() ? b.push : null, b.test),
            h('details', { class: 'fold' }, h('summary', {}, 'Diagnose'), diagBox, h('button', { class: 'btn btn-sm', style: { marginTop: '8px' }, onclick: loadDiag }, 'Aktualisieren')),
            h('details', { class: 'fold' }, h('summary', {}, 'Geräte & Konto'),
              h('div', { class: 'row' }, b.dev, b.pw, b.off), devBox)));
        };
        await renderSync();

        /* Datensicherung */
        const renderBackup = async () => {
          const list = await S.Backup.list();
          const fileIn = h('input', { type: 'file', accept: 'application/json,.json', class: 'sr-only', onchange: async e => {
            const f = e.target.files[0]; e.target.value = ''; if (!f) return;
            try {
              const data = JSON.parse(await f.text()); S.Backup.validate(data);
              const mode = await choose('Sicherung importieren', [
                { label: 'Zusammenführen (neuere Einträge gewinnen)', value: 'merge', primary: true },
                { label: 'Ersetzen (aktuelle Daten der enthaltenen Module überschreiben)', value: 'replace', danger: true },
              ], `Datei vom ${data.exportedAt ? new Date(data.exportedAt).toLocaleString('de-DE') : '?'}, App-Version ${data.appVersion}. Vorher wird automatisch ein Schnappschuss angelegt.`);
              if (!mode) return;
              const rep = await S.Backup.importData(data, mode);
              await confirm(`Importiert: ${rep.imported.join(', ') || '–'}${rep.skipped.length ? '\nÜbersprungen: ' + rep.skipped.join(', ') : ''}\n\nDie App wird jetzt neu geladen.`, { ok: 'Neu laden', cancel: 'Später' }) && location.reload();
            } catch (err) { toast('Import fehlgeschlagen: ' + err.message, { type: 'error' }); }
          } });
          const lastExport = await S.lastExportAt();
          parts.sicherung.replaceChildren(card('save Datensicherung',
            h('p', { class: 'small muted', style: { marginTop: 0 } }, lastExport ? `Export: ${U.formatDateTimeFull(lastExport)}` : 'Kein Export'),
            h('div', { class: 'row' },

        parts.doku.append(card('book Dokumentation',
          doc('Wichtig: Daten & iPhone',
            'Deine Daten liegen im Speicher des Browsers bzw. der Home-Bildschirm-App – nicht in den Dateien der App. Neue Versionen ändern daran nichts.',

            'Nach dem Neu-Hinzufügen: Einstellungen → Push & Sync → Verbinden (Server-Adresse + Sync-Passwort). ToDos, Tägliche Ziele, Ernährung und Einkaufen kommen zurück. Nicht synchronisiert werden: Moduleinstellungen (z. B. kcal-Ziel, Abfragezeiten, Standard-Intervall), Wecker, Ruhezeiten, Darstellung, Schnappschüsse.'),
          doc('Erinnerungen',
            'Ein offenes ToDo erinnert im gewählten Intervall, bis du es abhakst. Mit Abgabe werden die Abstände kürzer, je näher sie rückt (ca. 4 Erinnerungen je verbleibendem Abschnitt, nie seltener als das Intervall). Pünktlich zur Abgabe: „Jetzt fällig“. Danach im Abstand „Überfällig“ (Standard 15 Min).',

            'Ohne Push & Sync erinnert die App nur, solange sie geöffnet ist; Verpasstes wird beim Öffnen gesammelt nachgeholt.'),
          doc('ToDos',
            ['Symbole: ↻ Intervall · Glocke nächste Erinnerung · Kalender Abgabe · Warnung überfällig · „18×“ bisherige Erinnerungen.',

             'Linker Farbbalken: Abgabe in < 24 Std (orange) oder überfällig (rot).',
             'Startseite: Abhaken direkt dort, Antippen springt zum ToDo, + legt ein neues an.']),
          doc('Tägliche Ziele',
            ['Abfrage jeden Abend (Standard 20:30) und sonntags für die Woche (20:00); im Modul über das Einstellungs-Symbol änderbar. Liegt die Uhrzeit in der Ruhezeit, kommt sie danach. Ist schon alles abgehakt, entfällt die Abfrage.',
             `Punkte: alle Tagesziele erledigt +${1} · je Wochenziel +3 · alle Wochenziele +5 Bonus. Punkte werden beim Speichern festgehalten.`,
             'Serie (Flamme): Tage in Folge mit allen Tageszielen. Ein nicht beantworteter Tag beendet sie.',

          doc('Ernährung',

          doc('Wecker',

             'Gerne-Liste (Stern oben): Lebensmittel, die du gerne kaufst. Der Stern an einem Posten fügt ihn hinzu oder entfernt ihn. Beim Abhaken wird der Kauf vermerkt (höchstens einmal je 12 Std); daraus ergibt sich der übliche Abstand (↻ … T).',

          doc('Taschenrechner',
            ['Belegung wie Casio ClassWiz CW (fx-87DE CW): goldene Beschriftung = SHIFT, pinke = ALPHA. Statuszeile: S/A, M (Speicher ≠ 0), STO, INS, Winkeleinheit, Math/Dec.',
             'Natural Display: Bruch, Wurzel, Potenz, log zur Basis, Abs, ×10ˣ als Vorlagen. ◀ ▶ bewegen den Cursor, ▲ ▼ wechseln zwischen Zähler und Nenner bzw. blättern im Verlauf (letzte 30 Rechnungen).',
             'Ergebnis exakt (Bruch, Wurzelterm, π) bei MathI/MathO; S⇔D wechselt zu Dezimal, SHIFT = (≈) rechnet direkt dezimal. Dezimalkomma in der Eingabe → Dezimalergebnis. SHIFT S⇔D: gemischter ⇔ unechter Bruch. °′″ nach einem Ergebnis: Anzeige in Grad/Minuten/Sekunden.',
             'Nach einem Ergebnis: Operator (+, ×, x², …) rechnet mit Ans weiter; Zahl/Funktion beginnt neu; ◀ ▶ bearbeiten die letzte Eingabe.',

             'MENU: Berechnungen, Tabelle (f(x), Start/Ende/Schritt, max. 45 Zeilen), Gleichungen (Gleichungssystem 2–4 Unbekannte, Polynom Grad 2–4, auch komplexe Lösungen). In Tabellen und Gleichungen: = bestätigt, AC geht zurück.',
             'SHIFT MENU (SETUP): Ein-/Ausgabe, Winkeleinheit (Standard Grad), Zahlenformat (Norm 1/2, Fix, Sci), Bruchergebnis. SHIFT 9 (RESET), SHIFT AC (OFF), ON schaltet ein bzw. löscht. Nicht verfügbar: QR-Code und die übrigen Apps des Originals (Statistik, Verteilung, Tabellenkalkulation, Ungleichungen u. a.).',
             'Am Computer auch per Tastatur: Ziffern, + − * / ^ ( ) , . Enter, Rücktaste, Esc, Pfeiltasten. Variablen, Verlauf und Setup bleiben nur auf diesem Gerät.']),
          doc('Push & Sync',
            ['Eigener Push-Dienst (Cloudflare Worker): Erinnerungen auch bei geschlossener App, Abgleich zwischen Geräten. Inhalte sind Ende-zu-Ende-verschlüsselt; der Server sieht nur Zeiten und Status.',
             'Erstes Gerät: „Einrichten“ (mit SETUP_SECRET). Jedes weitere: „Verbinden“ mit Server-Adresse und Sync-Passwort.',
             'Sync-Passwort vergessen = Server-Daten unlesbar. Lokale Daten bleiben; „Einrichten“ mit „Bestehendes Konto ersetzen“ lädt sie neu hoch.',
             'Push an/aus gilt nur für dieses Gerät. iPhone: Push nur in der Home-Bildschirm-App.']),
          doc('Datensicherung',
            ['Export = unverschlüsselte JSON-Datei mit allen Daten, ohne Zugangsdaten. Sicher ablegen.',
             'Import: Zusammenführen (neuere Einträge gewinnen) oder Ersetzen. Vorher wird automatisch ein Schnappschuss angelegt.',
             'Schnappschüsse entstehen automatisch vor Updates, Migrationen, Importen und täglich; sie liegen nur auf diesem Gerät.',
             '„Dauerhaft“: Der Browser löscht die Daten nicht bei Speichermangel. Installation als App hilft.']),
          doc('Updates',
            ['Neue Versionen erscheinen nach dem Hochladen in 1–2 Minuten (GitHub Pages). Die App prüft beim Start und alle 30 Min; dann erscheint oben „Jetzt neu laden“.',
             'Über → „Updates prüfen“ prüft sofort; „Neu laden“ lädt die App an allen Zwischenspeichern vorbei neu (wichtig in der Home-Bildschirm-App ohne Neu-laden-Knopf). Daten bleiben dabei erhalten.'])));

        /* Über */
        parts.ueber.append(card('info Über',
          h('dl', { class: 'kv' }, h('dt', {}, 'Version'), h('dd', {}, S.CONFIG.APP_VERSION), h('dt', {}, 'Datenbank'), h('dd', {}, S.CONFIG.DB_NAME)),
          h('div', { class: 'row', style: { marginTop: '10px' } },
            h('button', { class: 'btn btn-sm', onclick: async e => {
              const b = e.currentTarget; b.disabled = true;
              const r = await S.VersionGuard.checkRemote(); b.disabled = false;
              if (r.status === 'newer') toast(`Neue Version ${r.version}`, { action: 'Neu laden', onAction: () => S.SWReg.applyUpdate() });
              else if (r.status === 'current') toast(`Aktuell (${r.version})`);
              else toast('Prüfung fehlgeschlagen – offline?', { type: 'error' });
            } }, ctx.ui.icon('refresh'), 'Updates prüfen'),
            h('button', { class: 'btn btn-sm', onclick: () => S.SWReg.applyUpdate() }, ctx.ui.icon('download'), 'Neu laden')),
          h('details', { class: 'fold' }, h('summary', {}, 'Changelog'),
            ...S.CHANGELOG.map(c => h('div', {}, h('strong', {}, `${c.version} · ${c.date}`), h('ul', { class: 'small' }, c.items.map(i => h('li', {}, i))))))));

        /* Diagnose */
        const renderDiag = () => {
          const tests = S.Schedule.selfTest();
          const allOk = tests.every(t => t.ok);
          parts.diagnose.replaceChildren(card('activity Diagnose',
            h('details', { class: 'fold' }, h('summary', {}, `Eskalation ${allOk ? '✓' : '✗'}`),
              h('table', { class: 'simple' }, h('thead', {}, h('tr', {}, h('th', {}, 'Verbleibend (Stufe 1 Tag)'), h('th', {}, 'Erwartet'), h('th', {}, 'Ergebnis'))),
                h('tbody', {}, tests.map(t => h('tr', {}, h('td', {}, t.label), h('td', {}, typeof t.expected === 'number' ? `${t.expected} Min` : t.expected), h('td', { class: t.ok ? 'test-ok' : 'test-fail' }, (typeof t.got === 'number' ? `${t.got} Min` : t.got) + (t.ok ? ' ✓' : ' ✗'))))))),
            h('details', { class: 'fold' }, h('summary', {}, `Protokoll (${S.Log.entries.length})`),
              h('div', { class: 'log' }, S.Log.entries.slice().reverse().map(e => `${new Date(e.ts).toLocaleString('de-DE')} [${e.level}] ${e.moduleId}: ${e.msg}\n`)),
