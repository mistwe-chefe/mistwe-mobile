<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="app-version" content="1.14.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://*.workers.dev; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192-v5.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-v5.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Meine App">
  <meta name="theme-color" content="#1f2937">
  <title>Persönliche App</title>
  <script>
    /* Theme früh setzen, damit nichts flackert */
    (function () {
      try {
        var t = localStorage.getItem('pa:theme') || 'system';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>

  <style>
  /* ==== CORE: TOKENS ==== */
  :root {
    --bg: #f4f5f7; --surface: #ffffff; --surface-2: #eef0f3; --border: #dde1e7;
    --text: #111827; --muted: #6b7280; --primary: #2563eb; --primary-text: #ffffff;
    --danger: #dc2626; --warn: #d97706; --caution: #ca8a04; --ok: #16a34a;
    --danger-bg: #fee2e2; --warn-bg: #ffedd5; --caution-bg: #fef9c3; --ok-bg: #dcfce7; --primary-bg: #dbeafe;
    --radius: 12px; --radius-sm: 8px; --gap: 12px; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.05);
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --nav-h: 64px;
    color-scheme: light;
  }
  [data-theme="dark"] {
    --bg: #0f141b; --surface: #18202b; --surface-2: #222c39; --border: #2e3a4a;
    --text: #e5e7eb; --muted: #9aa4b2; --primary: #3b82f6; --primary-text: #ffffff;
    --danger: #f87171; --warn: #fb923c; --caution: #facc15; --ok: #4ade80;
    --danger-bg: #3b1518; --warn-bg: #3a2210; --caution-bg: #352f0b; --ok-bg: #10301c; --primary-bg: #172a4d;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
    color-scheme: dark;
  }
  /* ==== ENDE CORE: TOKENS ==== */

  /* ==== CORE: BASIS ==== */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; min-height: 100dvh; }
  h1, h2, h3 { line-height: 1.2; margin: 0 0 .6em; }
  h2 { font-size: 1.4rem; }
  h3 { font-size: 1.05rem; }
  a { color: var(--primary); }
  .shell { min-height: 100dvh; display: flex; flex-direction: column; }
  .topbar { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--border); padding: calc(env(safe-area-inset-top) + 10px) 16px 10px; display: flex; align-items: center; gap: 10px; }
  .topbar .brand { font-weight: 700; font-size: 1.05rem; flex: 1; }
  .topbar .sync-dot { font-size: .8rem; color: var(--muted); }
  .banners:empty { display: none; }
  .banner { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--primary-bg); border-bottom: 1px solid var(--border); font-size: .95rem; }
  .banner.warn { background: var(--warn-bg); }
  .banner .grow { flex: 1; }
  .layout { flex: 1; display: flex; }
  main#view { flex: 1; padding: 16px 16px calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px); max-width: 780px; width: 100%; margin: 0 auto; }
  .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; background: var(--surface); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom); overflow-x: auto; overflow-y: hidden; scrollbar-width: none; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; scroll-snap-type: x proximity; }
  .nav::-webkit-scrollbar { display: none; }   /* untere Leiste waagerecht scrollbar, wenn die Symbole nicht passen */
  .nav a { flex: 1 0 56px; scroll-snap-align: start; min-height: var(--nav-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--muted); font-size: .72rem; position: relative; }
  .nav a .ic { font-size: 1.35rem; line-height: 1; display: flex; }
  .nav a .ic svg.icon { width: 26px; height: 26px; }
  .nav a .lbl { display: none; }   /* untere Leiste: nur Symbole (Projektregel) */
  .nav a.active { color: var(--primary); font-weight: 600; }
  .nav a .count { position: absolute; top: 6px; left: calc(50% + 6px); background: var(--danger); color: #fff; border-radius: 999px; font-size: .68rem; min-width: 18px; height: 18px; padding: 0 5px; display: flex; align-items: center; justify-content: center; font-weight: 700; }
  @media (min-width: 900px) {
    .nav { position: sticky; top: 57px; bottom: auto; flex-direction: column; width: 220px; height: calc(100dvh - 57px); border-top: 0; border-right: 1px solid var(--border); padding: 12px 8px; overflow-x: hidden; overflow-y: auto; scroll-snap-type: none; }
    .nav a { flex: 0 0 auto; flex-direction: row; justify-content: flex-start; gap: 12px; padding: 0 14px; min-height: 46px; border-radius: var(--radius-sm); font-size: .95rem; }
    .nav a.active { background: var(--primary-bg); }
    .nav a .count { position: static; margin-left: auto; }
    .nav a .lbl { display: inline; }   /* breite Seitenleiste: Symbol + Name */
    main#view { padding-bottom: 40px; }
  }
  .lock-overlay { position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; padding: 24px; }
  .lock-overlay .card { max-width: 420px; }
  /* ==== ENDE CORE: BASIS ==== */

  /* ==== CORE: KOMPONENTEN ==== */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); margin-bottom: var(--gap); }
  .card > h3:first-child { margin-top: 0; }
  .muted { color: var(--muted); }
  .small { font-size: .85rem; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .row.nowrap { flex-wrap: nowrap; }
  .stack > * + * { margin-top: 10px; }
  .grow { flex: 1; min-width: 0; }
  .btn { appearance: none; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); border-radius: var(--radius-sm); min-height: 44px; padding: 0 16px; font: inherit; font-size: .95rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; white-space: nowrap; }
  .btn:hover { filter: brightness(.97); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn-primary { background: var(--primary); border-color: var(--primary); color: var(--primary-text); }
  .btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
  .btn-ghost { background: transparent; border-color: transparent; }
  .btn-sm { min-height: 36px; padding: 0 12px; font-size: .88rem; }
  .btn-block { width: 100%; }
  input[type=text], input[type=search], input[type=password], input[type=datetime-local], input[type=time], input[type=number], select, textarea {
    font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); min-height: 44px; padding: 8px 12px; width: 100%; }
  textarea { min-height: 90px; resize: vertical; }
  /* iOS/Safari: Datums-/Zeitfelder haben eine eigene Mindestbreite und -höhe und ragen sonst aus Spalten heraus */
  input[type=time], input[type=date], input[type=datetime-local] { -webkit-appearance: none; appearance: none; display: block; min-width: 0; max-width: 100%; height: 44px; line-height: 26px; text-align: left; }
  input[type=time]::-webkit-date-and-time-value, input[type=date]::-webkit-date-and-time-value, input[type=datetime-local]::-webkit-date-and-time-value { text-align: left; margin: 0; }
  label.field { min-width: 0; }
  label.field.grow { flex: 1 1 0; }
  input:focus, select:focus, textarea:focus, .btn:focus-visible, .chip:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
  label.field { display: block; }
  label.field > span { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 4px; }
  .switch { display: flex; align-items: center; gap: 10px; min-height: 44px; cursor: pointer; }
  .switch input { width: 20px; height: 20px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chips.scroll { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
  .chip { appearance: none; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 999px; min-height: 36px; padding: 0 14px; font: inherit; font-size: .88rem; cursor: pointer; white-space: nowrap; }
  .chip[aria-checked="true"], .chip.on { background: var(--primary); border-color: var(--primary); color: var(--primary-text); }
  .pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 1px 9px; font-size: .78rem; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
  .pill.red { background: var(--danger-bg); color: var(--danger); font-weight: 600; }
  .pill.orange { background: var(--warn-bg); color: var(--warn); font-weight: 600; }
  .pill.yellow { background: var(--caution-bg); color: var(--caution); }
  .pill.blue { background: var(--primary-bg); color: var(--primary); }
  .pill.green { background: var(--ok-bg); color: var(--ok); }
  .pill.nag { --nag-l: 34%; background: hsl(var(--nag-h) 75% 45% / .16); color: hsl(var(--nag-h) 80% var(--nag-l)); font-weight: 600; }
  [data-theme="dark"] .pill.nag { --nag-l: 62%; background: hsl(var(--nag-h) 70% 45% / .2); }
  .empty { text-align: center; color: var(--muted); padding: 24px 8px; }
  .toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 12px); z-index: 200; display: flex; flex-direction: column; gap: 8px; width: min(92vw, 440px); pointer-events: none; }
  @media (min-width: 900px) { .toasts { bottom: 24px; } }
  .toast { pointer-events: auto; background: #1f2937; color: #f9fafb; border-radius: var(--radius-sm); padding: 10px 14px; display: flex; align-items: center; gap: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.25); animation: toast-in .18s ease-out; }
  .toast.error { background: #7f1d1d; }
  .toast .grow { font-size: .93rem; }
  .toast button { background: transparent; border: 0; color: #93c5fd; font: inherit; font-weight: 700; cursor: pointer; min-height: 36px; padding: 0 4px; }
  @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  dialog.dlg { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); padding: 0; width: min(94vw, 520px); max-height: 90dvh; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
  dialog.dlg::backdrop { background: rgba(0,0,0,.45); }
  dialog.dlg .dlg-body { padding: 18px; overflow-y: auto; max-height: calc(90dvh - 2px); }
  dialog.dlg .dlg-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 16px; }
  .error-card { border-color: var(--danger); background: var(--danger-bg); }
  .error-card pre { white-space: pre-wrap; font-size: .8rem; max-height: 200px; overflow: auto; }
  .ro-banner { background: var(--warn-bg); border: 1px solid var(--warn); color: var(--text); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 12px; font-size: .92rem; }
  details.fold > summary { cursor: pointer; list-style: none; padding: 10px 0; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 6px; min-height: 44px; }
  details.fold > summary::-webkit-details-marker { display: none; }
  details.fold > summary::before { content: '▸'; transition: transform .15s; }
  details.fold[open] > summary::before { transform: rotate(90deg); }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: .92rem; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; word-break: break-word; }
  table.simple { width: 100%; border-collapse: collapse; font-size: .88rem; }
  table.simple td, table.simple th { border-bottom: 1px solid var(--border); padding: 6px 4px; text-align: left; vertical-align: top; }
  svg.icon { width: 1.15em; height: 1.15em; flex: 0 0 auto; vertical-align: -0.2em; }
  .pill svg.icon { width: 1em; height: 1em; }
  .card h3 svg.icon { color: var(--muted); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  /* ==== ENDE CORE: KOMPONENTEN ==== */

  /* ==== MODUL-CSS: start ==== */
  [data-module="start"] .topline { display: flex; align-items: center; gap: 10px; margin: 0 4px 10px; min-height: 22px; }
  [data-module="start"] .date { flex: 1; font-size: .9rem; }
  [data-module="start"] .hstats { display: flex; gap: 10px; }
  [data-module="start"] .hstat { display: inline-flex; align-items: center; gap: 3px; font-size: .9rem; font-weight: 700; color: var(--text); text-decoration: none; }
  [data-module="start"] .hstat svg.icon { width: 15px; height: 15px; color: var(--warn); }
  [data-module="einstellungen"] .doc p, [data-module="einstellungen"] .doc ul { margin: 6px 0; }
  [data-module="einstellungen"] .doc ul { padding-left: 18px; }
  [data-module="einstellungen"] .doc li { margin: 4px 0; }
  textarea.autogrow { resize: none; overflow-y: auto; min-height: 44px; }
  [data-module="start"] .hint { padding: 8px 10px 8px 12px; font-size: .9rem; }
  [data-module="start"] .widgets { display: flex; flex-direction: column; gap: var(--gap); margin-bottom: var(--gap); }
  [data-module="start"] .widget { padding: 0; overflow: hidden; }
  .widget[data-module="ernaehrung"] .w-mini { display: flex; align-items: center; gap: 12px; padding: 10px 14px; color: var(--text); text-decoration: none; }
  .widget[data-module="ernaehrung"] .w-ic { width: 20px; height: 20px; color: var(--primary); flex: 0 0 auto; }
  .widget[data-module="ernaehrung"] .w-cell { flex: 1; min-width: 0; }
  .widget[data-module="ernaehrung"] .w-val { font-weight: 700; font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .widget[data-module="ernaehrung"] .w-unit { font-weight: 500; font-size: .8rem; color: var(--muted); }
  .widget[data-module="ernaehrung"] .w-lbl { font-size: .75rem; color: var(--muted); }
  [data-module="start"] .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: var(--gap); }
  [data-module="start"] .module-btn { min-height: 64px; font-size: 1.05rem; font-weight: 600; background: var(--surface); box-shadow: var(--shadow); gap: 10px; }
  [data-module="start"] .module-btn svg.icon { width: 22px; height: 22px; color: var(--primary); }
  [data-module="start"] .hint { display: flex; gap: 10px; align-items: center; }
  [data-module="start"] .hint-ic { width: 20px; height: 20px; color: var(--muted); }
  /* ==== ENDE MODUL-CSS: start ==== */

  /* ==== MODUL-CSS: einstellungen ==== */
  [data-module="einstellungen"] .card h3 { display: flex; align-items: center; gap: 8px; }
  [data-module="einstellungen"] .log { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .78rem; max-height: 260px; overflow: auto; background: var(--surface-2); border-radius: var(--radius-sm); padding: 8px; white-space: pre-wrap; }
  [data-module="einstellungen"] .test-ok { color: var(--ok); }
  [data-module="einstellungen"] .test-fail { color: var(--danger); font-weight: 700; }
  /* ==== ENDE MODUL-CSS: einstellungen ==== */

  /* ==== MODUL-CSS: todos ==== */
  [data-module="todos"] .composer .title-input { font-size: 1.05rem; }
  [data-module="todos"] .composer .lbl { font-size: .8rem; color: var(--muted); margin: 10px 0 6px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  [data-module="todos"] .composer .dl-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  [data-module="todos"] .composer .dl-row input { width: auto; flex: 1 1 200px; }
  [data-module="todos"] .composer .preview { font-size: .85rem; color: var(--muted); margin-top: 8px; }
  [data-module="todos"] .section-title { font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 18px 4px 8px; display: flex; align-items: center; gap: 8px; }
  [data-module="todos"] ul.todo-list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
  [data-module="todos"] li.todo { display: flex; align-items: flex-start; gap: 6px; padding: 6px 10px 6px 4px; border-bottom: 1px solid var(--border); }
  [data-module="todos"] li.todo:last-child { border-bottom: 0; }
  [data-module="todos"] li.todo.overdue { box-shadow: inset 4px 0 0 var(--danger); }
  [data-module="todos"] li.todo.soon { box-shadow: inset 4px 0 0 var(--warn); }
  [data-module="todos"] .check { flex: 0 0 44px; height: 44px; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
  [data-module="todos"] .check span { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--muted); display: block; transition: background .15s; }
  [data-module="todos"] .check:hover span { border-color: var(--ok); background: var(--ok-bg); }
  [data-module="todos"] li.todo.done .check span { background: var(--ok); border-color: var(--ok); }
  [data-module="todos"] li.todo.done .t-title { text-decoration: line-through; color: var(--muted); }
  [data-module="todos"] .t-body { flex: 1; min-width: 0; padding: 9px 0 6px; cursor: pointer; }
  [data-module="todos"] .t-title { font-weight: 500; word-break: break-word; }
  [data-module="todos"] .t-meta { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 5px; }
  [data-module="todos"] .t-note { font-size: .85rem; color: var(--muted); margin-top: 3px; white-space: pre-wrap; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  [data-module="todos"] { padding-bottom: 72px; }
  [data-module="todos"] .done-actions { display: flex; gap: 4px; align-items: center; padding-top: 4px; }
  [data-module="todos"] .head { display: flex; align-items: center; gap: 8px; }
  [data-module="todos"] .head h2 { flex: 1; margin: 0; }
  [data-module="todos"] .fab { position: fixed; z-index: 25; right: 16px; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px); border-radius: 999px; width: 56px; min-height: 56px; padding: 0; box-shadow: 0 6px 18px rgba(37,99,235,.35); }
  [data-module="todos"] .fab svg.icon { width: 26px; height: 26px; }
  @media (min-width: 900px) { [data-module="todos"] .fab { bottom: 28px; right: 32px; } }
  body:has([data-module="todos"] .fab) .toasts { bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 84px); }
  @media (min-width: 900px) { body:has([data-module="todos"] .fab) .toasts { bottom: 96px; } }
  [data-module="todos"] li.todo.flash { animation: todo-flash 2.2s ease-out; }
  @keyframes todo-flash { 0%, 40% { background: var(--primary-bg); } 100% { background: transparent; } }
  dialog.dlg .composer .lbl { font-size: .8rem; color: var(--muted); margin: 12px 0 6px; font-weight: 600; }
  dialog.dlg .composer .preview { font-size: .85rem; color: var(--muted); margin-top: 10px; }
  dialog.dlg .composer .dl-row input { width: 100%; }
  .iv { display: flex; gap: 8px; }
  .iv .iv-field { flex: 1; display: flex; align-items: center; gap: 6px; }
  .iv .iv-field input { text-align: right; min-width: 0; }
  .iv .iv-field span { color: var(--muted); font-size: .88rem; }
  .iv.invalid input { border-color: var(--danger); }
  /* Startseiten-Ausschnitt (Widget) */
  .widget[data-module="todos"] .w-head { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 14px; border-bottom: 1px solid var(--border); }
  .widget[data-module="todos"] .w-title { flex: 1; display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--text); text-decoration: none; min-height: 40px; }
  .widget[data-module="todos"] .w-title svg.icon { width: 20px; height: 20px; color: var(--primary); }
  .widget[data-module="todos"] .w-count { background: var(--primary-bg); color: var(--primary); border-radius: 999px; font-size: .78rem; padding: 1px 8px; font-weight: 700; }
  .widget[data-module="todos"] .w-scroll { height: max(130px, calc((100dvh - 57px - var(--nav-h) - env(safe-area-inset-bottom)) / 4)); overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
  .widget[data-module="todos"] ul.todo-list { border: 0; border-radius: 0; box-shadow: none; }
  .widget[data-module="todos"] li.todo { align-items: center; padding-top: 2px; padding-bottom: 2px; }
  .widget[data-module="todos"] .t-body { padding: 6px 0; }
  .widget[data-module="todos"] .t-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---- CORE: Utils ---- */
  const U = {
    uuid() {
      if (crypto.randomUUID) return crypto.randomUUID();
      const b = crypto.getRandomValues(new Uint8Array(16)); b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
      const x = [...b].map(v => v.toString(16).padStart(2, '0')).join('');
      return `${x.slice(0, 8)}-${x.slice(8, 12)}-${x.slice(12, 16)}-${x.slice(16, 20)}-${x.slice(20)}`;
    },
    now: () => Date.now(),
    pad: n => String(n).padStart(2, '0'),
    sameDay: (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(),
    formatDate(ts, withTime = true) {
      if (ts == null) return '';
      const d = new Date(ts), today = new Date();
      const off = n => { const x = new Date(); x.setDate(x.getDate() + n); return x; };
      let day;
      if (U.sameDay(d, today)) day = 'Heute';
      else if (U.sameDay(d, off(1))) day = 'Morgen';
      else if (U.sameDay(d, off(-1))) day = 'Gestern';
      else day = d.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit', ...(d.getFullYear() !== today.getFullYear() ? { year: 'numeric' } : {}) });
      return withTime ? `${day}, ${U.pad(d.getHours())}:${U.pad(d.getMinutes())}` : day;
    },
    formatDateTimeFull: ts => ts == null ? '' : new Date(ts).toLocaleString('de-DE'),
    formatDuration(min) {
      min = Math.max(0, Math.round(min));
      if (min < 1) return 'weniger als 1 Min';
      if (min < 60) return `${min} Min`;
      if (min < 1440) {
        const h = Math.floor(min / 60), m = min % 60;
        if (h < 6 && m) return `${h} Std ${m} Min`;
        return `${Math.round(min / 60)} Std`;
      }
      const d = Math.round(min / 1440);
      if (d < 14) return `${d} ${d === 1 ? 'Tag' : 'Tage'}`;
      if (d < 60) return `${Math.round(d / 7)} Wochen`;
      const mo = Math.round(d / 30);
      return `${mo} ${mo === 1 ? 'Monat' : 'Monate'}`;
    },
    relTime(ts, now = Date.now()) {
      const diff = (ts - now) / 60000;
      if (Math.abs(diff) < 1) return 'jetzt';
      return diff > 0 ? `in ${U.formatDuration(diff)}` : `vor ${U.formatDuration(-diff)}`;
    },
    toLocalInput(ts) {
      if (ts == null) return '';
      const d = new Date(ts);
      return `${d.getFullYear()}-${U.pad(d.getMonth() + 1)}-${U.pad(d.getDate())}T${U.pad(d.getHours())}:${U.pad(d.getMinutes())}`;
    },
    fromLocalInput(s) { if (!s) return null; const t = new Date(s).getTime(); return Number.isFinite(t) ? t : null; },
    minToTime: m => `${U.pad(Math.floor(m / 60))}:${U.pad(m % 60)}`,
    timeToMin(s) { const [h, m] = String(s || '').split(':').map(Number); return Number.isFinite(h) && Number.isFinite(m) ? h * 60 + m : null; },
    debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; },
    semverCompare(a, b) {
      const pa = String(a || '0').split('.').map(Number), pb = String(b || '0').split('.').map(Number);
      for (let i = 0; i < 3; i++) { const d = (pa[i] || 0) - (pb[i] || 0); if (d) return d > 0 ? 1 : -1; }
      return 0;
    },
    clone: v => (typeof structuredClone === 'function' ? structuredClone(v) : JSON.parse(JSON.stringify(v))),
    download(name, text, type = 'application/json') {
      const url = URL.createObjectURL(new Blob([text], { type }));
      const a = document.createElement('a'); a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    },
    formatBytes(n) { if (n == null) return '–'; const u = ['B', 'KB', 'MB', 'GB']; let i = 0; while (n >= 1024 && i < 3) { n /= 1024; i++; } return `${n.toFixed(i ? 1 : 0)} ${u[i]}`; },
    isIOS: () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1),
    isStandalone: () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true,
  };

  /* ---- CORE: Log (Diagnoseprotokoll) ---- */
  const Log = {
    entries: [],
    persist: null,
    async load() { this.entries = await Store.metaGet('diagnostics', []); this.persist = U.debounce(() => Store.metaSet('diagnostics', this.entries).catch(() => {}), 1500); },
    add(level, msg, moduleId = 'core') {
      const e = { ts: Date.now(), level, moduleId, msg: String(msg).slice(0, 1000) };
      this.entries.push(e); if (this.entries.length > 200) this.entries.splice(0, this.entries.length - 200);
      (level === 'error' ? console.error : level === 'warn' ? console.warn : console.log)(`[${moduleId}] ${msg}`);
      this.persist && this.persist();
    },
    info(m, id) { this.add('info', m, id); }, warn(m, id) { this.add('warn', m, id); }, error(m, id) { this.add('error', m, id); },
    forModule(id) { return { info: m => Log.info(m, id), warn: m => Log.warn(m, id), error: m => Log.error(m, id) }; },
  };

  /* ---- CORE: Store ---- */
  const IDB = {
    db: null,
    upgrade(db) {
      // Schema identisch in sw.js – nie ändern, nur ergänzen.
      if (!db.objectStoreNames.contains('kv')) {
        const s = db.createObjectStore('kv', { keyPath: 'k' });
        s.createIndex('by_module', 'm');
        s.createIndex('by_collection', ['m', 'c']);
      }
      if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'k' });
      if (!db.objectStoreNames.contains('backups')) db.createObjectStore('backups', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('outbox')) db.createObjectStore('outbox', { keyPath: 'id' });
    },
    open() {
      return new Promise((res, rej) => {
        if (!('indexedDB' in window)) return rej(new Error('IndexedDB wird von diesem Browser nicht unterstützt.'));
        const r = indexedDB.open(CONFIG.DB_NAME, CONFIG.DB_VERSION);
        r.onupgradeneeded = () => this.upgrade(r.result);
        r.onsuccess = () => {
          this.db = r.result;
          this.db.onversionchange = () => { this.db.close(); VersionGuard.lock('Die Datenbank wird von einer neueren Version verwendet. Bitte neu laden.'); };
          res(this.db);
        };
        r.onerror = () => rej(r.error || new Error('Datenbank konnte nicht geöffnet werden'));
        r.onblocked = () => Log.warn('Datenbank blockiert – andere Tabs schließen');
      });
    },
    rq(r) { return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
    async run(stores, mode, fn) {
      const names = Array.isArray(stores) ? stores : [stores];
      const t = this.db.transaction(names, mode);
      const done = new Promise((res, rej) => {
        t.oncomplete = () => res();
        t.onerror = () => rej(t.error);
        t.onabort = () => rej(t.error || new Error('Transaktion abgebrochen'));
      });
      let result;
      try { result = await fn(...names.map(n => t.objectStore(n)), t); }
      catch (e) { try { t.abort(); } catch (_) {} await done.catch(() => {}); throw e; }
      await done;
      return result;
    },
  };

  const Store = {
    async metaGet(k, def) { const r = await IDB.run('meta', 'readonly', s => IDB.rq(s.get(k))); return r ? r.v : def; },
    async metaSet(k, v) { await IDB.run('meta', 'readwrite', s => { s.put({ k, v }); }); },
    kvGet(k) { return IDB.run('kv', 'readonly', s => IDB.rq(s.get(k))); },
    kvPut(rec) { return IDB.run('kv', 'readwrite', s => { s.put(rec); }); },
    kvAll() { return IDB.run('kv', 'readonly', s => IDB.rq(s.getAll())); },
    kvByModule(m) { return IDB.run('kv', 'readonly', s => IDB.rq(s.index('by_module').getAll(m))); },
    kvByCollection(m, c) { return IDB.run('kv', 'readonly', s => IDB.rq(s.index('by_collection').getAll([m, c]))); },
    async kvDeleteModule(m) {
      await IDB.run('kv', 'readwrite', async s => {
        const keys = await IDB.rq(s.index('by_module').getAllKeys(m));
        keys.forEach(k => s.delete(k));
      });
    },
    changed(moduleId, collection) {
      Events.emit('store:changed', { moduleId, collection, remote: false });
      Tabs.post({ type: 'changed', moduleId, collection });
    },
    /** Modulbezogener Speicher – einzige Datenschnittstelle der Module */
    forModule(moduleId) {
      const guard = () => { if (Registry.isReadOnly(moduleId)) throw new Error('Modul ist schreibgeschützt.'); };
      const vKey = n => `${moduleId}/v:${n}`;
      const cKey = (c, id) => `${moduleId}/c:${c}/${id}`;
      return {
        async get(name, def) { const r = await Store.kvGet(vKey(name)); return r ? U.clone(r.v) : def; },
        async set(name, v) { guard(); await Store.kvPut({ k: vKey(name), m: moduleId, c: null, n: name, v: U.clone(v), u: Date.now() }); Store.changed(moduleId, null); },
        collection(c, opts = {}) {
          if (!/^[a-z0-9-]+$/i.test(c)) throw new Error('Ungültiger Collection-Name: ' + c);
          if (opts.sync) Sync.register(moduleId, c);
          const put = async rec => {
            const kv = { k: cKey(c, rec.id), m: moduleId, c, n: rec.id, v: rec, u: rec.updatedAt };
            if (opts.sync && Sync.enabled()) await Sync.putWithOutbox(kv, 'item'); else await Store.kvPut(kv);
            Store.changed(moduleId, c); return U.clone(rec);
          };
          const api = {
            sync: !!opts.sync,  // solche Collections werden Ende-zu-Ende-verschlüsselt synchronisiert
            async raw() { return (await Store.kvByCollection(moduleId, c)).map(r => r.v); },
            async all() { return (await api.raw()).filter(x => !x.deletedAt); },
            async get(id) { const r = await Store.kvGet(cKey(c, id)); return r && !r.v.deletedAt ? U.clone(r.v) : null; },
            async query(fn) { return (await api.all()).filter(fn); },
            async add(obj) {
              guard(); const t = Date.now();
              return put({ ...U.clone(obj), id: obj.id || U.uuid(), createdAt: t, updatedAt: t, deletedAt: null });
            },
            async update(id, patch) {
              guard(); const r = await Store.kvGet(cKey(c, id));
              if (!r) throw new Error('Datensatz nicht gefunden: ' + id);
              const { id: _i, createdAt: _c, ...rest } = U.clone(patch);
              return put({ ...r.v, ...rest, updatedAt: Math.max(Date.now(), (r.v.updatedAt || 0) + 1) });
            },
            async remove(id) { return api.update(id, { deletedAt: Date.now() }); },
          };
          return api;
        },
      };
    },
  };

  /* ---- CORE: Settings (global, lokal, nicht synchronisiert) ---- */
  const DEFAULT_SETTINGS = {
    quiet: { enabled: true, start: 22 * 60, end: 7 * 60, breakForDeadline: false },
    sound: true,
    vibrate: true,
    hiddenModules: [],
  };
  const Settings = {
    data: U.clone(DEFAULT_SETTINGS),
    async load() { const s = await Store.metaGet('settings', {}); this.data = { ...U.clone(DEFAULT_SETTINGS), ...s, quiet: { ...DEFAULT_SETTINGS.quiet, ...(s.quiet || {}) } }; },
    get(k) { return U.clone(this.data[k]); },
    async set(k, v) { this.data[k] = U.clone(v); await Store.metaSet('settings', this.data); Events.emit('settings:changed', { key: k }); },
  };

  /* ---- CORE: Migrator ---- */
  const Migrator = {
    /** Puffer für Migrationen: alle Änderungen erst im Speicher, dann in EINER Transaktion */
    buffer(moduleId, records) {
      const map = new Map(records.map(r => [r.k, U.clone(r)]));
      const deleted = new Set();
      const api = {
        get: (name, def) => { const r = map.get(`${moduleId}/v:${name}`); return r ? r.v : def; },
        set: (name, v) => { const k = `${moduleId}/v:${name}`; deleted.delete(k); map.set(k, { k, m: moduleId, c: null, n: name, v, u: Date.now() }); },
        delete: name => { const k = `${moduleId}/v:${name}`; map.delete(k); deleted.add(k); },
        /** Datensatzweise Migration einer Collection (Pflicht bei synchronisierten Collections) */
        eachRecord: (c, fn) => {
          for (const r of map.values()) if (r.c === c) { const nv = fn(r.v); if (nv) { r.v = nv; r.u = nv.updatedAt || r.u; } }
        },
        records: c => [...map.values()].filter(r => r.c === c).map(r => r.v),
      };
      return { api, map, deleted };
    },
    async migrateRecords(def, from, records) {
      const buf = this.buffer(def.id, records);
      for (let n = from + 1; n <= def.schemaVersion; n++) {
        const fn = def.migrations && def.migrations[n];
        if (typeof fn !== 'function') throw new Error(`Migration auf Schema ${n} fehlt`);
        await fn(buf.api);
      }
      return buf;
    },
    async runAll() {
      const schema = await Store.metaGet('schema', {});
      let dirty = false;
      for (const def of Registry.modules.values()) {
        const st = Registry.st(def.id);
        const stored = schema[def.id];
        if (stored == null) { schema[def.id] = def.schemaVersion; dirty = true; continue; }
        if (stored === def.schemaVersion) continue;
        if (stored > def.schemaVersion) {
          st.readOnly = true;
          st.lockReason = `Die gespeicherten Daten stammen von einer neueren Version (Schema ${stored}, diese Version kennt ${def.schemaVersion}). Bitte die App neu laden bzw. aktualisieren.`;
          Log.warn(st.lockReason, def.id); continue;
        }
        try {
          await Backup.snapshot(`vor Migration ${def.id} ${stored}→${def.schemaVersion}`);
          const buf = await this.migrateRecords(def, stored, await Store.kvByModule(def.id));
          await IDB.run(['kv', 'meta'], 'readwrite', async (kv, meta) => {
            const cur = (await IDB.rq(meta.get('schema')))?.v || {};
            buf.deleted.forEach(k => kv.delete(k));
            for (const r of buf.map.values()) kv.put(r);
            meta.put({ k: 'schema', v: { ...cur, [def.id]: def.schemaVersion } });
          });
          schema[def.id] = def.schemaVersion;
          Log.info(`Migration ${stored}→${def.schemaVersion} erfolgreich`, def.id);
        } catch (e) {
          st.readOnly = true;
          st.lockReason = `Datenmigration fehlgeschlagen (${e.message}). Die Originaldaten sind unverändert, das Modul ist schreibgeschützt.`;
          Log.error(st.lockReason, def.id);
        }
      }
      if (dirty) {
        const cur = await Store.metaGet('schema', {});
        await Store.metaSet('schema', { ...schema, ...Object.fromEntries(Object.entries(cur).filter(([k]) => schema[k] == null || cur[k] > schema[k])) });
      }
    },
  };

  /* ---- CORE: Backup ---- */
  const Backup = {
    async buildExport() {
      const [all, schema] = await Promise.all([Store.kvAll(), Store.metaGet('schema', {})]);
      const modules = {};
      for (const r of all) {
        const m = modules[r.m] || (modules[r.m] = { schemaVersion: schema[r.m] ?? null, values: {}, collections: {} });
        if (r.c == null) m.values[r.n] = r.v;
        else (m.collections[r.c] || (m.collections[r.c] = [])).push(r.v);
      }
      return {
        format: 'persoenliche-app-backup', formatVersion: 1, appVersion: CONFIG.APP_VERSION,
        exportedAt: new Date().toISOString(), modules,
        meta: { modules: {}, settings: Settings.data },
      };
    },
    async snapshot(reason) {
      try {
        const data = await this.buildExport();
        const json = JSON.stringify(data);
        const t = Date.now();
        await IDB.run('backups', 'readwrite', s => { s.put({ id: `${t}-${Math.random().toString(36).slice(2, 7)}`, createdAt: t, reason, appVersion: CONFIG.APP_VERSION, size: json.length, data }); });
        await this.rotate();
        Log.info('Schnappschuss: ' + reason);
      } catch (e) { Log.error('Schnappschuss fehlgeschlagen: ' + e.message); }
    },
    async list() {
      const all = await IDB.run('backups', 'readonly', s => IDB.rq(s.getAll()));
      return all.sort((a, b) => b.createdAt - a.createdAt);
    },
    async rotate() {
      const all = await this.list();
      const keep = new Set(all.slice(0, CONFIG.BACKUP_KEEP).map(b => b.id));
      const perVersion = new Map();
      for (const b of all) if (!perVersion.has(b.appVersion)) perVersion.set(b.appVersion, b.id);
      perVersion.forEach(id => keep.add(id));
      const ordered = all.filter(b => keep.has(b.id)).slice(0, CONFIG.BACKUP_MAX).map(b => b.id);
      const final = new Set(ordered);
      const del = all.filter(b => !final.has(b.id));
      if (del.length) await IDB.run('backups', 'readwrite', s => { del.forEach(b => s.delete(b.id)); });
    },
    async exportFile() {
      const data = await this.buildExport();
      const d = new Date();
      U.download(`persoenliche-app-backup-${d.getFullYear()}-${U.pad(d.getMonth() + 1)}-${U.pad(d.getDate())}.json`, JSON.stringify(data, null, 2));
      await Store.metaSet('lastExportAt', Date.now());
    },
    validate(data) {
      if (!data || data.format !== 'persoenliche-app-backup') throw new Error('Keine Sicherungsdatei dieser App.');
      if (data.formatVersion > 1) throw new Error('Die Sicherung stammt von einer neueren App-Version. Bitte zuerst die App aktualisieren.');
      if (typeof data.modules !== 'object' || !data.modules) throw new Error('Sicherung enthält keine Module.');
      return true;
    },
    /** mode: 'replace' | 'merge'. Gibt Bericht zurück. */
    async importData(data, mode, reason = 'vor Import') {
      this.validate(data);
      await this.snapshot(reason);
      const schema = await Store.metaGet('schema', {});
      const report = { imported: [], skipped: [] };
      const now = Date.now();
      for (const [mid, mod] of Object.entries(data.modules)) {
        if (!/^[a-z0-9_-]+$/.test(mid)) { report.skipped.push(`${mid} (ungültige ID)`); continue; }
        const def = Registry.modules.get(mid);
        const fileSchema = Number.isInteger(mod.schemaVersion) ? mod.schemaVersion : (def ? def.schemaVersion : 1);
        let recs = [];
        for (const [n, v] of Object.entries(mod.values || {})) recs.push({ k: `${mid}/v:${n}`, m: mid, c: null, n, v, u: now });
        for (const [c, list] of Object.entries(mod.collections || {})) {
          if (!Array.isArray(list)) continue;
          for (const v of list) if (v && typeof v.id === 'string') recs.push({ k: `${mid}/c:${c}/${v.id}`, m: mid, c, n: v.id, v, u: v.updatedAt || now });
        }
        let targetSchema = fileSchema;
        if (def) {
          if (fileSchema > def.schemaVersion) { report.skipped.push(`${def.name} (Daten von neuerer Version)`); continue; }
          if (fileSchema < def.schemaVersion) {
            const buf = await Migrator.migrateRecords(def, fileSchema, recs);
            recs = [...buf.map.values()];
          }
          targetSchema = def.schemaVersion;
        }
        const local = schema[mid];
        if (local != null && local > targetSchema) { report.skipped.push(`${mid} (lokal neueres Schema)`); continue; }
        await IDB.run(['kv', 'meta'], 'readwrite', async (kv, meta) => {
          const existing = await IDB.rq(kv.index('by_module').getAll(mid));
          const byKey = new Map(existing.map(r => [r.k, r]));
          if (mode === 'replace') existing.forEach(r => kv.delete(r.k));
          for (const r of recs) {
            const ex = byKey.get(r.k);
            if (mode === 'merge' && ex) {
              if (r.c == null) continue; // Werte: lokal behalten
              if ((ex.v.updatedAt || 0) >= (r.v.updatedAt || 0)) continue;
            }
            kv.put(r);
          }
          const cur = (await IDB.rq(meta.get('schema')))?.v || {};
          meta.put({ k: 'schema', v: { ...cur, [mid]: targetSchema } });
        });
        report.imported.push(def ? def.name : mid);
      }
      if (mode === 'replace' && data.meta && data.meta.settings) {
        await Store.metaSet('settings', { ...Settings.data, ...data.meta.settings });
      }
      await Store.metaSet('syncFullUpload', true); // importierte Datensätze beim nächsten Start hochladen
      Log.info(`Import (${mode}): ${report.imported.join(', ') || '–'}${report.skipped.length ? ' · übersprungen: ' + report.skipped.join(', ') : ''}`);
      return report;
    },
    async daily() {
      const last = await Store.metaGet('lastDailySnapshot', 0);
      if (Date.now() - last > 24 * 3600000) { await this.snapshot('täglich'); await Store.metaSet('lastDailySnapshot', Date.now()); }
    },
    async deleteModuleData(moduleId) {
      await this.snapshot(`vor Löschen der Daten von ${moduleId}`);
      await Store.kvDeleteModule(moduleId);
      Store.changed(moduleId, null);
      Events.emit('reminders:changed', { moduleId });
    },
  };

  /* ---- CORE: Events ---- */
  const Events = {
    map: new Map(),
    on(name, fn) { if (!this.map.has(name)) this.map.set(name, new Set()); this.map.get(name).add(fn); return () => this.off(name, fn); },
    off(name, fn) { this.map.get(name)?.delete(fn); },
    emit(name, payload) {
      for (const fn of [...(this.map.get(name) || [])]) {
        try { const r = fn(payload); if (r && r.catch) r.catch(e => Log.error(`Ereignis ${name}: ${e.message}`)); }
        catch (e) { Log.error(`Ereignis ${name}: ${e.message}`); }
      }
    },
  };

  /* ---- CORE: Tabs (Koordination zwischen offenen Tabs) ---- */
  const Tabs = {
    ch: null,
    start() {
      if (!('BroadcastChannel' in window)) return;
      this.ch = new BroadcastChannel('pa');
      this.ch.onmessage = ({ data }) => {
        if (!data) return;
        if (data.type === 'hello' || data.type === 'hello-reply') {
          if (U.semverCompare(data.version, CONFIG.APP_VERSION) > 0) VersionGuard.lock(`In einem anderen Tab läuft bereits Version ${data.version}. Bitte diesen Tab neu laden.`);
          if (data.type === 'hello') this.post({ type: 'hello-reply', version: CONFIG.APP_VERSION });
        } else if (data.type === 'changed') {
          Events.emit('store:changed', { moduleId: data.moduleId, collection: data.collection, remote: true });
          if (data.collection === '__reminders') Events.emit('reminders:changed', { moduleId: data.moduleId, remote: true });
        }
      };
      this.post({ type: 'hello', version: CONFIG.APP_VERSION });
    },
    post(msg) { try { this.ch && this.ch.postMessage(msg); } catch (_) {} },
  };

  const ICON_CACHE = new Map();

  /* ---- CORE: UI ---- */
  const UI = {
    /** Symbol als SVG-Element; unbekannte Namen (z. B. alte Emoji-Icons) werden als Text gezeigt */
    icon(name, cls = '') {
      if (!ICONS[name]) return document.createTextNode(String(name || ''));
      if (!ICON_CACHE.has(name)) {
        const doc = new DOMParser().parseFromString(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]}</svg>`, 'image/svg+xml');
        ICON_CACHE.set(name, doc.documentElement);
      }
      const el = document.importNode(ICON_CACHE.get(name), true);
      el.setAttribute('class', ('icon ' + cls).trim()); el.setAttribute('aria-hidden', 'true');
      return el;
    },
    h(tag, attrs, ...children) {
      const el = document.createElement(tag);
      if (attrs && (typeof attrs !== 'object' || attrs instanceof Node || Array.isArray(attrs))) { children.unshift(attrs); attrs = null; }
      for (const [k, v] of Object.entries(attrs || {})) {
        if (v == null || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k === 'style' && typeof v === 'object') { for (const [sk, sv] of Object.entries(v)) { if (sk.startsWith('--')) el.style.setProperty(sk, sv); else el.style[sk] = sv; } }
        else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
        else if (['value', 'checked', 'disabled', 'selected', 'hidden', 'open', 'indeterminate'].includes(k)) el[k] = v;
        else el.setAttribute(k, v === true ? '' : String(v));
      }
      const add = c => {
        if (c == null || c === false) return;
        if (Array.isArray(c)) return c.forEach(add);
        el.append(c instanceof Node ? c : document.createTextNode(String(c))); // nie innerHTML
      };
      children.forEach(add);
      return el;
    },
    toast(msg, opts = {}) {
      const { h } = UI;
      const box = document.getElementById('toasts');
      const t = h('div', { class: 'toast' + (opts.type === 'error' ? ' error' : ''), role: 'status' }, h('div', { class: 'grow' }, msg));
      let timer;
      const close = () => { clearTimeout(timer); t.remove(); };
      if (opts.action) t.append(h('button', { onclick: () => { close(); opts.onAction && opts.onAction(); } }, opts.action));
      t.append(h('button', { 'aria-label': 'Schließen', onclick: close }, UI.icon('x')));
      box.append(t);
      while (box.children.length > 4) box.firstChild.remove();
      timer = setTimeout(close, opts.timeout || (opts.action ? 6000 : 3500));
      return close;
    },
    dialog(build, opts = {}) {
      return new Promise(resolve => {
        const dlg = UI.h('dialog', { class: 'dlg', 'aria-label': opts.label || 'Dialog' });
        let result;
        const close = v => { result = v; dlg.close(); };
        const body = UI.h('div', { class: 'dlg-body' });
        dlg.append(body);
        const content = build(close, dlg);
        if (content) body.append(content);
        dlg.addEventListener('close', () => { dlg.remove(); resolve(result); });
        dlg.addEventListener('click', e => { if (e.target === dlg && !opts.modal) close(undefined); });
        document.body.append(dlg);
        dlg.showModal();
        const f = body.querySelector('[autofocus]'); if (f) setTimeout(() => f.focus(), 30);
      });
    },
    confirm(text, opts = {}) {
      const { h } = UI;
      return UI.dialog(close => h('div', {},
        opts.title ? h('h3', {}, opts.title) : null,
        h('p', { style: { margin: 0, whiteSpace: 'pre-wrap' } }, text),
        h('div', { class: 'dlg-actions' },
          h('button', { class: 'btn', onclick: () => close(false) }, opts.cancel || 'Abbrechen'),
          h('button', { class: 'btn ' + (opts.danger ? 'btn-danger' : 'btn-primary'), autofocus: true, onclick: () => close(true) }, opts.ok || 'OK'))
      )).then(v => v === true);
    },
    choose(title, options, text) {
      const { h } = UI;
      return UI.dialog(close => h('div', {},
        h('h3', {}, title), text ? h('p', { class: 'muted' }, text) : null,
        h('div', { class: 'stack' }, options.map(o => h('button', { class: 'btn btn-block ' + (o.danger ? 'btn-danger' : o.primary ? 'btn-primary' : ''), onclick: () => close(o.value) }, o.label))),
        h('div', { class: 'dlg-actions' }, h('button', { class: 'btn btn-ghost', onclick: () => close(undefined) }, 'Abbrechen'))
      ));
    },
    prompt(label, def = '') {
      const { h } = UI;
      return UI.dialog(close => {
        const inp = h('input', { type: 'text', value: def, autofocus: true });
        return h('form', { onsubmit: e => { e.preventDefault(); close(inp.value.trim() || null); } },
          h('label', { class: 'field' }, h('span', {}, label), inp),
          h('div', { class: 'dlg-actions' }, h('button', { class: 'btn', type: 'button', onclick: () => close(null) }, 'Abbrechen'), h('button', { class: 'btn btn-primary', type: 'submit' }, 'OK')));
      });
    },
    errorCard(err, title = 'In diesem Modul ist ein Fehler aufgetreten', retry) {
      const { h } = UI;
      return h('div', { class: 'card error-card' },
        h('h3', {}, UI.icon('alert'), ' ' + title),
        h('p', { class: 'small' }, 'Der Rest der App funktioniert weiter. Deine Daten sind nicht betroffen.'),
        h('pre', {}, String(err && (err.stack || err.message) || err)),
        retry ? h('button', { class: 'btn btn-sm', onclick: retry }, 'Erneut versuchen') : null);
    },
    list(items, render, emptyText = 'Keine Einträge.') {
      if (!items.length) return UI.h('div', { class: 'empty' }, emptyText);
      return UI.h('div', {}, items.map(render));
    },
    banner(id, content, cls = '') {
      const box = document.getElementById('banners');
      let b = document.getElementById('banner-' + id);
      if (!content) { b && b.remove(); return; }
      if (!b) { b = UI.h('div', { class: 'banner ' + cls, id: 'banner-' + id }); box.append(b); }
      b.replaceChildren(...content);
    },
  };

  /* ---- CORE: Theme ---- */
  const Theme = {
    get: () => { try { return localStorage.getItem(CONFIG.LS_PREFIX + 'theme') || 'system'; } catch (_) { return 'system'; } },
    set(t) { try { localStorage.setItem(CONFIG.LS_PREFIX + 'theme', t); } catch (_) {} this.apply(); },
    apply() {
      let t = this.get();
      if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
      document.querySelector('meta[name=theme-color]')?.setAttribute('content', t === 'dark' ? '#18202b' : '#ffffff');
    },
    start() { this.apply(); matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => this.apply()); },
  };

  /* ---- CORE: Router ---- */
  const Router = {
    current: null,   // { moduleId, parts, params }
    parse() {
      const raw = location.hash.replace(/^#\/?/, '');
      const [path, qs] = raw.split('?');
      const parts = path.split('/').filter(Boolean).map(p => { try { return decodeURIComponent(p); } catch (_) { return p; } });
      return { moduleId: parts[0] || 'start', parts: parts.slice(1), params: new URLSearchParams(qs || ''), raw };
    },
    link: path => '#/' + String(path || '').replace(/^\/+/, ''),
    navigate(path, { replace = false } = {}) {
      const url = Router.link(path);
      if (replace) { history.replaceState(null, '', url); Router.render(); }
      else if (location.hash === url) Router.render();
      else location.hash = url;
    },
    async render() {
      const route = this.parse();
      let def = Registry.modules.get(route.moduleId);
      if (!def || !Registry.isActive(def.id)) { if (route.moduleId !== 'start') return this.navigate('', { replace: true }); def = Registry.modules.get('start'); }
      const prev = this.current;
      this.current = { ...route, moduleId: def.id };
      Shell.highlight(def.id);
      // Gleiches Modul, nur Unterroute geändert → onRoute statt neu mounten
      if (prev && prev.moduleId === def.id && typeof def.onRoute === 'function' && Registry.st(def.id).mounted) {
        await Registry.call(def.id, 'onRoute', this.current);
        return;
      }
      if (prev) Registry.unmount(prev.moduleId);
      const view = document.getElementById('view');
      const el = UI.h('section', { 'data-module': def.id, class: 'module' });
      view.replaceChildren(el);
      window.scrollTo(0, 0);
      await Registry.mount(def.id, el, this.current);
    },
    start() { window.addEventListener('hashchange', () => this.render()); return this.render(); },
    api: { navigate: (p, o) => Router.navigate(p, o), current: () => Router.current && { ...Router.current }, link: p => Router.link(p) },
  };

  /* ---- CORE: Registry ---- */
  const Registry = {
    modules: new Map(),
    states: new Map(),
    register(def) {
      try {
        if (!def || typeof def !== 'object') throw new Error('Moduldefinition fehlt');
        if (!/^[a-z0-9-]+$/.test(def.id || '')) throw new Error(`Ungültige Modul-ID „${def.id}“`);
        if (CONFIG.RETIRED_MODULE_IDS.includes(def.id)) throw new Error(`Modul-ID „${def.id}“ ist stillgelegt und darf nicht wiederverwendet werden`);
        if (this.modules.has(def.id)) throw new Error(`Modul-ID „${def.id}“ doppelt`);
        for (const k of ['name', 'icon']) if (!def[k]) throw new Error(`Pflichtfeld ${k} fehlt (${def.id})`);
        if (!Number.isInteger(def.schemaVersion) || def.schemaVersion < 1) throw new Error(`schemaVersion fehlt (${def.id})`);
        if (typeof def.mount !== 'function') throw new Error(`mount() fehlt (${def.id})`);
        this.modules.set(def.id, def);
      } catch (e) { Log.error('Registrierung: ' + e.message); }
    },
    st(id) {
      if (!this.states.has(id)) this.states.set(id, { readOnly: false, lockReason: '', inited: false, initPromise: null, mounted: false, subs: [], ctx: null, cleanups: [] });
      return this.states.get(id);
    },
    isReadOnly(id) { return this.st(id).readOnly; },
    isActive(id) { const d = this.modules.get(id); return !!d && (d.system || !Settings.data.hiddenModules.includes(id)); },
    list({ includeHidden = false } = {}) {
      return [...this.modules.values()].filter(d => includeHidden || this.isActive(d.id)).sort((a, b) => (a.order ?? 100) - (b.order ?? 100));
    },
    ctx(id) {
      const st = this.st(id);
      if (st.ctx) return st.ctx;
      const def = this.modules.get(id);
      const store = Store.forModule(id);
      const settingsKey = '__settings';
      st.ctx = {
        moduleId: id,
        store,
        reminders: Reminders.forModule(id),
        notify: Notify.forModule(id),
        ui: { h: UI.h, icon: UI.icon, toast: UI.toast, confirm: UI.confirm, prompt: UI.prompt, dialog: UI.dialog, choose: UI.choose, list: UI.list, errorCard: UI.errorCard },
        router: Router.api,
        events: {
          on: (name, fn) => { const off = Events.on(name, fn); if (st.mounted) st.subs.push(off); return off; },
          off: (name, fn) => Events.off(name, fn),
          emit: (name, payload) => { if (!String(name).startsWith(id + ':')) throw new Error(`Ereignisse müssen mit „${id}:“ beginnen`); Events.emit(name, payload); },
        },
        settings: {
          get: async (k, def) => { const s = await store.get(settingsKey, {}); return s[k] === undefined ? def : s[k]; },
          set: async (k, v) => { const s = await store.get(settingsKey, {}); s[k] = v; await store.set(settingsKey, s); },
        },
        util: U,
        log: Log.forModule(id),
        get readOnly() { return st.readOnly; },
        /** Intervall/Timeout, die beim Verlassen des Moduls automatisch beendet werden */
        every: (ms, fn) => { const t = setInterval(fn, ms); if (st.mounted) st.cleanups.push(() => clearInterval(t)); return () => clearInterval(t); },
      };
      if (def.system) st.ctx.system = System;
      return st.ctx;
    },
    async ensureInit(id) {
      const st = this.st(id), def = this.modules.get(id);
      if (st.inited) return;
      if (!st.initPromise) st.initPromise = (async () => { if (def.init) await def.init(this.ctx(id)); st.inited = true; })();
      try { await st.initPromise; } catch (e) { st.initPromise = null; throw e; }
    },
    async call(id, hook, ...args) {
      const def = this.modules.get(id);
      if (!def || typeof def[hook] !== 'function') return undefined;
      try { await this.ensureInit(id); return await def[hook](...args, this.ctx(id)); }
      catch (e) { Log.error(`${hook}: ${e.message}`, id); throw e; }
    },
    async mount(id, el, route) {
      const def = this.modules.get(id), st = this.st(id);
      const ctx = this.ctx(id);
      const doMount = async () => {
        el.replaceChildren();
        if (st.readOnly) el.append(UI.h('div', { class: 'ro-banner' }, UI.icon('lock'), ' Schreibgeschützt: ' + st.lockReason));
        const inner = UI.h('div');
        el.append(inner);
        st.mounted = true;
        try { await this.ensureInit(id); await def.mount(inner, ctx, route); }
        catch (e) { Log.error('mount: ' + e.message, id); inner.replaceChildren(UI.errorCard(e, undefined, () => { this.unmount(id); doMount(); })); }
      };
      await doMount();
    },
    /** Kachel/Ausschnitt eines Moduls (Hook widget) in el zeichnen, z. B. auf der Startseite.
        Gibt eine Aufräum-Funktion zurück, die Ereignis-Abos und Intervalle des Widgets beendet. */
    async widget(id, el) {
      const def = this.modules.get(id);
      if (!def || typeof def.widget !== 'function' || !this.isActive(id)) return () => {};
      const base = this.ctx(id), offs = [];
      const wctx = Object.create(base);
      wctx.widget = true;
      wctx.events = { ...base.events, on: (name, fn) => { const off = Events.on(name, fn); offs.push(off); return off; } };
      wctx.every = (ms, fn) => { const t = setInterval(fn, ms); offs.push(() => clearInterval(t)); return () => clearInterval(t); };
      el.setAttribute('data-module', id);   // Modul-CSS greift auch im Widget
      try { await this.ensureInit(id); await def.widget(el, wctx); }
      catch (e) { Log.error('widget: ' + e.message, id); el.replaceChildren(UI.errorCard(e)); }
      return () => { offs.splice(0).forEach(f => { try { f(); } catch (_) {} }); };
    },
    unmount(id) {
      const def = this.modules.get(id), st = this.st(id);
      if (!st.mounted) return;
      try { def.unmount && def.unmount(this.ctx(id)); } catch (e) { Log.error('unmount: ' + e.message, id); }
      st.subs.forEach(off => off()); st.subs = [];
      st.cleanups.forEach(f => { try { f(); } catch (_) {} }); st.cleanups = [];
      st.mounted = false;
    },
  };

  /* ---- CORE: VersionGuard ---- */
  const VersionGuard = {
    newerSeen: null,
    async check() {
      const v = CONFIG.APP_VERSION;
      const app = await Store.metaGet('app', null);
      if (!app) { await Store.metaSet('app', { appVersion: v, maxAppVersionSeen: v, installedAt: Date.now() }); return; }
      const max = U.semverCompare(app.maxAppVersionSeen || app.appVersion, v) > 0 ? (app.maxAppVersionSeen || app.appVersion) : v;
      if (U.semverCompare(max, v) > 0) this.newerSeen = max;
      if (app.appVersion !== v) await Backup.snapshot(`Versionswechsel ${app.appVersion} → ${v}`);
      await Store.metaSet('app', { ...app, appVersion: v, maxAppVersionSeen: max, previousVersion: app.appVersion !== v ? app.appVersion : app.previousVersion });
    },
    lock(text) {
      if (document.getElementById('lock')) return;
      const { h } = UI;
      document.body.append(h('div', { class: 'lock-overlay', id: 'lock' }, h('div', { class: 'card' }, h('h3', {}, 'Bitte neu laden'), h('p', {}, text), h('button', { class: 'btn btn-primary', onclick: () => location.reload() }, 'Neu laden'))));
    },
    showUpdate(text) {
      const { h } = UI;
      UI.banner('update', [h('span', { class: 'grow' }, '' + text), h('button', { class: 'btn btn-primary btn-sm', onclick: () => SWReg.applyUpdate() }, 'Jetzt neu laden')]);
    },
    /** Neueste index.html vom Server lesen. Cache-Buster (?u=…), damit weder Browser-/Service-Worker-Cache
        noch das GitHub-Pages-CDN eine alte Kopie liefern. → { status: 'newer'|'current'|'error', version } */
    async checkRemote() {
      if (location.protocol === 'file:') return { status: 'error' };
      try {
        if (SWReg.reg) SWReg.reg.update().catch(() => {});
        const url = new URL('index.html', location.href); url.searchParams.set('u', Date.now());
        const res = await fetch(url.href, { cache: 'no-store' });
        if (!res.ok) return { status: 'error' };
        const m = (await res.text()).match(/<meta\s+name=["']app-version["']\s+content=["']([^"']+)["']/i);
        if (!m) return { status: 'error' };
        if (U.semverCompare(m[1], CONFIG.APP_VERSION) > 0) { this.showUpdate(`Neue Version ${m[1]} verfügbar.`); return { status: 'newer', version: m[1] }; }
        return { status: 'current', version: m[1] };
      } catch (_) { return { status: 'error' }; }
    },
    /** Beim Start: Cache-Buster aus der Adresse entfernen (Adresse bleibt sauber) */
    cleanUrl() {
      if (!/[?&]u=/.test(location.search)) return;
      const q = new URLSearchParams(location.search); q.delete('u');
      history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : '') + location.hash);
    },
    start() {
      if (this.newerSeen) UI.banner('older', [UI.h('span', { class: 'grow' }, `Auf diesem Gerät lief schon Version ${this.newerSeen}. Du nutzt gerade ${CONFIG.APP_VERSION} (z. B. aus dem Cache).`), UI.h('button', { class: 'btn btn-sm', onclick: () => SWReg.applyUpdate() }, 'Neu laden')], 'warn');
      this.checkRemote();
      setInterval(() => { if (document.visibilityState === 'visible') this.checkRemote(); }, CONFIG.UPDATE_CHECK_MS);
    },
  };

  /* ---- CORE: Crypto ---- */
  /* Schlüsselableitung (Architektur 8.3) und Ende-zu-Ende-Verschlüsselung (9.2). Identisch im Service Worker (nur Entschlüsseln). */
  const Crypto = {
    enc: new TextEncoder(), dec: new TextDecoder(),
    b64u(buf) {
      const b = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
      let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode(...b.subarray(i, i + 0x8000));
      return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    },
    unb64u(str) {
      const s = String(str).replace(/-/g, '+').replace(/_/g, '/');
      const bin = atob(s + '='.repeat((4 - (s.length % 4)) % 4));
      return Uint8Array.from(bin, c => c.charCodeAt(0));
    },
    randomB64u(n) { return this.b64u(crypto.getRandomValues(new Uint8Array(n))); },
    supported: () => !!(window.crypto && crypto.subtle && window.isSecureContext !== false),
    /** Sync-Passwort → { dataKey (nicht exportierbar), loginKey (base64url), authHash } */
    async derive(password, saltB64, iter) {
      const S = crypto.subtle;
      const base = await S.importKey('raw', this.enc.encode(password.normalize('NFC')), 'PBKDF2', false, ['deriveBits']);
      const master = await S.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: this.unb64u(saltB64), iterations: iter }, base, 256);
      const hk = await S.importKey('raw', master, 'HKDF', false, ['deriveBits', 'deriveKey']);
      const empty = new Uint8Array(0);
      const dataKey = await S.deriveKey({ name: 'HKDF', hash: 'SHA-256', salt: empty, info: this.enc.encode('pa-data-v1') }, hk, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
      const login = new Uint8Array(await S.deriveBits({ name: 'HKDF', hash: 'SHA-256', salt: empty, info: this.enc.encode('pa-login-v1') }, hk, 256));
      return { dataKey, loginKey: this.b64u(login), authHash: this.b64u(await S.digest('SHA-256', login)) };
    },
    async encrypt(key, value, aad) {
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: this.enc.encode(aad) }, key, this.enc.encode(JSON.stringify(value))));
      const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12);
      return this.b64u(out);
    },
    async decrypt(key, str, aad) {
      const b = this.unb64u(str);
      const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b.subarray(0, 12), additionalData: this.enc.encode(aad) }, key, b.subarray(12));
      return JSON.parse(this.dec.decode(pt));
    },
    titleAad: (m, id) => `${m}/__reminders/${id}/title`,
  };

  /* ---- CORE: Api ---- */
  /* HTTP-Client für den Worker (/v1). Module greifen nie direkt darauf zu. */
  class ApiError extends Error { constructor(msg, status, code, network) { super(msg); this.status = status; this.code = code; this.network = network; } }
  const Api = {
    base() { return String((Sync.state && Sync.state.api) || CONFIG.PUSH_API || '').replace(/\/+$/, ''); },
    normalize(input) {
      let s = String(input || '').trim();
      if (!s) throw new Error('Bitte die Server-Adresse eintragen.');
      if (!/^https?:\/\//i.test(s)) s = 'https://' + s;
      let u; try { u = new URL(s); } catch (_) { throw new Error('Server-Adresse ist ungültig.'); }
      const local = ['localhost', '127.0.0.1'].includes(u.hostname);
      if (u.protocol !== 'https:' && !local) throw new Error('Server-Adresse muss mit https:// beginnen.');
      return (u.origin + u.pathname).replace(/\/+$/, '');
    },
    async req(method, path, body, opts = {}) {
      const base = opts.base || this.base();
      if (!base) throw new ApiError('Keine Server-Adresse eingetragen.', 0, 'no_api');
      const token = 'token' in opts ? opts.token : Sync.state && Sync.state.token;
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), opts.timeout || 20000);
      let res;
      try {
        res = await fetch(base + path, {
          method, cache: 'no-store', signal: ctrl.signal,
          headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
          body: body ? JSON.stringify(body) : undefined,
        });
      } catch (e) {
        throw new ApiError(navigator.onLine ? 'Server nicht erreichbar (Adresse, Internet oder Content-Security-Policy prüfen).' : 'Keine Internetverbindung.', 0, 'network', true);
      } finally { clearTimeout(timer); }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new ApiError(data.message || `Serverfehler (HTTP ${res.status})`, res.status, data.error);
      return data;
    },
  };

  /* ---- CORE: Sync ---- */
  /* Outbox, Hoch-/Herunterladen, Konfliktlösung (Architektur 9). Letzter Schreiber gewinnt pro Datensatz. */
  const Sync = {
    state: null,          // meta.sync { api, deviceId, token, deviceName, cursor, enabled, lastOkAt, revoked }
    key: null,            // Datenschlüssel (CryptoKey, nicht exportierbar)
    collections: new Set(),
    status: 'off', lastError: '',
    running: null, again: false, backoff: 0, retryTimer: null, loops: false,
    async load() {
      this.state = await Store.metaGet('sync', null);
      this.key = await Store.metaGet('cryptoKey', null);
      if (this.enabled()) this.setStatus('idle');
      else if (this.state && this.state.revoked) this.setStatus('auth');
    },
    enabled() { return !!(this.state && this.state.enabled && this.state.token && this.key); },
    /** Server ist zuständig für das Auslösen von Erinnerungen, solange er kürzlich erreichbar war */
    active() { return this.enabled() && Date.now() - (this.state.lastOkAt || 0) < 15 * 60000; },
    register(m, c) { this.collections.add(`${m}/${c}`); },
    isSyncRec(r) { return !!r.c && (r.c === '__reminders' || this.collections.has(`${r.m}/${r.c}`)); },
    entry(kind, rec) { return { id: `${kind}:${rec.k}`, kind, k: rec.k, u: rec.u, tries: 0, createdAt: Date.now() }; },
    /** kv-Datensatz schreiben und im selben IndexedDB-Schritt für den Upload vormerken */
    async putWithOutbox(rec, kind) {
      await IDB.run(['kv', 'outbox'], 'readwrite', (kv, ob) => { kv.put(rec); ob.put(this.entry(kind, rec)); });
      this.schedule();
    },
    async enqueue(recs) {
      if (!recs.length) return;
      await IDB.run('outbox', 'readwrite', ob => { recs.forEach(r => ob.put(this.entry(r.c === '__reminders' ? 'reminder' : 'item', r))); });
      this.schedule();
    },
    async enqueueAll() {
      for (const def of Registry.modules.values()) { try { await Registry.ensureInit(def.id); } catch (_) {} }
      const all = await Store.kvAll();
      await this.enqueue(all.filter(r => this.isSyncRec(r)));
    },
    async clearOutbox() {
      await IDB.run('outbox', 'readwrite', async ob => {
        const all = await IDB.rq(ob.getAll());
        all.filter(e => e.kind === 'item' || e.kind === 'reminder').forEach(e => ob.delete(e.id));
      });
    },
    async pendingCount() {
      try { return (await IDB.run('outbox', 'readonly', s => IDB.rq(s.getAll()))).filter(e => e.kind === 'item' || e.kind === 'reminder').length; } catch (_) { return 0; }
    },
    async saveState(patch) { this.state = { ...(this.state || {}), ...patch }; await Store.metaSet('sync', this.state); },
    setStatus(s, err = '') {
      this.status = s; this.lastError = err;
      const txt = { off: '', idle: '', ok: '', syncing: '⟳', offline: 'offline', error: 'Sync', auth: 'abgemeldet' }[s] || '';
      try { Shell.status(txt); document.getElementById('status').title = err || ({ ok: 'Synchronisiert', syncing: 'Synchronisiere …' }[s] || ''); } catch (_) {}
      Events.emit('sync:status', { state: s, error: err });
    },
    schedule: null, // wird unten gesetzt (gedrosselt, 2 s)
    run() {
      if (!this.enabled()) return Promise.resolve();
      if (this.running) { this.again = true; return this.running; }
      clearTimeout(this.retryTimer);
      this.running = (async () => {
        try {
          this.setStatus('syncing');
          await this.pushAll();
          await this.pull();
          await this.saveState({ lastOkAt: Date.now() });
          this.backoff = 0;
          this.setStatus('ok');
        } catch (e) { await this.fail(e); }
        finally {
          this.running = null;
          if (this.again) { this.again = false; this.schedule(); }
        }
      })();
      return this.running;
    },
    async fail(e) {
      if (e && e.status === 401) {
        await this.saveState({ enabled: false, revoked: true, token: null });
        this.setStatus('auth', 'Dieses Gerät ist beim Push-Dienst nicht mehr angemeldet.');
        UI.banner('sync', [UI.h('span', { class: 'grow' }, 'Dieses Gerät wurde vom Push-Dienst abgemeldet. Deine Daten bleiben erhalten.'), UI.h('button', { class: 'btn btn-sm', onclick: () => Router.navigate('einstellungen/sync') }, 'Neu verbinden')], 'warn');
        return;
      }
      Log.warn('Sync: ' + (e && e.message || e));
      this.setStatus(e && e.network ? 'offline' : 'error', e && e.message || String(e));
      this.backoff = Math.min(this.backoff ? this.backoff * 2 : 30000, 15 * 60000);
      this.retryTimer = setTimeout(() => this.run(), this.backoff);
    },
    async schemaOf(m) { const s = await Store.metaGet('schema', {}); const d = Registry.modules.get(m); return s[m] ?? (d ? d.schemaVersion : 1); },
    async pushAll() {
      for (let round = 0; round < 50; round++) {
        const entries = (await IDB.run('outbox', 'readonly', s => IDB.rq(s.getAll()))).filter(e => e.kind === 'item' || e.kind === 'reminder').slice(0, 100);
        if (!entries.length) return;
        const items = [], reminders = [], sent = [];
        const schemas = await Store.metaGet('schema', {});
        for (const e of entries) {
          const r = await Store.kvGet(e.k);
          sent.push(e);
          if (!r) continue;
          const v = r.v;
          if (e.kind === 'item') {
            const def = Registry.modules.get(r.m);
            items.push({ module: r.m, collection: r.c, id: r.n, schema: schemas[r.m] ?? (def ? def.schemaVersion : 1), updatedAt: v.updatedAt || r.u || 0, deleted: !!v.deletedAt, payload: await Crypto.encrypt(this.key, v, `${r.m}/${r.c}/${r.n}`) });
          } else {
            reminders.push({
              module: r.m, itemId: v.id, stage: v.stage, stageMin: v.stageMin, deadline: v.deadline ?? null, overdueMin: v.overdueMin ?? 15,
              nextAt: v.nextAt ?? null, done: !!v.done, deleted: !!v.deletedAt,
              titleEnc: v.title ? await Crypto.encrypt(this.key, String(v.title).slice(0, 120), Crypto.titleAad(r.m, v.id)) : null,
              lastSentAt: v.lastSentAt ?? null, sentCount: v.sentCount || 0, updatedAt: v.updatedAt || r.u || 0,
            });
          }
        }
        const res = (items.length || reminders.length) ? await Api.req('POST', '/v1/sync', { items, reminders }) : { rejected: {} };
        // Erledigte Einträge entfernen – nur wenn sich der Datensatz seitdem nicht erneut geändert hat
        await IDB.run('outbox', 'readwrite', async ob => {
          for (const e of sent) { const cur = await IDB.rq(ob.get(e.id)); if (cur && cur.u === e.u) ob.delete(e.id); }
        });
        const rej = res.rejected || {};
        if ((rej.items || []).length) await this.applyItems(rej.items);
        if ((rej.reminders || []).length) await this.applyReminders(rej.reminders);
        if (entries.length < 100) return;
      }
    },
    async pull() {
      for (let round = 0; round < 200; round++) {
        const res = await Api.req('GET', `/v1/sync?since=${encodeURIComponent(this.state.cursor || 0)}`);
        await this.applyItems(res.items || []);
        await this.applyReminders(res.reminders || []);
        await this.saveState({ cursor: res.cursor }); // erst NACH erfolgreichem lokalen Schreiben
        if (!res.more) return;
      }
    },
    /** Vom Server geladene Datensätze übernehmen (9.4, 9.5) */
    async applyItems(rows) {
      const changed = new Map();
      for (const row of rows) {
        let v;
        try { v = await Crypto.decrypt(this.key, row.payload, `${row.module}/${row.collection}/${row.id}`); }
        catch (_) { Log.warn(`Datensatz ${row.module}/${row.collection}/${row.id} nicht entschlüsselbar (anderes Sync-Passwort?)`); continue; }
        if (!v || v.id !== row.id) continue;
        if (await this.applyDecrypted(row.module, row.collection, row.schema, v)) changed.set(`${row.module}/${row.collection}`, [row.module, row.collection]);
      }
      for (const [m, c] of changed.values()) { Events.emit('store:changed', { moduleId: m, collection: c, remote: true }); Tabs.post({ type: 'changed', moduleId: m, collection: c }); }
    },
    async applyDecrypted(m, c, schema, v) {
      const def = Registry.modules.get(m);
      const k = `${m}/c:${c}/${v.id}`;
      if (def && schema > def.schemaVersion) {
        const pk = `${m}/c:__pending/${c}.${v.id}`;
        await Store.kvPut({ k: pk, m, c: '__pending', n: `${c}.${v.id}`, v: { collection: c, schema, record: v }, u: v.updatedAt || 0 });
        const st = Registry.st(m);
        st.readOnly = true;
        st.lockReason = 'Auf einem anderen Gerät läuft eine neuere Version dieses Moduls. Bitte die App aktualisieren (neu laden).';
        return false;
      }
      let migrated = false;
      if (def && schema < def.schemaVersion) {
        try {
          const buf = await Migrator.migrateRecords(def, schema, [{ k, m, c, n: v.id, v, u: v.updatedAt || 0 }]);
          const nr = buf.map.get(k); if (!nr) return false;
          v = nr.v; migrated = true;
        } catch (e) { Log.error(`Migration eines Sync-Datensatzes fehlgeschlagen: ${e.message}`, m); return false; }
      }
      const local = await Store.kvGet(k);
      const rec = { k, m, c, n: v.id, v, u: v.updatedAt || 0 };
      const ru = v.updatedAt || 0, lu = local ? (local.v.updatedAt || 0) : -1;
      if (!local || ru > lu) { if (migrated) await this.putWithOutbox(rec, 'item'); else await Store.kvPut(rec); return true; }
      if (ru < lu || migrated) await this.enqueue([local]);
      return false;
    },
    async processPending() {
      const all = (await Store.kvAll()).filter(r => r.c === '__pending');
      for (const r of all) {
        const def = Registry.modules.get(r.m);
        if (!def || r.v.schema > def.schemaVersion) continue;
        await IDB.run('kv', 'readwrite', s => { s.delete(r.k); });
        await this.applyDecrypted(r.m, r.v.collection, r.v.schema, r.v.record);
      }
    },
    async applyReminders(rows) {
      const doneRemote = [], fired = [];
      let any = false;
      for (const row of rows) {
        const m = row.module, id = row.itemId, k = Reminders.key(m, id);
        const lrec = await Store.kvGet(k);
        const local = lrec ? lrec.v : null;
        let title = local ? local.title : '';
        if (row.titleEnc) { try { title = await Crypto.decrypt(this.key, row.titleEnc, Crypto.titleAad(m, id)); } catch (_) {} }
        const newerFire = (row.lastSentAt || 0) > ((local && local.lastSentAt) || 0);
        let rec = null, enqueueLocal = false;
        if (!local || row.updatedAt > (local.updatedAt || 0)) {
          rec = {
            id, stage: row.stage, stageMin: row.stageMin, deadline: row.deadline ?? null, overdueMin: row.overdueMin ?? 15, title,
            nextAt: row.nextAt ?? null, lastSentAt: row.lastSentAt ?? null, sentCount: row.sentCount || 0, done: !!row.done,
            unseen: local ? ((newerFire || !!local.unseen) && !row.done && !row.deleted) : false,
            createdAt: (local && local.createdAt) || row.updatedAt, deletedAt: row.deleted ? ((local && local.deletedAt) || Date.now()) : null,
            updatedAt: row.updatedAt,
          };
          if (local && !local.done && row.done && !row.deleted) doneRemote.push([m, id]);
        } else {
          if (newerFire) {
            rec = { ...local, lastSentAt: row.lastSentAt, sentCount: Math.max(local.sentCount || 0, row.sentCount || 0) };
            if (!rec.done && !rec.deletedAt) { rec.nextAt = row.nextAt ?? rec.nextAt; rec.unseen = true; }
          }
          if (row.updatedAt < (local.updatedAt || 0)) enqueueLocal = true;
        }
        if (rec) {
          await Store.kvPut({ k, m, c: '__reminders', n: id, v: rec, u: rec.updatedAt });
          any = true;
          if (local && newerFire && rec.unseen) fired.push({ m, r: rec, atDeadline: !!rec.deadline && Math.abs(rec.lastSentAt - rec.deadline) < 90000 });
        }
        if (enqueueLocal) await this.enqueue([lrec]);
      }
      if (!any) return;
      Tabs.post({ type: 'changed', collection: '__reminders' });
      for (const [m, id] of doneRemote) { try { await Registry.call(m, 'onReminderAction', id, 'done'); } catch (_) {} }
      Events.emit('reminders:changed', { remote: true });
      if (fired.length) {
        const list = fired.map(f => ({ def: Registry.modules.get(f.m), r: f.r, atDeadline: f.atDeadline })).filter(f => f.def && Registry.isActive(f.def.id));
        // Mit Push zeigt der Service Worker die Benachrichtigung; die offene App zeigt dann nur einen Hinweis.
        if (list.length && !Push.subscribedHere) await Reminders.announce(list, Date.now(), false);
        else {
          const tl = list.filter(f => f.def.reminderToast !== false);   // Module können den In-App-Hinweis abschalten
          if (tl.length && document.visibilityState === 'visible') UI.toast(`${tl.length === 1 ? (tl[0].r.title || tl[0].def.name) : tl.length + ' Erinnerungen'}`, { action: 'Ansehen', onAction: () => Router.navigate(tl[0].def.id) });
        }
        list.forEach(f => Events.emit('reminder:fired', { moduleId: f.def.id, itemId: f.r.id }));
      }
      await Reminders.updateBadge();
    },
    async pushSettings() {
      if (!this.enabled()) return;
      const q = Settings.data.quiet;
      let tz = 'Europe/Berlin'; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || tz; } catch (_) {}
      try { await Api.req('PUT', '/v1/settings', { timezone: tz, quietStart: q.enabled ? q.start : null, quietEnd: q.enabled ? q.end : null, breakForDeadline: !!q.breakForDeadline }); }
      catch (e) { Log.warn('Ruhezeiten an Server: ' + e.message); }
    },
    startLoops() {
      if (this.loops) return; this.loops = true;
      window.addEventListener('online', () => this.run());
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') this.run(); });
