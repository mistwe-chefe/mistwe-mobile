  const ICON_CACHE = new Map();

  /* ---- CORE: UI ---- */
  const UI = {
    /** Symbol als SVG-Element; unbekannte Namen (z. B. alte Emoji-Icons) werden als Text gezeigt */
    icon(name, cls = '') {
      if (!ICONS[name]) return document.createTextNode(String(name || ''));
      if (!ICON_CACHE.has(name)) {
        const doc = new DOMParser().parseFromString(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]}</svg>`, 'image/svg+xml');
        ICON_CACHE.set(name, doc.documentElement);
      }
      const el = document.importNode(ICON_CACHE.get(name), true);
      el.setAttribute('class', ('icon ' + cls).trim()); el.setAttribute('aria-hidden', 'true');
      return el;
    },
    h(tag, attrs, ...children) {
      const el = document.createElement(tag);
      if (attrs && (typeof attrs !== 'object' || attrs instanceof Node || Array.isArray(attrs))) { children.unshift(attrs); attrs = null; }
      for (const [k, v] of Object.entries(attrs || {})) {
        if (v == null || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
        else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
        else if (['value', 'checked', 'disabled', 'selected', 'hidden', 'open', 'indeterminate'].includes(k)) el[k] = v;
        else el.setAttribute(k, v === true ? '' : String(v));
      }
      const add = c => {
        if (c == null || c === false) return;
        if (Array.isArray(c)) return c.forEach(add);
        el.append(c instanceof Node ? c : document.createTextNode(String(c))); // nie innerHTML
      };
      children.forEach(add);
      return el;
    },
    toast(msg, opts = {}) {
      const { h } = UI;
      const box = document.getElementById('toasts');
      const t = h('div', { class: 'toast' + (opts.type === 'error' ? ' error' : ''), role: 'status' }, h('div', { class: 'grow' }, msg));
      let timer;
      const close = () => { clearTimeout(timer); t.remove(); };
      if (opts.action) t.append(h('button', { onclick: () => { close(); opts.onAction && opts.onAction(); } }, opts.action));
      t.append(h('button', { 'aria-label': 'Schließen', onclick: close }, UI.icon('x')));
      box.append(t);
      while (box.children.length > 4) box.firstChild.remove();
      timer = setTimeout(close, opts.timeout || (opts.action ? 6000 : 3500));
      return close;
    },
    dialog(build, opts = {}) {
      return new Promise(resolve => {
        const dlg = UI.h('dialog', { class: 'dlg', 'aria-label': opts.label || 'Dialog' });
        let result;
        const close = v => { result = v; dlg.close(); };
        const body = UI.h('div', { class: 'dlg-body' });
        dlg.append(body);
        const content = build(close, dlg);
        if (content) body.append(content);
        dlg.addEventListener('close', () => { dlg.remove(); resolve(result); });
        dlg.addEventListener('click', e => { if (e.target === dlg && !opts.modal) close(undefined); });
        document.body.append(dlg);
        dlg.showModal();
        const f = body.querySelector('[autofocus]'); if (f) setTimeout(() => f.focus(), 30);
      });
    },
    confirm(text, opts = {}) {
      const { h } = UI;
      return UI.dialog(close => h('div', {},
        opts.title ? h('h3', {}, opts.title) : null,
        h('p', { style: { margin: 0, whiteSpace: 'pre-wrap' } }, text),
        h('div', { class: 'dlg-actions' },
          h('button', { class: 'btn', onclick: () => close(false) }, opts.cancel || 'Abbrechen'),
          h('button', { class: 'btn ' + (opts.danger ? 'btn-danger' : 'btn-primary'), autofocus: true, onclick: () => close(true) }, opts.ok || 'OK'))
      )).then(v => v === true);
    },
    choose(title, options, text) {
      const { h } = UI;
      return UI.dialog(close => h('div', {},
        h('h3', {}, title), text ? h('p', { class: 'muted' }, text) : null,
        h('div', { class: 'stack' }, options.map(o => h('button', { class: 'btn btn-block ' + (o.danger ? 'btn-danger' : o.primary ? 'btn-primary' : ''), onclick: () => close(o.value) }, o.label))),
        h('div', { class: 'dlg-actions' }, h('button', { class: 'btn btn-ghost', onclick: () => close(undefined) }, 'Abbrechen'))
      ));
    },
    prompt(label, def = '') {
      const { h } = UI;
      return UI.dialog(close => {
        const inp = h('input', { type: 'text', value: def, autofocus: true });
        return h('form', { onsubmit: e => { e.preventDefault(); close(inp.value.trim() || null); } },
          h('label', { class: 'field' }, h('span', {}, label), inp),
          h('div', { class: 'dlg-actions' }, h('button', { class: 'btn', type: 'button', onclick: () => close(null) }, 'Abbrechen'), h('button', { class: 'btn btn-primary', type: 'submit' }, 'OK')));
      });
    },
    errorCard(err, title = 'In diesem Modul ist ein Fehler aufgetreten', retry) {
      const { h } = UI;
      return h('div', { class: 'card error-card' },
        h('h3', {}, UI.icon('alert'), ' ' + title),
        h('p', { class: 'small' }, 'Der Rest der App funktioniert weiter. Deine Daten sind nicht betroffen.'),
        h('pre', {}, String(err && (err.stack || err.message) || err)),
        retry ? h('button', { class: 'btn btn-sm', onclick: retry }, 'Erneut versuchen') : null);
    },
    list(items, render, emptyText = 'Keine Einträge.') {
      if (!items.length) return UI.h('div', { class: 'empty' }, emptyText);
      return UI.h('div', {}, items.map(render));
    },
    banner(id, content, cls = '') {
      const box = document.getElementById('banners');
      let b = document.getElementById('banner-' + id);
      if (!content) { b && b.remove(); return; }
      if (!b) { b = UI.h('div', { class: 'banner ' + cls, id: 'banner-' + id }); box.append(b); }
      b.replaceChildren(...content);
    },
  };

  /* ---- CORE: Theme ---- */
  const Theme = {
    get: () => { try { return localStorage.getItem(CONFIG.LS_PREFIX + 'theme') || 'system'; } catch (_) { return 'system'; } },
    set(t) { try { localStorage.setItem(CONFIG.LS_PREFIX + 'theme', t); } catch (_) {} this.apply(); },
    apply() {
      let t = this.get();
      if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
      document.querySelector('meta[name=theme-color]')?.setAttribute('content', t === 'dark' ? '#18202b' : '#ffffff');
    },
    start() { this.apply(); matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => this.apply()); },
  };

  /* ---- CORE: Router ---- */
  const Router = {
    current: null,   // { moduleId, parts, params }
    parse() {
      const raw = location.hash.replace(/^#\/?/, '');
      const [path, qs] = raw.split('?');
      const parts = path.split('/').filter(Boolean).map(p => { try { return decodeURIComponent(p); } catch (_) { return p; } });
      return { moduleId: parts[0] || 'start', parts: parts.slice(1), params: new URLSearchParams(qs || ''), raw };
    },
    link: path => '#/' + String(path || '').replace(/^\/+/, ''),
    navigate(path, { replace = false } = {}) {
      const url = Router.link(path);
      if (replace) { history.replaceState(null, '', url); Router.render(); }
      else if (location.hash === url) Router.render();
      else location.hash = url;
    },
    async render() {
      const route = this.parse();
      let def = Registry.modules.get(route.moduleId);
      if (!def || !Registry.isActive(def.id)) { if (route.moduleId !== 'start') return this.navigate('', { replace: true }); def = Registry.modules.get('start'); }
      const prev = this.current;
      this.current = { ...route, moduleId: def.id };
      Shell.highlight(def.id);
      // Gleiches Modul, nur Unterroute geändert → onRoute statt neu mounten
      if (prev && prev.moduleId === def.id && typeof def.onRoute === 'function' && Registry.st(def.id).mounted) {
        await Registry.call(def.id, 'onRoute', this.current);
        return;
      }
      if (prev) Registry.unmount(prev.moduleId);
      const view = document.getElementById('view');
      const el = UI.h('section', { 'data-module': def.id, class: 'module' });
      view.replaceChildren(el);
      window.scrollTo(0, 0);
      await Registry.mount(def.id, el, this.current);
    },
    start() { window.addEventListener('hashchange', () => this.render()); return this.render(); },
    api: { navigate: (p, o) => Router.navigate(p, o), current: () => Router.current && { ...Router.current }, link: p => Router.link(p) },
  };

  /* ---- CORE: Registry ---- */
  const Registry = {
    modules: new Map(),
    states: new Map(),
    register(def) {
      try {
        if (!def || typeof def !== 'object') throw new Error('Moduldefinition fehlt');
        if (!/^[a-z0-9-]+$/.test(def.id || '')) throw new Error(`Ungültige Modul-ID „${def.id}“`);
        if (CONFIG.RETIRED_MODULE_IDS.includes(def.id)) throw new Error(`Modul-ID „${def.id}“ ist stillgelegt und darf nicht wiederverwendet werden`);
        if (this.modules.has(def.id)) throw new Error(`Modul-ID „${def.id}“ doppelt`);
        for (const k of ['name', 'icon']) if (!def[k]) throw new Error(`Pflichtfeld ${k} fehlt (${def.id})`);
        if (!Number.isInteger(def.schemaVersion) || def.schemaVersion < 1) throw new Error(`schemaVersion fehlt (${def.id})`);
        if (typeof def.mount !== 'function') throw new Error(`mount() fehlt (${def.id})`);
        this.modules.set(def.id, def);
      } catch (e) { Log.error('Registrierung: ' + e.message); }
    },
    st(id) {
      if (!this.states.has(id)) this.states.set(id, { readOnly: false, lockReason: '', inited: false, initPromise: null, mounted: false, subs: [], ctx: null, cleanups: [] });
      return this.states.get(id);
    },
    isReadOnly(id) { return this.st(id).readOnly; },
    isActive(id) { const d = this.modules.get(id); return !!d && (d.system || !Settings.data.hiddenModules.includes(id)); },
    list({ includeHidden = false } = {}) {
      return [...this.modules.values()].filter(d => includeHidden || this.isActive(d.id)).sort((a, b) => (a.order ?? 100) - (b.order ?? 100));
    },
    ctx(id) {
      const st = this.st(id);
      if (st.ctx) return st.ctx;
      const def = this.modules.get(id);
      const store = Store.forModule(id);
      const settingsKey = '__settings';
      st.ctx = {
        moduleId: id,
        store,
        reminders: Reminders.forModule(id),
        notify: Notify.forModule(id),
        ui: { h: UI.h, icon: UI.icon, toast: UI.toast, confirm: UI.confirm, prompt: UI.prompt, dialog: UI.dialog, choose: UI.choose, list: UI.list, errorCard: UI.errorCard },
        router: Router.api,
        events: {
          on: (name, fn) => { const off = Events.on(name, fn); if (st.mounted) st.subs.push(off); return off; },
          off: (name, fn) => Events.off(name, fn),
          emit: (name, payload) => { if (!String(name).startsWith(id + ':')) throw new Error(`Ereignisse müssen mit „${id}:“ beginnen`); Events.emit(name, payload); },
        },
        settings: {
          get: async (k, def) => { const s = await store.get(settingsKey, {}); return s[k] === undefined ? def : s[k]; },
          set: async (k, v) => { const s = await store.get(settingsKey, {}); s[k] = v; await store.set(settingsKey, s); },
        },
        util: U,
        log: Log.forModule(id),
        get readOnly() { return st.readOnly; },
        /** Intervall/Timeout, die beim Verlassen des Moduls automatisch beendet werden */
        every: (ms, fn) => { const t = setInterval(fn, ms); if (st.mounted) st.cleanups.push(() => clearInterval(t)); return () => clearInterval(t); },
      };
      if (def.system) st.ctx.system = System;
      return st.ctx;
    },
    async ensureInit(id) {
      const st = this.st(id), def = this.modules.get(id);
      if (st.inited) return;
      if (!st.initPromise) st.initPromise = (async () => { if (def.init) await def.init(this.ctx(id)); st.inited = true; })();
      try { await st.initPromise; } catch (e) { st.initPromise = null; throw e; }
    },
    async call(id, hook, ...args) {
      const def = this.modules.get(id);
      if (!def || typeof def[hook] !== 'function') return undefined;
      try { await this.ensureInit(id); return await def[hook](...args, this.ctx(id)); }
      catch (e) { Log.error(`${hook}: ${e.message}`, id); throw e; }
    },
    async mount(id, el, route) {
      const def = this.modules.get(id), st = this.st(id);
      const ctx = this.ctx(id);
      const doMount = async () => {
        el.replaceChildren();
        if (st.readOnly) el.append(UI.h('div', { class: 'ro-banner' }, UI.icon('lock'), ' Schreibgeschützt: ' + st.lockReason));
        const inner = UI.h('div');
        el.append(inner);
        st.mounted = true;
        try { await this.ensureInit(id); await def.mount(inner, ctx, route); }
        catch (e) { Log.error('mount: ' + e.message, id); inner.replaceChildren(UI.errorCard(e, undefined, () => { this.unmount(id); doMount(); })); }
      };
      await doMount();
    },
    unmount(id) {
      const def = this.modules.get(id), st = this.st(id);
      if (!st.mounted) return;
      try { def.unmount && def.unmount(this.ctx(id)); } catch (e) { Log.error('unmount: ' + e.message, id); }
      st.subs.forEach(off => off()); st.subs = [];
      st.cleanups.forEach(f => { try { f(); } catch (_) {} }); st.cleanups = [];
      st.mounted = false;
    },
  };

  /* ---- CORE: VersionGuard ---- */
  const VersionGuard = {
    newerSeen: null,
    async check() {
      const v = CONFIG.APP_VERSION;
      const app = await Store.metaGet('app', null);
      if (!app) { await Store.metaSet('app', { appVersion: v, maxAppVersionSeen: v, installedAt: Date.now() }); return; }
      const max = U.semverCompare(app.maxAppVersionSeen || app.appVersion, v) > 0 ? (app.maxAppVersionSeen || app.appVersion) : v;
      if (U.semverCompare(max, v) > 0) this.newerSeen = max;
      if (app.appVersion !== v) await Backup.snapshot(`Versionswechsel ${app.appVersion} → ${v}`);
      await Store.metaSet('app', { ...app, appVersion: v, maxAppVersionSeen: max, previousVersion: app.appVersion !== v ? app.appVersion : app.previousVersion });
    },
    lock(text) {
      if (document.getElementById('lock')) return;
      const { h } = UI;
      document.body.append(h('div', { class: 'lock-overlay', id: 'lock' }, h('div', { class: 'card' }, h('h3', {}, 'Bitte neu laden'), h('p', {}, text), h('button', { class: 'btn btn-primary', onclick: () => location.reload() }, 'Neu laden'))));
    },
    showUpdate(text) {
      const { h } = UI;
      UI.banner('update', [h('span', { class: 'grow' }, '' + text), h('button', { class: 'btn btn-primary btn-sm', onclick: () => SWReg.applyUpdate() }, 'Jetzt neu laden')]);
    },
    async checkRemote() {
      if (location.protocol === 'file:' || !navigator.onLine) return;
      try {
        const res = await fetch(new URL('index.html', location.href).href, { cache: 'no-cache' });
        if (!res.ok) return;
        const m = (await res.text()).match(/<meta\s+name=["']app-version["']\s+content=["']([^"']+)["']/i);
        if (m && U.semverCompare(m[1], CONFIG.APP_VERSION) > 0) this.showUpdate(`Neue Version ${m[1]} verfügbar.`);
      } catch (_) { /* offline */ }
    },
    start() {
      if (this.newerSeen) UI.banner('older', [UI.h('span', { class: 'grow' }, `Auf diesem Gerät lief schon Version ${this.newerSeen}. Du nutzt gerade ${CONFIG.APP_VERSION} (z. B. aus dem Cache).`), UI.h('button', { class: 'btn btn-sm', onclick: () => SWReg.applyUpdate() }, 'Neu laden')], 'warn');
      this.checkRemote();
      setInterval(() => { if (document.visibilityState === 'visible') this.checkRemote(); }, CONFIG.UPDATE_CHECK_MS);
    },
  };

  /* ---- CORE: Crypto ---- */
  /* Schlüsselableitung (Architektur 8.3) und Ende-zu-Ende-Verschlüsselung (9.2). Identisch im Service Worker (nur Entschlüsseln). */
  const Crypto = {
    enc: new TextEncoder(), dec: new TextDecoder(),
    b64u(buf) {
      const b = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
      let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode(...b.subarray(i, i + 0x8000));
      return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    },
    unb64u(str) {
      const s = String(str).replace(/-/g, '+').replace(/_/g, '/');
      const bin = atob(s + '='.repeat((4 - (s.length % 4)) % 4));
      return Uint8Array.from(bin, c => c.charCodeAt(0));
    },
    randomB64u(n) { return this.b64u(crypto.getRandomValues(new Uint8Array(n))); },
    supported: () => !!(window.crypto && crypto.subtle && window.isSecureContext !== false),
    /** Sync-Passwort → { dataKey (nicht exportierbar), loginKey (base64url), authHash } */
    async derive(password, saltB64, iter) {
      const S = crypto.subtle;
      const base = await S.importKey('raw', this.enc.encode(password.normalize('NFC')), 'PBKDF2', false, ['deriveBits']);
      const master = await S.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: this.unb64u(saltB64), iterations: iter }, base, 256);
      const hk = await S.importKey('raw', master, 'HKDF', false, ['deriveBits', 'deriveKey']);
      const empty = new Uint8Array(0);
      const dataKey = await S.deriveKey({ name: 'HKDF', hash: 'SHA-256', salt: empty, info: this.enc.encode('pa-data-v1') }, hk, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
      const login = new Uint8Array(await S.deriveBits({ name: 'HKDF', hash: 'SHA-256', salt: empty, info: this.enc.encode('pa-login-v1') }, hk, 256));
      return { dataKey, loginKey: this.b64u(login), authHash: this.b64u(await S.digest('SHA-256', login)) };
    },
    async encrypt(key, value, aad) {
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: this.enc.encode(aad) }, key, this.enc.encode(JSON.stringify(value))));
      const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12);
      return this.b64u(out);
    },
    async decrypt(key, str, aad) {
      const b = this.unb64u(str);
      const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b.subarray(0, 12), additionalData: this.enc.encode(aad) }, key, b.subarray(12));
      return JSON.parse(this.dec.decode(pt));
    },
    titleAad: (m, id) => `${m}/__reminders/${id}/title`,
  };

  /* ---- CORE: Api ---- */
  /* HTTP-Client für den Worker (/v1). Module greifen nie direkt darauf zu. */
  class ApiError extends Error { constructor(msg, status, code, network) { super(msg); this.status = status; this.code = code; this.network = network; } }
  const Api = {
    base() { return String((Sync.state && Sync.state.api) || CONFIG.PUSH_API || '').replace(/\/+$/, ''); },
    normalize(input) {
      let s = String(input || '').trim();
      if (!s) throw new Error('Bitte die Server-Adresse eintragen.');
      if (!/^https?:\/\//i.test(s)) s = 'https://' + s;
      let u; try { u = new URL(s); } catch (_) { throw new Error('Server-Adresse ist ungültig.'); }
      const local = ['localhost', '127.0.0.1'].includes(u.hostname);
      if (u.protocol !== 'https:' && !local) throw new Error('Server-Adresse muss mit https:// beginnen.');
      return (u.origin + u.pathname).replace(/\/+$/, '');
    },
    async req(method, path, body, opts = {}) {
      const base = opts.base || this.base();
      if (!base) throw new ApiError('Keine Server-Adresse eingetragen.', 0, 'no_api');
      const token = 'token' in opts ? opts.token : Sync.state && Sync.state.token;
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), opts.timeout || 20000);
      let res;
      try {
        res = await fetch(base + path, {
          method, cache: 'no-store', signal: ctrl.signal,
          headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
          body: body ? JSON.stringify(body) : undefined,
        });
      } catch (e) {
        throw new ApiError(navigator.onLine ? 'Server nicht erreichbar (Adresse, Internet oder Content-Security-Policy prüfen).' : 'Keine Internetverbindung.', 0, 'network', true);
      } finally { clearTimeout(timer); }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new ApiError(data.message || `Serverfehler (HTTP ${res.status})`, res.status, data.error);
      return data;
    },
  };

  /* ---- CORE: Sync ---- */
  /* Outbox, Hoch-/Herunterladen, Konfliktlösung (Architektur 9). Letzter Schreiber gewinnt pro Datensatz. */
  const Sync = {
    state: null,          // meta.sync { api, deviceId, token, deviceName, cursor, enabled, lastOkAt, revoked }
    key: null,            // Datenschlüssel (CryptoKey, nicht exportierbar)
    collections: new Set(),
    status: 'off', lastError: '',
    running: null, again: false, backoff: 0, retryTimer: null, loops: false,
    async load() {
      this.state = await Store.metaGet('sync', null);
      this.key = await Store.metaGet('cryptoKey', null);
      if (this.enabled()) this.setStatus('idle');
      else if (this.state && this.state.revoked) this.setStatus('auth');
    },
    enabled() { return !!(this.state && this.state.enabled && this.state.token && this.key); },
    /** Server ist zuständig für das Auslösen von Erinnerungen, solange er kürzlich erreichbar war */
    active() { return this.enabled() && Date.now() - (this.state.lastOkAt || 0) < 15 * 60000; },
    register(m, c) { this.collections.add(`${m}/${c}`); },
    isSyncRec(r) { return !!r.c && (r.c === '__reminders' || this.collections.has(`${r.m}/${r.c}`)); },
    entry(kind, rec) { return { id: `${kind}:${rec.k}`, kind, k: rec.k, u: rec.u, tries: 0, createdAt: Date.now() }; },
    /** kv-Datensatz schreiben und im selben IndexedDB-Schritt für den Upload vormerken */
    async putWithOutbox(rec, kind) {
      await IDB.run(['kv', 'outbox'], 'readwrite', (kv, ob) => { kv.put(rec); ob.put(this.entry(kind, rec)); });
      this.schedule();
    },
    async enqueue(recs) {
      if (!recs.length) return;
      await IDB.run('outbox', 'readwrite', ob => { recs.forEach(r => ob.put(this.entry(r.c === '__reminders' ? 'reminder' : 'item', r))); });
      this.schedule();
    },
    async enqueueAll() {
      for (const def of Registry.modules.values()) { try { await Registry.ensureInit(def.id); } catch (_) {} }
      const all = await Store.kvAll();
      await this.enqueue(all.filter(r => this.isSyncRec(r)));
    },
    async clearOutbox() {
      await IDB.run('outbox', 'readwrite', async ob => {
        const all = await IDB.rq(ob.getAll());
        all.filter(e => e.kind === 'item' || e.kind === 'reminder').forEach(e => ob.delete(e.id));
      });
    },
    async pendingCount() {
      try { return (await IDB.run('outbox', 'readonly', s => IDB.rq(s.getAll()))).filter(e => e.kind === 'item' || e.kind === 'reminder').length; } catch (_) { return 0; }
    },
    async saveState(patch) { this.state = { ...(this.state || {}), ...patch }; await Store.metaSet('sync', this.state); },
    setStatus(s, err = '') {
      this.status = s; this.lastError = err;
      const txt = { off: '', idle: '', ok: '', syncing: '⟳', offline: 'offline', error: 'Sync', auth: 'abgemeldet' }[s] || '';
      try { Shell.status(txt); document.getElementById('status').title = err || ({ ok: 'Synchronisiert', syncing: 'Synchronisiere …' }[s] || ''); } catch (_) {}
      Events.emit('sync:status', { state: s, error: err });
    },
    schedule: null, // wird unten gesetzt (gedrosselt, 2 s)
    run() {
      if (!this.enabled()) return Promise.resolve();
      if (this.running) { this.again = true; return this.running; }
      clearTimeout(this.retryTimer);
      this.running = (async () => {
        try {
          this.setStatus('syncing');
          await this.pushAll();
          await this.pull();
          await this.saveState({ lastOkAt: Date.now() });
          this.backoff = 0;
          this.setStatus('ok');
        } catch (e) { await this.fail(e); }
        finally {
          this.running = null;
          if (this.again) { this.again = false; this.schedule(); }
        }
      })();
      return this.running;
    },
    async fail(e) {
      if (e && e.status === 401) {
        await this.saveState({ enabled: false, revoked: true, token: null });
        this.setStatus('auth', 'Dieses Gerät ist beim Push-Dienst nicht mehr angemeldet.');
        UI.banner('sync', [UI.h('span', { class: 'grow' }, 'Dieses Gerät wurde vom Push-Dienst abgemeldet. Deine Daten bleiben erhalten.'), UI.h('button', { class: 'btn btn-sm', onclick: () => Router.navigate('einstellungen') }, 'Neu verbinden')], 'warn');
        return;
      }
      Log.warn('Sync: ' + (e && e.message || e));
      this.setStatus(e && e.network ? 'offline' : 'error', e && e.message || String(e));
      this.backoff = Math.min(this.backoff ? this.backoff * 2 : 30000, 15 * 60000);
      this.retryTimer = setTimeout(() => this.run(), this.backoff);
    },
    async schemaOf(m) { const s = await Store.metaGet('schema', {}); const d = Registry.modules.get(m); return s[m] ?? (d ? d.schemaVersion : 1); },
    async pushAll() {
      for (let round = 0; round < 50; round++) {
        const entries = (await IDB.run('outbox', 'readonly', s => IDB.rq(s.getAll()))).filter(e => e.kind === 'item' || e.kind === 'reminder').slice(0, 100);
        if (!entries.length) return;
        const items = [], reminders = [], sent = [];
        const schemas = await Store.metaGet('schema', {});
        for (const e of entries) {
          const r = await Store.kvGet(e.k);
          sent.push(e);
          if (!r) continue;
          const v = r.v;
          if (e.kind === 'item') {
            const def = Registry.modules.get(r.m);
            items.push({ module: r.m, collection: r.c, id: r.n, schema: schemas[r.m] ?? (def ? def.schemaVersion : 1), updatedAt: v.updatedAt || r.u || 0, deleted: !!v.deletedAt, payload: await Crypto.encrypt(this.key, v, `${r.m}/${r.c}/${r.n}`) });
          } else {
            reminders.push({
              module: r.m, itemId: v.id, stage: v.stage, stageMin: v.stageMin, deadline: v.deadline ?? null, overdueMin: v.overdueMin ?? 15,
              nextAt: v.nextAt ?? null, done: !!v.done, deleted: !!v.deletedAt,
              titleEnc: v.title ? await Crypto.encrypt(this.key, String(v.title).slice(0, 120), Crypto.titleAad(r.m, v.id)) : null,
              lastSentAt: v.lastSentAt ?? null, sentCount: v.sentCount || 0, updatedAt: v.updatedAt || r.u || 0,
            });
          }
        }
        const res = (items.length || reminders.length) ? await Api.req('POST', '/v1/sync', { items, reminders }) : { rejected: {} };
        // Erledigte Einträge entfernen – nur wenn sich der Datensatz seitdem nicht erneut geändert hat
        await IDB.run('outbox', 'readwrite', async ob => {
          for (const e of sent) { const cur = await IDB.rq(ob.get(e.id)); if (cur && cur.u === e.u) ob.delete(e.id); }
        });
        const rej = res.rejected || {};
        if ((rej.items || []).length) await this.applyItems(rej.items);
        if ((rej.reminders || []).length) await this.applyReminders(rej.reminders);
        if (entries.length < 100) return;
      }
    },
    async pull() {
      for (let round = 0; round < 200; round++) {
        const res = await Api.req('GET', `/v1/sync?since=${encodeURIComponent(this.state.cursor || 0)}`);
        await this.applyItems(res.items || []);
        await this.applyReminders(res.reminders || []);
        await this.saveState({ cursor: res.cursor }); // erst NACH erfolgreichem lokalen Schreiben
        if (!res.more) return;
      }
    },
    /** Vom Server geladene Datensätze übernehmen (9.4, 9.5) */
    async applyItems(rows) {
      const changed = new Map();
      for (const row of rows) {
        let v;
        try { v = await Crypto.decrypt(this.key, row.payload, `${row.module}/${row.collection}/${row.id}`); }
        catch (_) { Log.warn(`Datensatz ${row.module}/${row.collection}/${row.id} nicht entschlüsselbar (anderes Sync-Passwort?)`); continue; }
        if (!v || v.id !== row.id) continue;
        if (await this.applyDecrypted(row.module, row.collection, row.schema, v)) changed.set(`${row.module}/${row.collection}`, [row.module, row.collection]);
      }
      for (const [m, c] of changed.values()) { Events.emit('store:changed', { moduleId: m, collection: c, remote: true }); Tabs.post({ type: 'changed', moduleId: m, collection: c }); }
    },
    async applyDecrypted(m, c, schema, v) {
      const def = Registry.modules.get(m);
      const k = `${m}/c:${c}/${v.id}`;
      if (def && schema > def.schemaVersion) {
        const pk = `${m}/c:__pending/${c}.${v.id}`;
        await Store.kvPut({ k: pk, m, c: '__pending', n: `${c}.${v.id}`, v: { collection: c, schema, record: v }, u: v.updatedAt || 0 });
        const st = Registry.st(m);
        st.readOnly = true;
        st.lockReason = 'Auf einem anderen Gerät läuft eine neuere Version dieses Moduls. Bitte die App aktualisieren (neu laden).';
        return false;
      }
      let migrated = false;
      if (def && schema < def.schemaVersion) {
        try {
          const buf = await Migrator.migrateRecords(def, schema, [{ k, m, c, n: v.id, v, u: v.updatedAt || 0 }]);
          const nr = buf.map.get(k); if (!nr) return false;
          v = nr.v; migrated = true;
        } catch (e) { Log.error(`Migration eines Sync-Datensatzes fehlgeschlagen: ${e.message}`, m); return false; }
      }
      const local = await Store.kvGet(k);
      const rec = { k, m, c, n: v.id, v, u: v.updatedAt || 0 };
      const ru = v.updatedAt || 0, lu = local ? (local.v.updatedAt || 0) : -1;
      if (!local || ru > lu) { if (migrated) await this.putWithOutbox(rec, 'item'); else await Store.kvPut(rec); return true; }
      if (ru < lu || migrated) await this.enqueue([local]);
      return false;
    },
    async processPending() {
      const all = (await Store.kvAll()).filter(r => r.c === '__pending');
      for (const r of all) {
        const def = Registry.modules.get(r.m);
        if (!def || r.v.schema > def.schemaVersion) continue;
        await IDB.run('kv', 'readwrite', s => { s.delete(r.k); });
        await this.applyDecrypted(r.m, r.v.collection, r.v.schema, r.v.record);
      }
    },
    async applyReminders(rows) {
      const doneRemote = [], fired = [];
      let any = false;
      for (const row of rows) {
        const m = row.module, id = row.itemId, k = Reminders.key(m, id);
        const lrec = await Store.kvGet(k);
        const local = lrec ? lrec.v : null;
        let title = local ? local.title : '';
        if (row.titleEnc) { try { title = await Crypto.decrypt(this.key, row.titleEnc, Crypto.titleAad(m, id)); } catch (_) {} }
        const newerFire = (row.lastSentAt || 0) > ((local && local.lastSentAt) || 0);
        let rec = null, enqueueLocal = false;
        if (!local || row.updatedAt > (local.updatedAt || 0)) {
          rec = {
            id, stage: row.stage, stageMin: row.stageMin, deadline: row.deadline ?? null, overdueMin: row.overdueMin ?? 15, title,
            nextAt: row.nextAt ?? null, lastSentAt: row.lastSentAt ?? null, sentCount: row.sentCount || 0, done: !!row.done,
            unseen: local ? ((newerFire || !!local.unseen) && !row.done && !row.deleted) : false,
            createdAt: (local && local.createdAt) || row.updatedAt, deletedAt: row.deleted ? ((local && local.deletedAt) || Date.now()) : null,
            updatedAt: row.updatedAt,
          };
          if (local && !local.done && row.done && !row.deleted) doneRemote.push([m, id]);
        } else {
          if (newerFire) {
            rec = { ...local, lastSentAt: row.lastSentAt, sentCount: Math.max(local.sentCount || 0, row.sentCount || 0) };
            if (!rec.done && !rec.deletedAt) { rec.nextAt = row.nextAt ?? rec.nextAt; rec.unseen = true; }
          }
          if (row.updatedAt < (local.updatedAt || 0)) enqueueLocal = true;
        }
        if (rec) {
          await Store.kvPut({ k, m, c: '__reminders', n: id, v: rec, u: rec.updatedAt });
          any = true;
          if (local && newerFire && rec.unseen) fired.push({ m, r: rec, atDeadline: !!rec.deadline && Math.abs(rec.lastSentAt - rec.deadline) < 90000 });
        }
        if (enqueueLocal) await this.enqueue([lrec]);
      }
      if (!any) return;
      Tabs.post({ type: 'changed', collection: '__reminders' });
      for (const [m, id] of doneRemote) { try { await Registry.call(m, 'onReminderAction', id, 'done'); } catch (_) {} }
      Events.emit('reminders:changed', { remote: true });
      if (fired.length) {
        const list = fired.map(f => ({ def: Registry.modules.get(f.m), r: f.r, atDeadline: f.atDeadline })).filter(f => f.def && Registry.isActive(f.def.id));
        // Mit Push zeigt der Service Worker die Benachrichtigung; die offene App zeigt dann nur einen Hinweis.
        if (list.length && !Push.subscribedHere) await Reminders.announce(list, Date.now(), false);
        else if (list.length && document.visibilityState === 'visible') UI.toast(`${list.length === 1 ? (list[0].r.title || list[0].def.name) : list.length + ' Erinnerungen'}`, { action: 'Ansehen', onAction: () => Router.navigate(list[0].def.id) });
        list.forEach(f => Events.emit('reminder:fired', { moduleId: f.def.id, itemId: f.r.id }));
      }
      await Reminders.updateBadge();
    },
    async pushSettings() {
      if (!this.enabled()) return;
      const q = Settings.data.quiet;
      let tz = 'Europe/Berlin'; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || tz; } catch (_) {}
      try { await Api.req('PUT', '/v1/settings', { timezone: tz, quietStart: q.enabled ? q.start : null, quietEnd: q.enabled ? q.end : null, breakForDeadline: !!q.breakForDeadline }); }
      catch (e) { Log.warn('Ruhezeiten an Server: ' + e.message); }
    },
    startLoops() {
      if (this.loops) return; this.loops = true;
      window.addEventListener('online', () => this.run());
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') this.run(); });
      let last = 0;
      setInterval(() => {
        const vis = document.visibilityState === 'visible';
        if (vis || Date.now() - last > 5 * 60000) { last = Date.now(); this.run(); }
      }, CONFIG.SYNC_INTERVAL_MS);
      Events.on('settings:changed', ({ key }) => { if (key === 'quiet') this.pushSettings(); });
    },
    async start() {
      if (!this.enabled()) return;
      if (await Store.metaGet('syncFullUpload', false)) { await this.enqueueAll(); await Store.metaSet('syncFullUpload', false); }
      await this.processPending();
      this.startLoops();
      const first = this.run();
      await Promise.race([first, new Promise(r => setTimeout(r, 3000))]); // Start max. 3 s blockieren
    },
    /** Einrichten ('setup') oder mit bestehendem Konto verbinden ('login') */
    async connect({ api, mode, setupSecret, password, deviceName, reset }) {
      if (!Crypto.supported()) throw new Error('Verschlüsselung wird hier nicht unterstützt (nur über https).');
      api = Api.normalize(api);
      const cfg = await Api.req('GET', '/v1/config', null, { base: api, token: null });
      if (cfg.apiVersion !== 1) throw new Error('Unbekannte Server-Version.');
      deviceName = String(deviceName || '').trim().slice(0, 60) || 'Gerät';
      let keys, res;
      if (mode === 'setup') {
        const salt = Crypto.randomB64u(16);
        keys = await Crypto.derive(password, salt, CONFIG.KDF_ITER);
        res = await Api.req('POST', '/v1/setup', { setupSecret, kdfSalt: salt, kdfIter: CONFIG.KDF_ITER, authHash: keys.authHash, deviceName, reset: !!reset }, { base: api, token: null });
      } else {
        const kdf = await Api.req('GET', '/v1/kdf', null, { base: api, token: null });
        keys = await Crypto.derive(password, kdf.kdfSalt, kdf.kdfIter);
        res = await Api.req('POST', '/v1/login', { loginKey: keys.loginKey, deviceName }, { base: api, token: null });
      }
      await Store.metaSet('cryptoKey', keys.dataKey);
      this.key = keys.dataKey;
      await this.saveState({ api, deviceId: res.deviceId, token: res.deviceToken, deviceName, cursor: 0, enabled: true, revoked: false, lastOkAt: Date.now(), connectedAt: Date.now() });
      UI.banner('sync', null);
      await this.clearOutbox();
      await this.enqueueAll();   // lokale Daten hochladen; neuere Server-Stände gewinnen beim Zusammenführen
      this.startLoops();
      await this.pushSettings();
      await this.run();
      if (this.status !== 'ok') throw new Error('Verbunden, aber die erste Synchronisierung schlug fehl: ' + this.lastError);
      Log.info(`Push & Sync ${mode === 'setup' ? 'eingerichtet' : 'verbunden'} (${deviceName})`);
    },
    async changePassword(current, next) {
      await this.run();
      if (this.status !== 'ok') throw new Error('Bitte zuerst erfolgreich synchronisieren: ' + this.lastError);
      const kdf = await Api.req('GET', '/v1/kdf', null, { token: null });
      const old = await Crypto.derive(current, kdf.kdfSalt, kdf.kdfIter);
      const salt = Crypto.randomB64u(16);
      const nk = await Crypto.derive(next, salt, CONFIG.KDF_ITER);
      const res = await Api.req('POST', '/v1/account/rekey', { loginKey: old.loginKey, kdfSalt: salt, kdfIter: CONFIG.KDF_ITER, authHash: nk.authHash });
      await Store.metaSet('cryptoKey', nk.dataKey);
      this.key = nk.dataKey;
      await this.saveState({ cursor: res.cursor || 0 });
      await this.clearOutbox();
      await this.enqueueAll();
      await this.run();
      Log.info('Sync-Passwort geändert, Daten neu verschlüsselt hochgeladen');
    },
    async disconnect() {
      try { await Push.disable(); } catch (_) {}
      if (this.state && this.state.token) { try { await Api.req('DELETE', `/v1/devices/${encodeURIComponent(this.state.deviceId)}`); } catch (_) {} }
      await this.clearOutbox();
      this.state = { api: this.state && this.state.api, enabled: false };
      await Store.metaSet('sync', this.state);
      await Store.metaSet('cryptoKey', null);
      this.key = null;
      this.setStatus('off');
      Log.info('Gerät vom Push-Dienst abgemeldet (lokale Daten bleiben)');
    },
  };
  Sync.schedule = U.debounce(() => Sync.run(), 2000);

  /* ---- CORE: Schedule ---- */
  /* Eskalationsregel – identisch zu worker/src/schedule.js (Architektur 10.2). Änderungen immer an beiden Stellen! */
  const Schedule = {
    STAGES: [
      { id: '1m', label: '1 Minute (Test)', short: '1 Min', min: 1 },   // zum Testen von Erinnerungen/Push
      { id: '30m', label: '30 Minuten', short: '30 Min', min: 30 },
      { id: '90m', label: '90 Minuten', short: '90 Min', min: 90 },
      { id: '3h', label: '3 Stunden', short: '3 Std', min: 180 },
      { id: '6h', label: '6 Stunden', short: '6 Std', min: 360 },
      { id: '1d', label: '1 Tag', short: '1 Tag', min: 1440 },
      { id: '3d', label: '3 Tage', short: '3 Tage', min: 4320 },
      { id: '1w', label: '1 Woche', short: '1 Woche', min: 10080 },
      { id: '2w', label: '2 Wochen', short: '2 Wochen', min: 20160 },
      { id: '1mo', label: '1 Monat', short: '1 Monat', min: 43200 },
    ],
    DEADLINE_STEPS: [5, 10, 15, 30, 60, 90, 180, 360, 720, 1440, 4320, 10080],
    stageMin(id) { const s = this.STAGES.find(x => x.id === id); return s ? s.min : 1440; },
    stageLabel(id) { const s = this.STAGES.find(x => x.id === id); return s ? s.label : id; },
    stageShort(id) { const s = this.STAGES.find(x => x.id === id); return s ? s.short : id; },
    nextInterval(stageMin, deadline, overdueMin, now) {
      if (!deadline) return stageMin;
      const remainingMin = (deadline - now) / 60000;
      if (remainingMin <= 0) return overdueMin || 15;
      const target = remainingMin / 4;
      let step = 5;
      for (const s of this.DEADLINE_STEPS) if (s <= target) step = s;
      return Math.min(stageMin, step);
    },
    nextAt(r, now) {
      let t = now + this.nextInterval(r.stageMin, r.deadline, r.overdueMin, now) * 60000;
      if (r.deadline && now < r.deadline && t > r.deadline) t = r.deadline;
      return t;
    },
    /** Ende der Ruhezeit, falls `now` darin liegt, sonst null */
    quietEnd(now, start, end) {
      if (start == null || end == null || start === end) return null;
      const d = new Date(now), m = d.getHours() * 60 + d.getMinutes();
      const active = start < end ? (m >= start && m < end) : (m >= start || m < end);
      if (!active) return null;
      const e = new Date(now); e.setHours(Math.floor(end / 60), end % 60, 0, 0);
      if (e.getTime() <= now) e.setDate(e.getDate() + 1);
      return e.getTime();
    },
    /** Verschiebung wegen Ruhezeit (oder null = jetzt senden) */
    quietDefer(now, r, q) {
      if (!q || !q.enabled) return null;
      const end = this.quietEnd(now, q.start, q.end);
      if (end == null) return null;
      if (q.breakForDeadline && r.deadline && r.deadline >= now - 60000 && r.deadline <= Math.max(end, now + 2 * 3600000)) return null;
      return end;
    },
    snoozeOptions(now = Date.now()) {
      const tm = new Date(now); tm.setDate(tm.getDate() + 1); tm.setHours(8, 0, 0, 0);
      return [
        { label: '15 Minuten', until: now + 15 * 60000 },
        { label: '1 Stunde', until: now + 60 * 60000 },
        { label: '3 Stunden', until: now + 180 * 60000 },
        { label: 'Morgen 08:00', until: tm.getTime() },
      ];
    },
    /** Testtabelle aus Architektur 10.2 (Stufe „1 Tag“) */
    selfTest() {
      const now = Date.UTC(2026, 0, 1, 12, 0, 0);
      const M = 60000, H = 60 * M, D = 24 * H;
      const cases = [
        ['5 Tage', 5 * D, 1440], ['2 Tage', 2 * D, 720], ['1 Tag', D, 360], ['12 Stunden', 12 * H, 180],
        ['6 Stunden', 6 * H, 90], ['2 Stunden', 2 * H, 30], ['1 Stunde', H, 15], ['30 Minuten', 30 * M, 5],
        ['überfällig', -10 * M, 15],
      ];
      const res = cases.map(([label, rem, exp]) => { const got = this.nextInterval(1440, now + rem, 15, now); return { label, expected: exp, got, ok: got === exp }; });
      const noDl = this.nextInterval(90, null, 15, now); res.push({ label: 'ohne Abgabe, Stufe 90 Min', expected: 90, got: noDl, ok: noDl === 90 });
      const cl = this.nextAt({ stageMin: 1440, deadline: now + 3 * M, overdueMin: 15 }, now); res.push({ label: 'Abgabe in 3 Min → pünktlich zur Abgabe', expected: '+3 Min', got: `+${(cl - now) / M} Min`, ok: cl === now + 3 * M });
      return res;
    },
  };

  /* ---- CORE: Notify ---- */
  const Notify = {
    reg: null,
    audio: null,
    supported: () => 'Notification' in window,
    pushGranted: false,  // iOS-Workaround: Push-Berechtigung/Abo zählt als „erlaubt“
    permission() {
      if (!this.supported()) return 'unsupported';
      const p = Notification.permission;
      // iOS-Home-Screen-Apps melden nach einem Fenster-Öffnen aus einer Benachrichtigung fälschlich „default“
      return p === 'default' && this.pushGranted ? 'granted' : p;
    },
    /** Tatsächlichen Zustand über die Push-API prüfen (zuverlässiger als Notification.permission auf iOS) */
    async refreshPermission() {
      const before = this.permission();
      try {
        const reg = this.reg || (navigator.serviceWorker && await Promise.race([navigator.serviceWorker.getRegistration(), new Promise(r => setTimeout(r, 3000))]));
        if (reg && reg.pushManager) {
          const st = reg.pushManager.permissionState ? await reg.pushManager.permissionState({ userVisibleOnly: true }).catch(() => null) : null;
          const sub = await reg.pushManager.getSubscription().catch(() => null);
          this.pushGranted = st === 'granted' || !!sub;
        }
      } catch (_) {}
      if (this.permission() !== before) Events.emit('notify:permission', this.permission());
      return this.permission();
    },
    async request() {
      if (!this.supported()) return 'unsupported';
      if (this.permission() === 'granted') return 'granted'; // nie erneut fragen, wenn schon erlaubt
      try { const p = await Notification.requestPermission(); Events.emit('notify:permission', p); return p; } catch (_) { return Notification.permission; }
    },
    unlockAudio() {
      if (this.audio) return;
      try { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.audio = new AC(); } catch (_) {}
    },
    beep() {
      if (!Settings.data.sound || !this.audio) return;
      try {
        const a = this.audio; if (a.state === 'suspended') a.resume();
        [0, 0.22].forEach((off, i) => {
          const o = a.createOscillator(), g = a.createGain();
          o.frequency.value = i ? 880 : 660; o.type = 'sine';
          g.gain.setValueAtTime(0.0001, a.currentTime + off);
          g.gain.exponentialRampToValueAtTime(0.25, a.currentTime + off + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + off + 0.18);
          o.connect(g).connect(a.destination); o.start(a.currentTime + off); o.stop(a.currentTime + off + 0.2);
        });
      } catch (_) {}
    },
    vibrate() { if (Settings.data.vibrate && navigator.vibrate) try { navigator.vibrate([200, 100, 200]); } catch (_) {} },
    async show({ title, body, tag, data, actions, silent }) {
      if (!silent) { this.beep(); this.vibrate(); }
      if (this.permission() !== 'granted') return false;
      const opts = { body, tag, data, renotify: !!tag, icon: 'icons/icon-192-v2.png', badge: 'icons/icon-192-v2.png', requireInteraction: false };
      try {
        const reg = this.reg || (navigator.serviceWorker && await navigator.serviceWorker.getRegistration());
        if (reg && reg.showNotification) { await reg.showNotification(title, { ...opts, actions: actions || [] }); return true; }
      } catch (e) { Log.warn('showNotification: ' + e.message); }
      try { const n = new Notification(title, opts); n.onclick = () => { window.focus(); if (data && data.m) Router.navigate(data.m); n.close(); }; return true; }
      catch (e) { Log.warn('Notification: ' + e.message); return false; }
    },
    setBadge(n) {
      document.title = n ? `(${n}) ${CONFIG.APP_TITLE}` : CONFIG.APP_TITLE;
      try { if (n && navigator.setAppBadge) navigator.setAppBadge(n); else if (navigator.clearAppBadge) navigator.clearAppBadge(); } catch (_) {}
    },
    forModule(id) {
      const def = () => Registry.modules.get(id);
      return {
        permission: () => Notify.permission(),
        request: () => Notify.request(),
        show: (title, body, opts = {}) => Notify.show({ title, body, tag: opts.tag ? `${id}-${opts.tag}` : undefined, data: { m: id, id: opts.itemId }, silent: opts.silent }),
      };
    },
  };

  /* ---- CORE: Reminders ---- */
  const Reminders = {
    C: '__reminders',
    key(m, id) { return `${m}/c:${this.C}/${id}`; },
    async getRec(m, id) { const r = await Store.kvGet(this.key(m, id)); return r ? r.v : null; },
    async putRec(m, rec, { silent = false } = {}) {
      rec.updatedAt = Math.max(Date.now(), (rec.updatedAt || 0) + 1);
      const kv = { k: this.key(m, rec.id), m, c: this.C, n: rec.id, v: rec, u: rec.updatedAt };
      if (Sync.enabled()) await Sync.putWithOutbox(kv, 'reminder'); else await Store.kvPut(kv);
      Tabs.post({ type: 'changed', moduleId: m, collection: this.C });
      if (!silent) { Events.emit('reminders:changed', { moduleId: m }); this.updateBadge(); }
    },
    info(r) {
      return { id: r.id, stage: r.stage, deadline: r.deadline ?? null, overdueMin: r.overdueMin, nextAt: r.nextAt ?? null, lastSentAt: r.lastSentAt ?? null, sentCount: r.sentCount || 0, done: !!r.done, unseen: !!r.unseen && !r.done };
    },
    forModule(m) {
      const R = this;
      const guard = () => { if (Registry.isReadOnly(m)) throw new Error('Modul ist schreibgeschützt.'); };
      const mutate = async (id, fn) => { guard(); const r = await R.getRec(m, id); if (!r || r.deletedAt) return null; fn(r, Date.now()); await R.putRec(m, r); return R.info(r); };
      return {
        STAGES: Schedule.STAGES.map(s => ({ ...s })),
        stageLabel: id => Schedule.stageLabel(id),
        stageShort: id => Schedule.stageShort(id),
        /** intervalMin (frei in Minuten) hat Vorrang vor der Stufen-ID */
        preview: ({ stage, intervalMin, deadline = null, overdueMin = 15 }, now = Date.now()) => Schedule.nextAt({ stageMin: intervalMin ? Math.max(1, Math.round(intervalMin)) : Schedule.stageMin(stage), deadline, overdueMin }, now),
        snoozeOptions: () => Schedule.snoozeOptions(),
        async set(id, { stage, intervalMin, deadline = null, overdueMin = 15, title = '' }) {
          guard();
          const now = Date.now();
          let r = await R.getRec(m, id);
          const stageMin = intervalMin ? Math.max(1, Math.round(intervalMin)) : Schedule.stageMin(stage);
          if (intervalMin) stage = 'custom';
          const t = String(title || '').slice(0, 120);
          deadline = deadline || null;
          if (!r || r.deletedAt) {
            r = { id, stage, stageMin, deadline, overdueMin, title: t, nextAt: null, lastSentAt: null, sentCount: 0, done: false, unseen: false, createdAt: now, deletedAt: null };
            r.nextAt = Schedule.nextAt(r, now);   // erste Erinnerung nach einem Intervall, nicht sofort
          } else {
            const changed = r.stage !== stage || r.stageMin !== stageMin || (r.deadline || null) !== deadline || r.overdueMin !== overdueMin;
            Object.assign(r, { stage, stageMin, deadline, overdueMin, title: t });
            if (changed && !r.done) r.nextAt = Schedule.nextAt(r, now);
          }
          await R.putRec(m, r);
          return R.info(r);
        },
        async get(id) { const r = await R.getRec(m, id); return r && !r.deletedAt ? R.info(r) : null; },
        async list() { return (await Store.kvByCollection(m, R.C)).map(x => x.v).filter(r => !r.deletedAt).map(r => R.info(r)); },
        snooze(id, minutes) { return mutate(id, (r, now) => { r.nextAt = now + minutes * 60000; r.unseen = false; }); },
        snoozeUntil(id, ts) { return mutate(id, r => { r.nextAt = ts; r.unseen = false; }); },
        done(id) { return mutate(id, r => { r.done = true; r.nextAt = null; r.unseen = false; }); },
        reopen(id) { return mutate(id, (r, now) => { r.done = false; r.unseen = false; r.nextAt = Schedule.nextAt(r, now); }); },
        seen(id) { return mutate(id, r => { r.unseen = false; }); },
        remove(id) { return mutate(id, (r, now) => { r.deletedAt = now; r.done = true; r.nextAt = null; r.unseen = false; }); },
      };
    },
    describe(r, now, atDeadline) {
      if (r.deadline) {
        if (atDeadline || Math.abs(now - r.deadline) < 60000) return 'Jetzt fällig!';
        if (now > r.deadline) return `Überfällig seit ${U.formatDuration((now - r.deadline) / 60000)}`;
        return `Abgabe ${U.relTime(r.deadline, now)} (${U.formatDate(r.deadline)})`;
      }
      return `${r.sentCount}. Erinnerung · alle ${U.formatDuration(r.stageMin || Schedule.stageMin(r.stage))}`;
    },
    async tick({ catchUp = false } = {}) {
      // Mit erreichbarem Push-Dienst löst der Server aus; die App zeigt nur an (Architektur 10.4)
      if (Sync.active()) { await this.updateBadge(); return; }
      const run = async () => {
        const now = Date.now(), fired = [];
        const q = Settings.data.quiet;
        for (const def of Registry.list()) {
          if (Registry.isReadOnly(def.id)) continue;
          const recs = await Store.kvByCollection(def.id, this.C);
          for (const { v: r } of recs) {
            if (r.deletedAt || r.done || r.nextAt == null || r.nextAt > now) continue;
            const qEnd = Schedule.quietDefer(now, r, q);
            if (qEnd) { r.nextAt = qEnd; await this.putRec(def.id, r, { silent: true }); continue; }
            const atDeadline = !!r.deadline && r.nextAt === r.deadline;
            r.lastSentAt = now; r.sentCount = (r.sentCount || 0) + 1; r.unseen = true;
            r.nextAt = Schedule.nextAt(r, now);
            await this.putRec(def.id, r, { silent: true });
            fired.push({ def, r, atDeadline });
          }
        }
        if (fired.length) {
          await this.announce(fired, now, catchUp);
          Events.emit('reminders:changed', {});
          fired.forEach(f => Events.emit('reminder:fired', { moduleId: f.def.id, itemId: f.r.id }));
        }
        await this.updateBadge();
      };
      try {
        if (navigator.locks && navigator.locks.request) await navigator.locks.request('pa-reminder-tick', run);
        else await run();
      } catch (e) { Log.error('Erinnerungstakt: ' + e.message); }
    },
    async announce(fired, now, catchUp) {
      if (fired.length <= 5) {
        for (const { def, r, atDeadline } of fired) {
          const body = this.describe(r, now, atDeadline);
          await Notify.show({ title: `${r.title || def.name}`, body, tag: `${def.id}-${r.id}`, data: { m: def.id, id: r.id }, actions: [{ action: 'done', title: 'Erledigt' }, { action: 'snooze', title: '1 Std später' }] });
          if (document.visibilityState === 'visible') UI.toast(`${r.title || def.name} – ${body}`, { action: 'Öffnen', onAction: () => Router.navigate(def.id) });
        }
      } else {
        const first = fired[0].r.title || fired[0].def.name;
        const title = `${first} + ${fired.length - 1} weitere${catchUp ? ' (verpasst)' : ''}`;
        const body = fired.slice(0, 6).map(f => '• ' + (f.r.title || f.def.name)).join('\n') + (fired.length > 6 ? `\n… und ${fired.length - 6} weitere` : '');
        await Notify.show({ title, body, tag: 'pa-summary', data: { m: fired[0].def.id } });
        if (document.visibilityState === 'visible') UI.toast(title, { action: 'Ansehen', onAction: () => Router.navigate(fired[0].def.id) });
      }
    },
    async counts() {
      const out = {};
      for (const def of Registry.list()) {
        const recs = await Store.kvByCollection(def.id, this.C);
        const n = recs.filter(({ v }) => !v.deletedAt && !v.done && v.unseen).length;
        if (n) out[def.id] = n;
      }
      return out;
    },
    async updateBadge() {
      try {
        const c = await this.counts();
        Notify.setBadge(Object.values(c).reduce((a, b) => a + b, 0));
        Shell.setCounts(c);
      } catch (_) {}
    },
    /** Aktion aus einer Benachrichtigung (über Service Worker/Outbox) */
    async handleAction(m, id, action) {
      const def = Registry.modules.get(m);
      if (!def || Registry.isReadOnly(m)) return;
      const api = this.forModule(m);
      if (action === 'snooze') await api.snooze(id, 60);
      try { await Registry.call(m, 'onReminderAction', id, action); } catch (_) {}
      if (action === 'done') await api.done(id);
      Events.emit('reminders:changed', { moduleId: m });
    },
    /** Lokaler Namensindex für den Service Worker (meta.notifyTitles), damit Push-Mitteilungen den ToDo-Namen zeigen,
        auch wenn das Entschlüsseln im Service Worker zu lange dauert. Bleibt auf dem Gerät, geht nie an den Server. */
    async syncTitles() {
      try {
        const map = {};
        for (const def of Registry.modules.values()) {
          for (const { v } of await Store.kvByCollection(def.id, this.C)) if (!v.deletedAt && !v.done && v.title) map[`${def.id}/${v.id}`] = String(v.title).slice(0, 120);
        }
        await Store.metaSet('notifyTitles', map);
      } catch (e) { Log.warn('Namensindex: ' + e.message); }
    },
    start() {
      const titles = U.debounce(() => this.syncTitles(), 800);
      this.syncTitles();
      Events.on('reminders:changed', titles);
      Events.on('store:changed', e => { if (e && e.collection === this.C) titles(); });
      this.tick({ catchUp: true });
      setInterval(() => this.tick(), CONFIG.TICK_MS);
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { this.tick({ catchUp: true }); Events.emit('app:visible', {}); } });
      Events.on('settings:changed', () => this.updateBadge());
    },
  };

  /* ---- CORE: Outbox (Aktionen aus dem Service Worker) ---- */
  const Outbox = {
    async process() {
      const run = async () => {
        const items = await IDB.run('outbox', 'readonly', s => IDB.rq(s.getAll()));
        for (const it of items.filter(i => i.kind === 'action')) {
          try { await Reminders.handleAction(it.module, it.itemId, it.action); } catch (e) { Log.error('Outbox-Aktion: ' + e.message); }
          await IDB.run('outbox', 'readwrite', s => { s.delete(it.id); });
        }
      };
      try { if (navigator.locks && navigator.locks.request) await navigator.locks.request('pa-outbox', run); else await run(); }
      catch (e) { Log.error('Outbox: ' + e.message); }
    },
  };

  /* ---- CORE: Push ---- */
  /* Web-Push-Abo dieses Geräts beim Worker (Architektur 8.4). */
  const Push = {
    subscribedHere: false,
    supported: () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window && location.protocol !== 'file:',
    async reg() {
      if (SWReg.reg) return SWReg.reg;
      if (!('serviceWorker' in navigator)) return null;
      return Promise.race([navigator.serviceWorker.ready, new Promise(r => setTimeout(() => r(null), 5000))]);
    },
    async current() {
      try { const r = await this.reg(); return r && r.pushManager ? await r.pushManager.getSubscription() : null; } catch (_) { return null; }
    },
    unsupportedReason() {
      if (U.isIOS() && !U.isStandalone()) return 'iPhone/iPad: Die App zuerst über „Teilen → Zum Home-Bildschirm“ installieren und dann vom Icon aus öffnen.';
      return 'Dieser Browser unterstützt kein Web Push.';
    },
    /** Muss durch ein Tippen ausgelöst werden (iOS) */
    async enable() {
      if (!this.supported()) throw new Error(this.unsupportedReason());
      if (!Sync.enabled()) throw new Error('Bitte zuerst Push & Sync einrichten.');
      const p = await Notify.request();
      if (p !== 'granted') throw new Error(p === 'denied' ? 'Benachrichtigungen sind blockiert – bitte in den Browser-/Systemeinstellungen erlauben.' : 'Benachrichtigungen wurden nicht erlaubt.');
      const cfg = await Api.req('GET', '/v1/config', null, { token: null });
      if (!cfg.vapidPublicKey) throw new Error('Auf dem Server fehlt der VAPID-Schlüssel.');
      const reg = await this.reg();
      if (!reg) throw new Error('Service Worker nicht bereit. Bitte die App neu laden.');
      let sub = await reg.pushManager.getSubscription();
      const st = await Store.metaGet('push', {});
      if (sub && st.vapid && st.vapid !== cfg.vapidPublicKey) { try { await sub.unsubscribe(); } catch (_) {} sub = null; }
      if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: Crypto.unb64u(cfg.vapidPublicKey) });
      await Api.req('PUT', '/v1/subscription', sub.toJSON());
      await Store.metaSet('push', { v: 3, subscribed: true, endpoint: sub.endpoint, at: Date.now(), vapid: cfg.vapidPublicKey });
      this.subscribedHere = true;
      Events.emit('push:changed', {});
      Log.info('Push auf diesem Gerät aktiviert');
    },
    async disable() {
      const sub = await this.current();
      if (sub) {
        if (Sync.enabled()) { try { await Api.req('DELETE', '/v1/subscription', { endpoint: sub.endpoint }); } catch (_) {} }
        try { await sub.unsubscribe(); } catch (_) {}
      }
      await Store.metaSet('push', { subscribed: false });
      this.subscribedHere = false;
      Events.emit('push:changed', {});
    },
    /** Beim Start: Abo prüfen und einmal täglich beim Server auffrischen */
    async refresh() {
      const st = await Store.metaGet('push', {});
      if (!Sync.enabled() || !this.supported()) { this.subscribedHere = false; return; }
      const reg = await this.reg();
      if (!reg || !reg.pushManager) return;              // Service Worker (noch) nicht bereit: Zustand nicht verändern
      const sub = await reg.pushManager.getSubscription().catch(() => null);
      const was = this.subscribedHere;
      if (!sub) {
        this.subscribedHere = false;
        if (st.subscribed) { await Store.metaSet('push', { subscribed: false }); Log.warn('Push-Abo wurde vom Browser entfernt – bitte erneut aktivieren'); }
        if (was) Events.emit('push:changed', {});
        return;
      }
      // Vorhandenes Abo gilt immer als aktiv (unabhängig von Notification.permission, siehe iOS-Fehler)
      this.subscribedHere = true; Notify.pushGranted = true;
      if (!was) Events.emit('push:changed', {});
      if (!st.subscribed || st.v !== 3 || sub.endpoint !== st.endpoint || Date.now() - (st.at || 0) > 6 * 3600000) {
        try { await Api.req('PUT', '/v1/subscription', sub.toJSON()); await Store.metaSet('push', { ...st, v: 3, subscribed: true, endpoint: sub.endpoint, at: Date.now() }); }
        catch (e) { Log.warn('Push-Abo auffrischen: ' + e.message); }
      }
    },
    test() { return Api.req('POST', '/v1/test-push', {}); },
  };

  /* Service-Worker-Registrierung */
  const SWReg = {
    reg: null, wantReload: false,
    async register() {
      if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
      try {
        const reg = await navigator.serviceWorker.register('./sw.js', { scope: './' });
        this.reg = reg; Notify.reg = reg;
        const onWaiting = () => { if (reg.waiting && navigator.serviceWorker.controller) VersionGuard.showUpdate('Neue Version bereit.'); };
        onWaiting();
        reg.addEventListener('updatefound', () => { const w = reg.installing; w && w.addEventListener('statechange', () => { if (w.state === 'installed') onWaiting(); }); });
        navigator.serviceWorker.addEventListener('controllerchange', () => { if (this.wantReload) { this.wantReload = false; location.reload(); } });
        navigator.serviceWorker.addEventListener('message', e => {
          const d = e.data || {};
          if (d.type === 'outbox') Outbox.process();
          if (d.type === 'sync') Sync.run();

        });
        navigator.serviceWorker.ready.then(r => { this.reg = r; Notify.reg = r; });
      } catch (e) { Log.warn('Service Worker nicht registriert: ' + e.message); }
    },
    applyUpdate() {
      if (this.reg && this.reg.waiting) { this.wantReload = true; this.reg.waiting.postMessage({ type: 'skipWaiting' }); setTimeout(() => location.reload(), 3000); }
      else location.reload();
    },
  };

  /* ---- CORE: Shell ---- */
  const Shell = {
    counts: {},
    render() {
      const nav = document.getElementById('nav');
      nav.replaceChildren(...Registry.list().map(d => UI.h('a', { href: Router.link(d.id === 'start' ? '' : d.id), 'data-id': d.id },
        UI.h('span', { class: 'ic', 'aria-hidden': 'true' }, UI.icon(d.icon)), UI.h('span', {}, d.name), this.counts[d.id] ? UI.h('span', { class: 'count' }, this.counts[d.id]) : null)));
      if (Router.current) this.highlight(Router.current.moduleId);
    },
    highlight(id) { document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('active', a.dataset.id === id)); },
    setCounts(c) { const changed = JSON.stringify(c) !== JSON.stringify(this.counts); this.counts = c; if (changed) this.render(); },
    status(text) { document.getElementById('status').textContent = text || ''; },
  };

  /* ---- CORE: System (nur für System-Module start/einstellungen) ---- */
  const System = {
    CONFIG, CHANGELOG, Registry, Backup, Settings, Notify, Reminders, Schedule, Log, Theme, VersionGuard, SWReg, Sync, Push, Api, Router: Router.api,
    async storage() {
      const out = { persisted: null, usage: null, quota: null };
      try { if (navigator.storage?.persisted) out.persisted = await navigator.storage.persisted(); } catch (_) {}
      try { if (navigator.storage?.estimate) { const e = await navigator.storage.estimate(); out.usage = e.usage; out.quota = e.quota; } } catch (_) {}
      return out;
    },
    lastExportAt: () => Store.metaGet('lastExportAt', null),
    /** Vom Service Worker protokollierte Push-Empfänge (neueste zuerst), alte werden aufgeräumt */
    async pushLog() {
      const all = (await IDB.run('outbox', 'readonly', s => IDB.rq(s.getAll()))).filter(e => e.kind === 'pushlog').sort((a, b) => b.at - a.at);
      const old = all.slice(30);

    async hints() {

      const app = await Store.metaGet('app', {});

      const days = Sync.enabled() ? 30 : st.persisted === false ? 7 : 14;

      const p = Notify.permission();
      if (p === 'default') hints.push({ id: 'notify', icon: 'bell', text: 'Benachrichtigungen sind noch nicht erlaubt – sonst kann dich die App nicht erinnern.', action: 'Erlauben', run: () => Notify.request() });
      else if (p === 'denied') hints.push({ id: 'notify', icon: 'bell-off', text: 'Benachrichtigungen sind blockiert. Erlaube sie in den Browser-Einstellungen für diese Seite.' });
      else if (p === 'unsupported' && U.isIOS() && !U.isStandalone()) hints.push({ id: 'ios', icon: 'phone', text: 'iPhone: Für Benachrichtigungen die App über „Teilen → Zum Home-Bildschirm“ installieren und von dort öffnen.' });
      if (!Sync.enabled()) {

          action: revoked ? 'Neu verbinden' : 'Einrichten', run: () => Router.navigate('einstellungen') });
      } else if (Push.supported() && !Push.subscribedHere) {
        hints.push({ id: 'push', icon: 'bell', text: 'Push ist auf diesem Gerät noch nicht aktiv. Ohne Push erinnert dieses Gerät nur, solange die App geöffnet ist.', action: 'Push aktivieren',
          run: async () => { try { await Push.enable(); UI.toast('Push aktiviert'); } catch (e) { UI.toast(e.message, { type: 'error', timeout: 8000 }); } } });
      }
      return hints;
    },
  };

  /* ---- CORE: Boot ---- */
  const App = {
    register: def => Registry.register(def),
    async boot() {
      Theme.start();
      window.addEventListener('error', e => { Log.error(`${e.message} (${e.filename?.split('/').pop()}:${e.lineno})`); });
      window.addEventListener('unhandledrejection', e => { Log.error('Unbehandelt: ' + (e.reason && e.reason.message || e.reason)); });
      try { await IDB.open(); }
      catch (e) {
        document.getElementById('view').replaceChildren(UI.errorCard(e, 'Datenspeicher nicht verfügbar'), UI.h('p', { class: 'muted' }, 'Möglicherweise ist privates Surfen aktiv oder der Speicher ist voll. Deine bisherigen Daten wurden nicht verändert.'));
        return;
      }
      await Log.load();
      await Settings.load();
      await Sync.load();
      Push.subscribedHere = !!(await Store.metaGet('push', {})).subscribed;
      Notify.pushGranted = Push.subscribedHere;
      Tabs.start();
      await VersionGuard.check();
      await Migrator.runAll();
      Shell.render();
      await Router.start();
      VersionGuard.start();
      SWReg.register();
      await Sync.start();
      Notify.refreshPermission().then(() => Push.refresh()).catch(e => Log.warn('Push: ' + e.message));
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') Notify.refreshPermission().then(() => Push.refresh()).catch(() => {}); });
      Outbox.process();
      for (const def of Registry.list()) if (typeof def.background === 'function') Registry.call(def.id, 'background').catch(() => {});
      Reminders.start();
      Backup.daily();
      Events.on('settings:changed', ({ key }) => { if (key === 'hiddenModules') { Shell.render(); } });
      const firstGesture = async () => {
        Notify.unlockAudio();
        if (!(await Store.metaGet('persistAsked', false))) { await Store.metaSet('persistAsked', true); System.requestPersist(); }
        window.removeEventListener('pointerdown', firstGesture); window.removeEventListener('keydown', firstGesture);
      };
      window.addEventListener('pointerdown', firstGesture); window.addEventListener('keydown', firstGesture);
      Log.info(`Start ${CONFIG.APP_VERSION}`);
    },
  };
  window.App = App;
  /* ==== ENDE CORE ==== */
  </script>
