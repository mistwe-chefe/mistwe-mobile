      if (r && r.unseen) await markSeen(ctx, id);
      let iv = ivOf(ctx, t), deadline = t.deadline;
      const titleIn = h('input', { type: 'text', value: t.title, autofocus: true, 'aria-label': 'Titel' });
      const noteIn = h('textarea', { 'aria-label': 'Notiz', placeholder: 'Notiz (optional)' }); noteIn.value = t.note || '';
      const overdueSel = h('select', {}, OVERDUE_OPTS.map(m => h('option', { value: m, selected: (t.overdueMin || 15) === m }, `alle ${m} Min`)));
      const preview = h('div', { class: 'small muted' });
      const upd = () => {
        if (t.done) { preview.textContent = 'Erledigt – keine Erinnerungen.'; return; }
        const changed = iv !== ivOf(ctx, t) || (deadline || null) !== (t.deadline || null) || Number(overdueSel.value) !== (t.overdueMin || 15);
        const n = changed || !r ? ctx.reminders.preview({ intervalMin: iv, deadline, overdueMin: Number(overdueSel.value) }) : r.nextAt;
        preview.textContent = n ? `Nächste: ${U.formatDate(n)}` : '';
      };
      overdueSel.onchange = upd;
      const dl = deadlineEditor(ctx, deadline, v => { deadline = v; upd(); });
      upd();
      const result = await dialog(close => h('form', { onsubmit: e => { e.preventDefault(); close('save'); } },
        h('h3', {}, 'ToDo bearbeiten'),
        h('div', { class: 'stack' },
          titleIn, noteIn,
          h('div', { class: 'small muted' }, 'Intervall'),
          intervalEditor(ctx, iv, v => { iv = v; upd(); }).el,
          h('div', { class: 'small muted' }, 'Abgabe'),
          dl.el,
          h('label', { class: 'field' }, h('span', {}, 'Überfällig'), overdueSel),
          preview,
          r ? h('div', { class: 'small muted' }, `${r.sentCount}× · seit ${U.formatDate(t.createdAt)}`) : null),
        h('div', { class: 'dlg-actions' },
          h('button', { type: 'button', class: 'btn btn-ghost', style: { marginRight: 'auto', color: 'var(--danger)' }, onclick: () => close('delete') }, 'Löschen'),
          h('button', { type: 'button', class: 'btn', onclick: () => close() }, 'Abbrechen'),
          h('button', { type: 'submit', class: 'btn btn-primary' }, 'Speichern'))), { label: 'ToDo bearbeiten' });

      if (result === 'save') {
        const title = titleIn.value.trim();
        if (!title) { toast('Titel darf nicht leer sein'); return; }
        const overdueMin = Number(overdueSel.value);
        const nt = await col.update(id, { title, note: noteIn.value, stage: 'custom', intervalMin: iv, deadline: deadline || null, overdueMin });
        await ctx.reminders.set(id, remArgs(ctx, nt));
        toast('Gespeichert');
      } else if (result === 'delete') {
        if (await confirm(`„${t.title}“ löschen?`, { ok: 'Löschen', danger: true })) {
          await col.remove(id); await ctx.reminders.remove(id);
          toast('Gelöscht', { action: 'Rückgängig', onAction: async () => { await col.update(id, { deletedAt: null }); await ctx.reminders.set(id, remArgs(ctx, t)); if (t.done) await ctx.reminders.done(id); } });
        }
      }
    }

    /** Fenster „Neues ToDo“ – liegt über der Modul-Oberfläche */
    async function openCreate(ctx) {
      const { h, dialog, toast } = ctx.ui; const U = ctx.util;
      const c = await cfg(ctx);
      let iv = c.intervalMin, deadline = null;
      const titleIn = h('input', { type: 'text', class: 'title-input', placeholder: 'Was ist zu tun?', enterkeyhint: 'done', 'aria-label': 'Titel', autocomplete: 'off', autofocus: true });
      const noteIn = h('textarea', { 'aria-label': 'Notiz', placeholder: 'Notiz (optional)', rows: 2 });
      const preview = h('div', { class: 'preview' });
      const upd = () => {
        const n = ctx.reminders.preview({ intervalMin: iv, deadline, overdueMin: c.overdueMin });
        preview.textContent = `1. Erinnerung ${U.formatDate(n)}`;
      };
      const dl = deadlineEditor(ctx, deadline, v => { deadline = v; upd(); });
      upd();
      const ok = await dialog(close => {
        const form = h('form', { class: 'composer', onsubmit: e => { e.preventDefault(); if (titleIn.value.trim()) close(true); else titleIn.focus(); } },
          h('h3', {}, 'Neues ToDo'),
          titleIn,
          h('div', { class: 'lbl' }, 'Intervall'),
          intervalEditor(ctx, iv, v => { iv = v; upd(); }).el,
          h('div', { class: 'lbl' }, 'Abgabe (opt.)'),
          dl.el,
          h('div', { style: { marginTop: '10px' } }, noteIn),
          preview,
          h('div', { class: 'dlg-actions' },
            h('button', { type: 'button', class: 'btn', onclick: () => close(false) }, 'Abbrechen'),
            h('button', { type: 'submit', class: 'btn btn-primary' }, 'Anlegen')));
        titleIn.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); form.requestSubmit(); } });
        return form;
      }, { label: 'Neues ToDo' });
      if (!ok) return;
      try {
        await create(ctx, { title: titleIn.value.trim(), note: noteIn.value.trim() ? noteIn.value : '', intervalMin: iv, deadline });
        if (ctx.notify.permission() === 'default') toast('Benachrichtigungen aus', { action: 'Erlauben', onAction: () => ctx.notify.request(), timeout: 9000 });
        else toast('Angelegt');
      } catch (err) { toast('Fehler: ' + err.message, { type: 'error' }); }
    }

    /** Einstellungen des Moduls – direkt im Modul */
    async function openSettings(ctx) {
      const { h, dialog, toast } = ctx.ui;
      const c = await cfg(ctx);
      let iv = c.intervalMin;
      const ivEd = intervalEditor(ctx, iv, v => { iv = v; });
      const overSel = h('select', {}, OVERDUE_OPTS.map(m => h('option', { value: m, selected: m === c.overdueMin }, `alle ${m} Min`)));
      const ok = await dialog(close => h('form', { onsubmit: e => { e.preventDefault(); close(true); } },
        h('h3', { class: 'row', style: { gap: '8px' } }, ctx.ui.icon('settings'), 'ToDos'),
        h('div', { class: 'stack' },
          h('div', { class: 'field' }, h('span', { class: 'small muted', style: { display: 'block', marginBottom: '4px' } }, 'Standard-Intervall'), ivEd.el),
          h('label', { class: 'field' }, h('span', {}, 'Überfällig'), overSel)),
        h('div', { class: 'dlg-actions' },
          h('button', { type: 'button', class: 'btn', onclick: () => close(false) }, 'Abbrechen'),
          h('button', { type: 'submit', class: 'btn btn-primary' }, 'Speichern'))), { label: 'ToDo-Einstellungen' });
      if (!ok) return;
      if (ivEd.get() >= 1) await ctx.settings.set('defaultIntervalMin', ivEd.get());
      await ctx.settings.set('overdueMin', Number(overSel.value));
      toast('Gespeichert');
    }

    /** Alle ausgelösten Erinnerungen als gesehen markieren (Modul ist offen und sichtbar) */
    async function markAllSeen(ctx) {
      if (ctx.readOnly || document.visibilityState !== 'visible') return;
      const rems = await ctx.reminders.list();
      for (const r of rems) if (r.unseen) await ctx.reminders.seen(r.id);
    }

    let highlightId = null;

    App.register({
      id: 'todos', name: 'ToDos', icon: 'todos', order: 10,
      description: 'Aufgaben mit hartnäckigen Erinnerungen', category: 'Alltag',
      version: '1.6.0', schemaVersion: 1, migrations: {},

      async init(ctx) { col = ctx.store.collection('todos', { sync: true }); },

      async mount(el, ctx, route) {
        const { h, toast } = ctx.ui; const U = ctx.util;
        const openBox = h('div');
        const doneBox = h('div');
        el.append(
          h('div', { class: 'head' },
            h('h2', {}, 'ToDos'),
            h('button', { class: 'btn btn-ghost', title: 'Einstellungen', 'aria-label': 'ToDo-Einstellungen', onclick: () => openSettings(ctx), disabled: ctx.readOnly }, ctx.ui.icon('settings'))),
          openBox, doneBox,
          h('button', { class: 'btn btn-primary fab', title: 'Neues ToDo', 'aria-label': 'Neues ToDo', onclick: () => openCreate(ctx), disabled: ctx.readOnly }, ctx.ui.icon('plus')));

        let doneOpen = false;

        const row = (t, now) => {
          const u = t.deadline && !t.done ? urgency(t.deadline, now) : null;
          return h('li', { class: 'todo' + (t.done ? ' done' : '') + (u === 'red' ? ' overdue' : u === 'orange' ? ' soon' : '') + (t.id === highlightId ? ' flash' : ''), 'data-id': t.id },
            h('button', { class: 'check', 'aria-label': t.done ? 'Wieder öffnen' : 'Abhaken', title: t.done ? 'Wieder öffnen' : 'Abhaken', disabled: ctx.readOnly, onclick: async () => {
              if (t.done) { await reopen(ctx, t.id); toast('Wieder offen'); }
              else { await complete(ctx, t.id); toast(`„${t.title}“ erledigt `, { action: 'Rückgängig', onAction: () => reopen(ctx, t.id) }); }
            } }, h('span')),
            h('div', { class: 't-body', onclick: () => openEdit(ctx, t.id) },
              h('div', { class: 't-title' }, t.title),
              t.note ? h('div', { class: 't-note' }, t.note) : null,
              metaLine(ctx, t, now)),
            t.done ? h('div', { class: 'done-actions' }, h('button', { class: 'btn btn-ghost btn-sm', title: 'Löschen', 'aria-label': 'Löschen', disabled: ctx.readOnly, onclick: async e => {
              e.stopPropagation();
              await col.remove(t.id); await ctx.reminders.remove(t.id);
              toast('Gelöscht', { action: 'Rückgängig', onAction: async () => { await col.update(t.id, { deletedAt: null }); } });
            } }, ctx.ui.icon('trash'))) : null);
        };

        const render = async () => {
          const now = Date.now();
          const all = await loadAll(ctx);
          const open = all.filter(t => !t.done).sort(sortOpen(now));
          const done = all.filter(t => t.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
          openBox.replaceChildren(
            h('div', { class: 'section-title' }, `Aktiv (${open.length})`),
            open.length ? h('ul', { class: 'todo-list' }, open.map(t => row(t, now))) : h('div', { class: 'card empty' }, 'Nichts offen.'));
          if (done.length) {
            const det = h('details', { class: 'fold', open: doneOpen, ontoggle: () => { doneOpen = det.open; } },
              h('summary', {}, `Erledigt (${done.length})`),
              h('ul', { class: 'todo-list' }, done.slice(0, 200).map(t => row(t, now))));
            doneBox.replaceChildren(det);
          } else doneBox.replaceChildren();
          if (highlightId) {
            const li = openBox.querySelector(`li[data-id="${CSS.escape(highlightId)}"]`) || doneBox.querySelector(`li[data-id="${CSS.escape(highlightId)}"]`);
            if (li) li.scrollIntoView({ block: 'center', behavior: 'smooth' });
            highlightId = null;
          }
          if (all.some(t => t._r && t._r.unseen)) markAllSeen(ctx);
        };

        const re = U.debounce(render, 150);
        ctx.events.on('store:changed', e => { if (e.moduleId === 'todos') re(); });
        ctx.events.on('reminders:changed', re);
        ctx.events.on('reminder:fired', re);
        ctx.events.on('app:visible', re);
        ctx.every(30000, render);
        this._render = render;
        if (route.parts[0]) await this.onRoute(route, ctx); else await render();
      },

      /** #/todos/<id> (z. B. aus der Startseiten-Kachel) markiert das ToDo in der Liste – kein Bearbeiten-Fenster */
      async onRoute(route, ctx) {
        const id = route.parts[0];
        if (!id) return;
        highlightId = id;
        ctx.router.navigate('todos', { replace: true });
        if (this._render) await this._render();
      },

      unmount() { this._render = null; },

      /** Ausschnitt für die Startseite: aktive ToDos in einem scrollbaren Feld (ca. 1/3 der Bildschirmhöhe) */
      async widget(el, ctx) {
        const { h, toast } = ctx.ui;
        const scroll = h('div', { class: 'w-scroll' });
        const count = h('span', { class: 'w-count' });
        el.append(
          h('div', { class: 'w-head' },
            h('a', { class: 'w-title', href: ctx.router.link('todos'), 'aria-label': 'ToDos' }, ctx.ui.icon('todos'), count),
            h('button', { class: 'btn btn-ghost btn-sm', title: 'Neues ToDo', 'aria-label': 'Neues ToDo', disabled: ctx.readOnly, onclick: () => openCreate(ctx) }, ctx.ui.icon('plus'))),
          scroll);
        const wrow = (t, now) => {
          const u = t.deadline ? urgency(t.deadline, now) : null;
          return h('li', { class: 'todo' + (u === 'red' ? ' overdue' : u === 'orange' ? ' soon' : '') },
            h('button', { class: 'check', 'aria-label': 'Abhaken', title: 'Abhaken', disabled: ctx.readOnly, onclick: async () => {
              await complete(ctx, t.id); toast(`„${t.title}“ erledigt `, { action: 'Rückgängig', onAction: () => reopen(ctx, t.id) });
            } }, h('span')),
            h('div', { class: 't-body', onclick: () => ctx.router.navigate(`todos/${t.id}`) },
              h('div', { class: 't-title' }, t.title),
              metaLine(ctx, t, now)));
        };
        const render = async () => {
          const now = Date.now();
          const open = (await loadAll(ctx)).filter(t => !t.done).sort(sortOpen(now));
          const top = scroll.scrollTop;
          count.textContent = String(open.length);
          scroll.replaceChildren(open.length ? h('ul', { class: 'todo-list' }, open.map(t => wrow(t, now))) : h('div', { class: 'empty small' }, 'Nichts offen.'));
          scroll.scrollTop = top;
        };
        const re = ctx.util.debounce(render, 150);
        ctx.events.on('store:changed', e => { if (e.moduleId === 'todos') re(); });
        ctx.events.on('reminders:changed', re);
        ctx.events.on('app:visible', re);
        ctx.every(30000, render);
        await render();
      },

      async onReminderAction(itemId, action, ctx) {
        if (action === 'done') { const t = await col.get(itemId); if (t && !t.done) await col.update(itemId, { done: true, doneAt: Date.now() }); }
        if (action === 'snooze') { const t = await col.get(itemId); if (t) await col.update(itemId, { seenAt: Date.now() }); }
      },
    });
  })();
  /* ==== ENDE MODUL: todos ==== */
  </script>


  <script>
  /* ==== MODUL: ernaehrung ==== */
  (() => {
    let col;
    const pad = n => String(n).padStart(2, '0');
    const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const dateOf = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d, 12); };
    const addDays = (k, n) => { const d = dateOf(k); d.setDate(d.getDate() + n); return keyOf(d); };
    const todayKey = () => keyOf(new Date());
    const isKey = k => /^\d{4}-\d{2}-\d{2}$/.test(String(k || ''));
    /** Zahl aus Eingabe („72,4“, „1.850“) – null = leer, NaN = ungültig */
    const parseNum = (s, thousands = false) => {
      let t = String(s ?? '').replace(/\s/g, '');
      if (thousands) t = t.replace(/\.(?=\d{3}$)/, '');
      t = t.replace(',', '.');
      if (!t) return null;
      const n = Number(t);
      return Number.isFinite(n) ? n : NaN;
    };
    const r1 = n => Math.round(n * 10) / 10;
    const fmtKg = n => n == null ? '–' : n.toLocaleString('de-DE', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
    const fmtKcal = n => n == null ? '–' : Math.round(n).toLocaleString('de-DE');
    const fmtG = n => n == null ? '–' : (n < 10 ? r1(n) : Math.round(n)).toLocaleString('de-DE');
    const fmtGIn = n => n == null ? '' : String(r1(n)).replace('.', ',');
    const MAX_AHEAD = 30;   // so viele Tage im Voraus lassen sich Einträge planen
    const fmtShort = k => dateOf(k).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
    const fmtLong = k => {
      const t = todayKey(), d = dateOf(k);
      const pre = k === t ? 'Heute, ' : k === addDays(t, -1) ? 'Gestern, ' : k === addDays(t, 1) ? 'Morgen, ' : '';
      return pre + d.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit', ...(d.getFullYear() !== new Date().getFullYear() ? { year: 'numeric' } : {}) });
    };
    const fmtTime = ts => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };

    /** Nährstoffe (Feldnamen im Datensatz sind unveränderlich) */
    const NUTS = [
      { k: 'proteinG', label: 'Eiweiß', short: 'E' },
      { k: 'carbsG', label: 'Kohlenhydrate', short: 'KH' },
      { k: 'fiberG', label: 'Ballaststoffe', short: 'B' },
      { k: 'fatG', label: 'Fett', short: 'F' },
    ];
    const VALS = ['kcal', ...NUTS.map(n => n.k)];
    /** „E 20 · KH 60 · B 4 · F 22 g“ – nur vorhandene Werte */
    const nutLine = o => { const p = NUTS.filter(n => o[n.k] != null).map(n => `${n.short} ${fmtG(o[n.k])}`); return p.length ? p.join(' · ') + ' g' : ''; };

    /* Temporärer Claude-Chat (Inkognito) mit vorausgefülltem Prompt inkl. Lebensmitteln.
       Claude antwortet im festen Format „KCAL v2“, das parseAnswer() einliest (v1 = nur kcal, wird weiter verstanden).
       Format nie inkompatibel ändern – neue Felder nur über eine neue Versionsnummer. */
    const CLAUDE_PROMPT = [
      'Schätze Kalorien und Nährwerte der folgenden Lebensmittel und Getränke. Wenn keine Menge angegeben ist, nimm eine übliche Portion an.',
      '',
      'Antworte ausschließlich mit einem einzigen Codeblock in genau diesem Format, ohne Text davor oder danach:',
      '',
      '```',
      'KCAL v2',
      'Lebensmittel; Menge; kcal; Eiweiß g; Kohlenhydrate g; Ballaststoffe g; Fett g',
      'SUMME; kcal; Eiweiß g; Kohlenhydrate g; Ballaststoffe g; Fett g',
      '```',
      '',
      'Regeln:',
      '- Erste Zeile ist immer „KCAL v2“.',
      '- Danach eine Zeile pro Lebensmittel mit genau 7 Feldern: Name; Menge mit Einheit; kcal; Eiweiß; Kohlenhydrate; Ballaststoffe; Fett.',
      '- Letzte Zeile: SUMME; kcal; Eiweiß; Kohlenhydrate; Ballaststoffe; Fett (jeweils die Summe aller Zeilen).',
      '- Trennzeichen ist das Semikolon. Keine Semikolons in Namen oder Mengen.',
      '- kcal als ganze Zahl ohne Einheit und ohne Tausenderpunkt. Nährwerte in Gramm ohne Einheit, höchstens eine Nachkommastelle mit Punkt (z. B. 12.5).',
      '- Keine Kopfzeile, keine Tabelle, kein Markdown im Codeblock.',
      '',
      'Lebensmittel:',
      '',
    ].join('\n');
    const MAX_FOODS = 6000;
    const claudeUrl = foods => 'https://claude.ai/new?incognito=true&q=' + encodeURIComponent(CLAUDE_PROMPT + String(foods || '').trim().slice(0, MAX_FOODS));

    const cleanField = s => String(s || '').toLowerCase().replace(/kcal|kalorien|gramm|ca\.|~|≈/g, '').replace(/\s/g, '').replace(/g$/, '');
    /** kcal-Feld: „394“, „1.234“, „ca. 300 kcal“, „300-350“ (→ Mittelwert) */
    function parseKcalField(s) {
      const t = cleanField(s);
      const num = x => Number(x.replace(/\.(?=\d{3}(?!\d))/g, '').replace(',', '.'));
      const range = t.match(/^(\d[\d.,]*)[-–](\d[\d.,]*)$/);
      if (range) return Math.round((num(range[1]) + num(range[2])) / 2);
      return /^\d[\d.,]*$/.test(t) ? Math.round(num(t)) : NaN;
    }
    /** Gramm-Feld: „12.5“, „12,5“, „12 g“, „<1“ (→ 0,5), „10-12“ (→ Mittelwert). Punkt ist hier immer Dezimaltrenner. */
    function parseGramField(s) {
      let t = cleanField(s);
      if (/^<\d/.test(t)) t = String(Number(t.slice(1).replace(',', '.')) / 2);
      const num = x => Number(x.replace(',', '.'));
      const range = t.match(/^(\d[\d.,]*)[-–](\d[\d.,]*)$/);
      if (range) return r1((num(range[1]) + num(range[2])) / 2);
      return /^\d[\d.,]*$/.test(t) ? r1(num(t)) : NaN;
    }
    /** Antwort von Claude einlesen (KCAL v2, KCAL v1, Markdown-Tabelle, „|“/Tab als Trenner, Notlösung Fließtext). */
    function parseAnswer(text) {
      const items = [];
      let total = null;
      const readNums = parts => {
        // Hinten stehende Zahlenfelder: 5 → kcal + 4 Nährstoffe, sonst nur kcal (letztes Feld)
        if (parts.length >= 6 && parts.slice(-5).every((p, i) => Number.isFinite(i ? parseGramField(p) : parseKcalField(p)))) {
          const [k, ...g] = parts.slice(-5);
          const o = { kcal: parseKcalField(k) };
          NUTS.forEach((n, i) => { o[n.k] = parseGramField(g[i]); });
          return { o, rest: parts.slice(0, -5) };
        }
        const k = parseKcalField(parts[parts.length - 1]);
        if (!Number.isFinite(k)) return null;
        const o = { kcal: k }; NUTS.forEach(n => { o[n.k] = null; });
        return { o, rest: parts.slice(0, -1) };
      };
      for (let line of String(text || '').split(/\r?\n/)) {
        line = line.replace(/[*`]/g, '').trim();
        if (!line || /^kcal\s*v\d+$/i.test(line)) continue;
        const parts = line.split(/\s*[;|\t]\s*/).map(x => x.trim()).filter(Boolean);
        if (parts.length < 2) continue;
        const isSum = /^(summe|gesamt|insgesamt|total)\b/i.test(parts[0]);
        const r = readNums(isSum ? parts : parts);
        if (!r) continue;   // Kopfzeilen, Trennlinien
        if (isSum) { total = r.o; continue; }
        if (!r.rest.length || r.o.kcal < 0 || r.o.kcal > 10000) continue;
        if (NUTS.some(n => r.o[n.k] != null && (r.o[n.k] < 0 || r.o[n.k] > 2000))) continue;
        items.push({ name: r.rest[0], amount: r.rest.slice(1).join(' '), ...r.o });
      }
      if (!items.length && !total) {   // Notlösung für freien Text: „Summe: 1.234 kcal“
        const m = String(text || '').match(/(?:summe|gesamt|insgesamt|total)[^\d\n]{0,40}(\d[\d.,]*)\s*kcal/i);
        if (m && Number.isFinite(parseKcalField(m[1]))) { total = { kcal: parseKcalField(m[1]) }; NUTS.forEach(n => { total[n.k] = null; }); }
      }
      // Maßgeblich ist die nachgerechnete Summe der Positionen (Rechenfehler in SUMME werden so korrigiert).
      const sum = {};
      for (const v of VALS) {
        const have = items.filter(i => i[v] != null);
        if (items.length && have.length === items.length) sum[v] = v === 'kcal' ? Math.round(have.reduce((a, i) => a + i[v], 0)) : r1(have.reduce((a, i) => a + i[v], 0));
        else sum[v] = total && total[v] != null ? total[v] : null;
      }
      const mismatch = !!total && items.length > 0 && VALS.some(v => total[v] != null && sum[v] != null && Math.abs(total[v] - sum[v]) > (v === 'kcal' ? 1 : 0.6));
      return { items, total, sum, ok: sum.kcal != null, mismatch, hasNuts: NUTS.some(n => sum[n.k] != null) };
    }

    const RANGES = [
      { id: '7', label: '7 Tage', days: 7 },
      { id: '30', label: '30 Tage', days: 30 },
      { id: '90', label: '90 Tage', days: 90 },
      { id: '365', label: '1 Jahr', days: 365 },
      { id: 'all', label: 'Alles', days: null },
    ];

    /* ---- Diagramme (SVG, ohne Bibliothek; Text immer über textContent) ---- */
    const SVGNS = 'http://www.w3.org/2000/svg';
    const s = (tag, attrs = {}, text) => {
      const el = document.createElementNS(SVGNS, tag);
      for (const [k, v] of Object.entries(attrs)) if (v != null) el.setAttribute(k, String(v));
      if (text != null) el.textContent = String(text);
      return el;
    };
    function niceTicks(min, max, count = 4) {
      const span = max - min || 1;
      const raw = span / count, mag = 10 ** Math.floor(Math.log10(raw));
      const step = [1, 2, 2.5, 5, 10].map(f => f * mag).find(x => x >= raw) || 10 * mag;
      const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
      const ticks = [];
      for (let v = lo; v <= hi + step / 2; v += step) ticks.push(+v.toFixed(6));
      return { lo, hi, ticks };
    }
    /** type: 'line' | 'bar'; values: Map<Tag, Zahl>; goal: Ziellinie oder null */
    function chart(ctx, { title, keys, values, type, goal, fmt, unit, zero, width }) {
      const { h } = ctx.ui;
      // viewBox in echter Pixelbreite, damit Schrift und Punkte auf jedem Gerät gleich groß sind
      const W = Math.max(280, Math.round(width || 640)), H = 190, L = 46, R = 8, T = 10, B = 24;
      const pw = W - L - R, ph = H - T - B;
      const pts = keys.map((k, i) => ({ k, i, v: values.get(k) })).filter(p => p.v != null);
      const wrap = h('div', { class: 'chart' });
      if (!pts.length) { wrap.append(h('div', { class: 'empty small' }, 'Keine Einträge')); return wrap; }
      let vmin = Math.min(...pts.map(p => p.v)), vmax = Math.max(...pts.map(p => p.v));
      if (goal != null) { vmin = Math.min(vmin, goal); vmax = Math.max(vmax, goal); }
      if (zero) vmin = 0;
      else { const pv = Math.max(0.5, (vmax - vmin) * 0.1); vmin -= pv; vmax += pv; }
      if (vmax <= vmin) vmax = vmin + 1;
      const { lo, hi, ticks } = niceTicks(vmin, vmax);
      const n = keys.length, slot = pw / n;
      const x = i => L + slot * (i + 0.5);
      const y = v => T + ph - ((v - lo) / (hi - lo || 1)) * ph;
      const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': `${title}: ${pts.length} Werte, siehe Tabelle „Einträge“` });
      ticks.forEach(t => {
        svg.append(s('line', { class: 'grid', x1: L, x2: W - R, y1: y(t), y2: y(t) }));
        svg.append(s('text', { class: 'axis-t', x: L - 6, y: y(t) + 4, 'text-anchor': 'end' }, fmt(t)));
      });
      [...new Set([0, Math.floor((n - 1) / 2), n - 1])].forEach((i, j, arr) => {
        const anchor = arr.length === 1 ? 'middle' : j === 0 ? 'start' : j === arr.length - 1 ? 'end' : 'middle';
        const xx = anchor === 'start' ? L : anchor === 'end' ? W - R : x(i);
        svg.append(s('text', { class: 'axis-t', x: xx, y: H - 6, 'text-anchor': anchor }, fmtShort(keys[i])));
      });
      if (type === 'bar') {
        const bw = Math.max(1, Math.min(28, slot - 2));
        const base = y(Math.max(lo, 0));
        pts.forEach(p => {
          const x0 = x(p.i) - bw / 2, y0 = Math.min(y(p.v), base - 1);
          const r = Math.min(4, bw / 2, base - y0);
          svg.append(s('path', { class: 'bar', d: `M${x0} ${base}V${y0 + r}Q${x0} ${y0} ${x0 + r} ${y0}H${x0 + bw - r}Q${x0 + bw} ${y0} ${x0 + bw} ${y0 + r}V${base}Z` }));
        });
      } else {
        svg.append(s('path', { class: 'line', d: pts.map((p, j) => `${j ? 'L' : 'M'}${x(p.i).toFixed(1)} ${y(p.v).toFixed(1)}`).join('') }));
        if (pts.length <= 45) pts.forEach(p => svg.append(s('circle', { class: 'dot', cx: x(p.i), cy: y(p.v), r: 4 })));
      }
      if (goal != null) {
        svg.append(s('line', { class: 'goal', x1: L, x2: W - R, y1: y(goal), y2: y(goal) }));
        svg.append(s('text', { class: 'axis-t goal-t', x: L + 4, y: y(goal) - 5, 'text-anchor': 'start' }, `Ziel ${fmt(goal)}`));
      }
      // Hover / Antippen: Hilfslinie + Wert
      const guide = s('line', { class: 'guide', y1: T, y2: T + ph, visibility: 'hidden' });
      const hl = s('circle', { class: 'hl', r: 5, visibility: 'hidden' });
      const hit = s('rect', { x: L, y: T, width: pw, height: ph, fill: 'transparent' });
      svg.append(guide, hl, hit);
      const tip = h('div', { class: 'tip', hidden: true });
      const show = e => {
        const rect = svg.getBoundingClientRect();
        const sx = (e.clientX - rect.left) / rect.width * W;
        const i = Math.max(0, Math.min(n - 1, Math.floor((sx - L) / slot)));
        let best = pts[0];
        for (const p of pts) if (Math.abs(p.i - i) < Math.abs(best.i - i)) best = p;
        const gx = x(best.i);
        guide.setAttribute('x1', gx); guide.setAttribute('x2', gx); guide.setAttribute('visibility', 'visible');
        if (type === 'line') { hl.setAttribute('cx', gx); hl.setAttribute('cy', y(best.v)); hl.setAttribute('visibility', 'visible'); }
        tip.textContent = `${fmtLong(best.k)}: ${fmt(best.v)} ${unit}`;
        tip.style.left = Math.max(14, Math.min(86, gx / W * 100)) + '%';
        tip.hidden = false;
      };
      const hide = () => { guide.setAttribute('visibility', 'hidden'); hl.setAttribute('visibility', 'hidden'); tip.hidden = true; };
      hit.addEventListener('pointermove', show);
      hit.addEventListener('pointerdown', show);
      hit.addEventListener('pointerleave', hide);
      wrap.append(tip, svg);
      return wrap;
    }

    /** Einstellungen des Moduls: Ziele */
    async function openSettings(ctx) {
      const { h, dialog, toast } = ctx.ui;
      const kg = await ctx.settings.get('weightGoal', null), kc = await ctx.settings.get('kcalGoal', null);
      const ng = await ctx.settings.get('nutGoals', {});
      const kcIn = h('input', { type: 'text', inputmode: 'numeric', value: kc != null ? String(kc) : '', placeholder: 'z. B. 2000', autocomplete: 'off' });
      const kgIn = h('input', { type: 'text', inputmode: 'decimal', value: kg != null ? fmtKg(kg) : '', placeholder: 'z. B. 75,0', autocomplete: 'off' });
      const nIn = Object.fromEntries(NUTS.map(n => [n.k, h('input', { type: 'text', inputmode: 'decimal', value: fmtGIn(ng[n.k] ?? null), placeholder: '–', autocomplete: 'off' })]));
      const msg = h('div', { class: 'small', style: { color: 'var(--danger)', minHeight: '1.2em' } });
      const ok = await dialog(close => h('form', { onsubmit: e => {
        e.preventDefault();
        const a = parseNum(kcIn.value, true), b = parseNum(kgIn.value);
        if (Number.isNaN(a) || (a != null && (a < 500 || a > 10000))) { msg.textContent = 'kcal-Ziel bitte zwischen 500 und 10.000.'; return; }
        if (Number.isNaN(b) || (b != null && (b < 20 || b > 400))) { msg.textContent = 'Zielgewicht bitte zwischen 20 und 400 kg.'; return; }
        for (const n of NUTS) { const v = parseNum(nIn[n.k].value); if (Number.isNaN(v) || (v != null && (v < 0 || v > 2000))) { msg.textContent = `${n.label}: bitte Gramm zwischen 0 und 2.000.`; return; } }
        close(true);
      } },
        h('h3', { class: 'row', style: { gap: '8px' } }, ctx.ui.icon('settings'), 'Ziele pro Tag'),
        h('div', { class: 'stack' },
          h('label', { class: 'field' }, h('span', {}, 'kcal pro Tag (leer = kein Ziel)'), kcIn),
          h('label', { class: 'field' }, h('span', {}, 'Zielgewicht in kg (leer = kein Ziel)'), kgIn),
          h('div', { class: 'nut-grid' }, NUTS.map(n => h('label', { class: 'field' }, h('span', {}, `${n.label} (g)`), nIn[n.k]))),
          h('p', { class: 'small muted', style: { margin: 0 } }, 'Die Ziele erscheinen als gestrichelte Linie in den Diagrammen.'),
          msg),
        h('div', { class: 'dlg-actions' },
          h('button', { type: 'button', class: 'btn', onclick: () => close(false) }, 'Abbrechen'),
          h('button', { type: 'submit', class: 'btn btn-primary' }, 'Speichern'))), { label: 'Ziele' });
      if (!ok) return;
      const a = parseNum(kcIn.value, true), b = parseNum(kgIn.value);
      await ctx.settings.set('kcalGoal', a == null ? null : Math.round(a));
      await ctx.settings.set('weightGoal', b == null ? null : r1(b));
      await ctx.settings.set('nutGoals', Object.fromEntries(NUTS.map(n => { const v = parseNum(nIn[n.k].value); return [n.k, v == null ? null : r1(v)]; })));
      toast('Gespeichert');
    }

    App.register({
      id: 'ernaehrung', name: 'Ernährung', icon: 'apple', order: 20,
      description: 'Gewicht, Kalorien und Nährstoffe pro Tag mit Verlauf', category: 'Gesundheit',
      version: '1.4.0', schemaVersion: 1, migrations: {},

      /* Datensatz (ernaehrung/tage, synchronisiert): id = Datum „JJJJ-MM-TT“ (ein Eintrag pro Tag)
         { id, createdAt, updatedAt, deletedAt, date: 'JJJJ-MM-TT',
           weightKg: Zahl|null, kcal: Zahl|null,
           proteinG, carbsG, fiberG, fatG: Zahl|null            (ab 1.6.0, optional – ältere Einträge haben sie nicht),
           log: [ { id, at, source: 'claude'|'manuell', mode: 'add'|'set', kcal, proteinG, carbsG, fiberG, fatG,
                    items: [ { name, amount, kcal, proteinG, carbsG, fiberG, fatG } ] } ]   (ab 1.6.0, optional) }
         Die Tageswerte sind maßgeblich; das Protokoll hält fest, woher sie kommen. */
      async init(ctx) { col = ctx.store.collection('tage', { sync: true }); },

      async mount(el, ctx) {
        const { h, toast } = ctx.ui;
        let day = todayKey();
        let range = await ctx.settings.get('range', '30');
        let nutSel = await ctx.settings.get('nutChart', 'proteinG');
        const editBox = h('div'), chartsBox = h('div'), histBox = h('div');
        el.append(
          h('div', { class: 'head' },
            h('h2', {}, 'Ernährung'),
            h('button', { class: 'btn btn-ghost', title: 'Ziele', 'aria-label': 'Ziele', onclick: () => openSettings(ctx), disabled: ctx.readOnly }, ctx.ui.icon('settings'))),
          editBox, chartsBox, histBox);

        /** Tageswerte speichern (patch wird mit dem bestehenden Eintrag zusammengeführt). Leerer Tag ohne Protokoll → löschen. */
        const saveDay = async (patch, msg) => {
          const cur = await col.get(day);
          const next = { date: day, weightKg: null, kcal: null, ...Object.fromEntries(NUTS.map(n => [n.k, null])), log: [], ...(cur || {}), ...patch };
          const empty = next.weightKg == null && VALS.every(v => next[v] == null) && !(next.log || []).length;
          try {
            if (empty) { if (cur) { await col.remove(day); toast(`Eintrag für ${fmtLong(day)} gelöscht`); } return; }
            const { id: _i, createdAt: _c, updatedAt: _u, deletedAt: _d, ...data } = next;
            if (cur) await col.update(day, data); else await col.add({ id: day, ...data });
            toast(msg || `Gespeichert: ${fmtLong(day)}`);
          } catch (err) { toast('Fehler: ' + err.message, { type: 'error' }); }
        };
        /** Werte eines Protokolleintrags zum Tag addieren (sign = 1) oder abziehen (sign = -1) */
        const combine = (cur, entry, sign) => {
          const out = {};
          for (const v of VALS) {
            if (entry[v] == null) { out[v] = cur ? cur[v] ?? null : null; continue; }
            const base = cur && cur[v] != null ? cur[v] : 0;
            const val = Math.max(0, base + sign * entry[v]);
            out[v] = v === 'kcal' ? Math.round(val) : r1(val);
          }
          return out;
        };

        /* Eintrag für einen Tag */
        const renderEdit = async () => {
          const rec = await col.get(day);
          const today = todayKey();
          const wIn = h('input', { type: 'text', inputmode: 'decimal', autocomplete: 'off', enterkeyhint: 'done', placeholder: '–', 'aria-label': 'Gewicht in kg', value: rec && rec.weightKg != null ? fmtKg(rec.weightKg) : '' });
          const kIn = h('input', { type: 'text', inputmode: 'numeric', autocomplete: 'off', enterkeyhint: 'done', placeholder: '–', 'aria-label': 'Kilokalorien', value: rec && rec.kcal != null ? String(Math.round(rec.kcal)) : '' });
          const nIn = Object.fromEntries(NUTS.map(n => [n.k, h('input', { type: 'text', inputmode: 'decimal', autocomplete: 'off', enterkeyhint: 'done', placeholder: '–', 'aria-label': `${n.label} in Gramm`, value: fmtGIn(rec ? rec[n.k] ?? null : null) })]));
          const addIn = h('input', { type: 'text', inputmode: 'numeric', autocomplete: 'off', placeholder: '+ kcal', 'aria-label': 'kcal zum Tageswert dazurechnen' });
          const maxDay = addDays(today, MAX_AHEAD);
          const dateIn = h('input', { type: 'date', value: day, max: maxDay, 'aria-label': 'Tag wählen', onchange: () => { if (isKey(dateIn.value) && dateIn.value <= maxDay) { day = dateIn.value; renderEdit(); } } });

          const save = async () => {
            const w = parseNum(wIn.value), k = parseNum(kIn.value, true);
            if (Number.isNaN(w) || (w != null && (w < 20 || w > 400))) { toast('Gewicht bitte in kg zwischen 20 und 400 eingeben', { type: 'error' }); wIn.focus(); return; }
            if (Number.isNaN(k) || (k != null && (k < 0 || k > 20000))) { toast('kcal bitte zwischen 0 und 20.000 eingeben', { type: 'error' }); kIn.focus(); return; }
            const patch = { weightKg: w == null ? null : r1(w), kcal: k == null ? null : Math.round(k) };
            for (const n of NUTS) {
              const v = parseNum(nIn[n.k].value);
              if (Number.isNaN(v) || (v != null && (v < 0 || v > 2000))) { toast(`${n.label}: bitte Gramm zwischen 0 und 2.000 eingeben`, { type: 'error' }); nIn[n.k].focus(); return; }
              patch[n.k] = v == null ? null : r1(v);
            }
            await saveDay(patch);
          };
          const add = async () => {
            const a = parseNum(addIn.value, true);
            if (a == null || Number.isNaN(a) || a <= 0 || a > 10000) { addIn.focus(); return; }
            const cur = await col.get(day);
            const entry = { id: ctx.util.uuid(), at: Date.now(), source: 'manuell', mode: 'add', kcal: Math.round(a), ...Object.fromEntries(NUTS.map(n => [n.k, null])), items: [] };
            await saveDay({ ...combine(cur, entry, 1), log: [...((cur && cur.log) || []), entry] }, `${fmtKcal(a)} kcal dazugerechnet`);
            renderEdit();
          };
          addIn.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); add(); } });

          editBox.replaceChildren(h('form', { class: 'card', onsubmit: e => { e.preventDefault(); save(); } },
            h('div', { class: 'daynav' },
              h('button', { type: 'button', class: 'btn btn-ghost', 'aria-label': 'Vorheriger Tag', onclick: () => { day = addDays(day, -1); renderEdit(); } }, ctx.ui.icon('chevron-left')),
              h('label', { class: 'day-label' }, h('span', {}, fmtLong(day)), day > today ? h('span', { class: 'pill blue' }, 'geplant') : null, ctx.ui.icon('calendar', 'muted'), dateIn),
              h('button', { type: 'button', class: 'btn btn-ghost', 'aria-label': 'Nächster Tag', disabled: day >= maxDay, onclick: () => { day = addDays(day, 1); renderEdit(); } }, ctx.ui.icon('chevron'))),
            h('div', { class: 'fields' },
              h('label', { class: 'field' }, h('span', {}, 'Gewicht'), h('div', { class: 'unit-in' }, wIn, h('span', {}, 'kg'))),
              h('label', { class: 'field' }, h('span', {}, 'Kalorien'), h('div', { class: 'unit-in' }, kIn, h('span', {}, 'kcal')))),
            h('div', { class: 'fields nut-fields' }, NUTS.map(n => h('label', { class: 'field' }, h('span', {}, n.label), h('div', { class: 'unit-in small-in' }, nIn[n.k], h('span', {}, 'g'))))),
            h('div', { class: 'add-row' }, addIn, h('button', { type: 'button', class: 'btn', title: 'Dazurechnen', 'aria-label': 'kcal dazurechnen', onclick: add, disabled: ctx.readOnly }, ctx.ui.icon('plus'))),
            h('button', { type: 'submit', class: 'btn btn-primary btn-block', style: { marginTop: '10px' }, disabled: ctx.readOnly }, ctx.ui.icon('save'), 'Speichern'),
),
            ...[logCard(rec), await claudeCard(rec)].filter(Boolean));
        };

        /* Protokoll des Tages: jede Übernahme aus Claude und jedes „Dazu“ mit Uhrzeit und Positionen */
        const logCard = rec => {
          const log = (rec && rec.log) || [];
          if (!log.length) return null;
          const sumLog = log.reduce((a, e) => a + (e.kcal || 0), 0);
          const removeEntry = async entry => {
            if (!await ctx.ui.confirm(`Eintrag von ${fmtTime(entry.at)} Uhr (${fmtKcal(entry.kcal)} kcal) löschen? Seine Werte werden vom Tag abgezogen.`, { ok: 'Löschen', danger: true })) return;
            const cur = await col.get(day);
            if (!cur) return;
            await saveDay({ ...combine(cur, entry, -1), log: (cur.log || []).filter(e => e.id !== entry.id) }, 'Protokolleintrag gelöscht');
            renderEdit();
          };
          return h('div', { class: 'card log-card' },
            h('h3', {}, `Protokoll (${log.length})`),
            log.slice().sort((a, b) => a.at - b.at).map(e => h('details', { class: 'log-entry' },
              h('summary', {},
                h('span', { class: 'lt' }, fmtTime(e.at)),
                h('span', { class: 'grow' }, h('strong', {}, `${e.mode === 'set' ? '= ' : '+ '}${fmtKcal(e.kcal)} kcal`), h('span', { class: 'small muted' }, ` · ${e.source === 'claude' ? `Claude, ${(e.items || []).length} Pos.` : 'manuell'}`),
                  nutLine(e) ? h('div', { class: 'small muted' }, nutLine(e)) : null)),
              (e.items || []).length ? h('table', { class: 'simple hist' }, h('tbody', {}, e.items.map(i => h('tr', {},
                h('td', {}, i.name, i.amount ? h('span', { class: 'muted' }, ` · ${i.amount}`) : null, nutLine(i) ? h('div', { class: 'small muted' }, nutLine(i)) : null),
                h('td', { class: 'num' }, `${fmtKcal(i.kcal)} kcal`))))) : null,
              h('div', { class: 'row', style: { marginTop: '6px' } }, h('button', { type: 'button', class: 'btn btn-sm btn-ghost', style: { color: 'var(--danger)' }, disabled: ctx.readOnly, onclick: () => removeEntry(e) }, ctx.ui.icon('trash'), 'Löschen')))),
            rec.kcal != null && Math.abs(sumLog - rec.kcal) > 1 && !log.some(e => e.mode === 'set')
              ? h('p', { class: 'small muted', style: { margin: '8px 0 0' } }, `Tageswert von Hand geändert (${fmtKcal(rec.kcal)} kcal)`) : null);
        };

        /* kcal + Nährwerte mit Claude schätzen: Lebensmittel → Claude → Antwort einfügen → übernehmen */
        const claudeCard = async rec => {
          const draft = await ctx.store.get('entwurf', {});
          const foodsIn = h('textarea', { rows: 1, class: 'autogrow', 'aria-label': 'Lebensmittel', placeholder: 'z. B. 2 Brötchen mit Käse, 1 Apfel' });
          foodsIn.value = draft.foods || '';
          const grow = ta => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight + 2, 240) + 'px'; };
          [foodsIn].forEach(ta => { ta.addEventListener('input', () => grow(ta)); requestAnimationFrame(() => grow(ta)); });
          const link = h('a', { class: 'btn btn-primary btn-block claude-btn', target: '_blank', rel: 'noopener noreferrer' }, ctx.ui.icon('external'), 'Claude fragen');
          const saveDraft = ctx.util.debounce(() => { if (!ctx.readOnly) ctx.store.set('entwurf', { foods: foodsIn.value }).catch(() => {}); }, 600);
          const updLink = () => { link.href = claudeUrl(foodsIn.value); };
          foodsIn.addEventListener('input', () => { updLink(); saveDraft(); });
          updLink();

          const ansIn = h('textarea', { rows: 1, class: 'autogrow', 'aria-label': 'Antwort von Claude', placeholder: 'Antwort (Codeblock) einfügen' });
          const preview = h('div', { class: 'parse-box', hidden: true });
          const apply = async (mode, r) => {
            const cur = await col.get(day);
            const entry = { id: ctx.util.uuid(), at: Date.now(), source: 'claude', mode, ...r.sum, items: r.items };
            const vals = mode === 'add' ? combine(cur, entry, 1) : Object.fromEntries(VALS.map(v => [v, r.sum[v]]));
            if (vals.kcal > 20000) { toast('Das wären über 20.000 kcal – bitte prüfen', { type: 'error' }); return; }
            const log = mode === 'add' ? [...((cur && cur.log) || []), entry] : [entry];
            await saveDay({ ...vals, log }, `${fmtLong(day)}: ${fmtKcal(vals.kcal)} kcal gespeichert`);
            await ctx.store.set('entwurf', {});
            renderEdit();
          };
          const showParse = () => {
            const txt = ansIn.value;
            if (!txt.trim()) { preview.hidden = true; return; }
            const r = parseAnswer(txt);
            preview.hidden = false;
            if (!r.ok) {
              preview.replaceChildren(h('div', { class: 'parse-err' }, ctx.ui.icon('alert'), ' Keine kcal – ganzen Codeblock kopieren („KCAL v2“).'));
              return;
            }
            const hasDay = rec && rec.kcal != null;
            const after = hasDay ? combine(rec, r.sum, 1) : null;
            preview.replaceChildren(...[
              r.items.length ? h('table', { class: 'simple hist' }, h('tbody', {},
                r.items.map(i => h('tr', {}, h('td', {}, i.name, i.amount ? h('span', { class: 'muted' }, ` · ${i.amount}`) : null, nutLine(i) ? h('div', { class: 'small muted' }, nutLine(i)) : null), h('td', { class: 'num' }, fmtKcal(i.kcal)))),
                h('tr', { class: 'sum' }, h('td', {}, 'Summe', nutLine(r.sum) ? h('div', { class: 'small' }, nutLine(r.sum)) : null), h('td', { class: 'num' }, `${fmtKcal(r.sum.kcal)} kcal`)))) : h('div', { class: 'sum' }, `Summe: ${fmtKcal(r.sum.kcal)} kcal`, nutLine(r.sum) ? h('div', { class: 'small' }, nutLine(r.sum)) : null),
              !r.hasNuts ? h('p', { class: 'small muted' }, 'Nur kcal') : null,
              r.mismatch ? h('p', { class: 'small muted' }, 'SUMME nachgerechnet') : null,
              h('div', { class: 'row', style: { marginTop: '10px' } },
                hasDay ? h('button', { type: 'button', class: 'btn btn-primary grow', disabled: ctx.readOnly, onclick: () => apply('add', r) }, ctx.ui.icon('plus'), `→ ${fmtKcal(after.kcal)} kcal`) : null,
                h('button', { type: 'button', class: 'btn grow' + (hasDay ? '' : ' btn-primary'), disabled: ctx.readOnly, onclick: () => apply('set', r) }, ctx.ui.icon('check'), hasDay ? 'Ersetzen' : `${fmtKcal(r.sum.kcal)} kcal`)),
            ].filter(Boolean));
          };
          ansIn.addEventListener('input', showParse);
          ansIn.addEventListener('input', () => grow(ansIn));
          const pasteBtn = navigator.clipboard && navigator.clipboard.readText ? h('button', { type: 'button', class: 'btn btn-sm', onclick: async () => {
            try { const t = await navigator.clipboard.readText(); if (t) { ansIn.value = t; grow(ansIn); showParse(); } else toast('Zwischenablage ist leer'); }
            catch (_) { toast('Kein Zugriff auf die Zwischenablage – bitte ins Feld einfügen'); ansIn.focus(); }
          } }, ctx.ui.icon('paste'), 'Einfügen') : null;

          return h('div', { class: 'card claude-card' },
            h('h3', { class: 'row', style: { gap: '8px' } }, ctx.ui.icon('external'), 'Mit Claude schätzen'),
            h('div', { class: 'step' }, h('span', { class: 'n' }, '1'), 'Lebensmittel'),
            foodsIn, link,
            h('div', { class: 'step' }, h('span', { class: 'n' }, '2'), 'Antwort'),
            ansIn, pasteBtn ? h('div', { class: 'row', style: { marginTop: '8px' } }, pasteBtn) : null, preview);
        };

        /* Verlauf: Kennzahlen, Diagramme, Tabelle */
        const renderCharts = async () => {
          const all = (await col.all()).filter(r => isKey(r.id)).sort((a, b) => (a.id < b.id ? -1 : 1));
          const kcalGoal = await ctx.settings.get('kcalGoal', null), weightGoal = await ctx.settings.get('weightGoal', null);
          const nutGoals = await ctx.settings.get('nutGoals', {});
          const end = todayKey();
          const R = RANGES.find(r => r.id === range) || RANGES[1];
          const start = R.days ? addDays(end, -(R.days - 1)) : (all.length && all[0].id < end ? all[0].id : end);
          const keys = [];
          for (let k = start; k <= end; k = addDays(k, 1)) keys.push(k);
          const inRange = all.filter(r => r.id >= start && r.id <= end);
          const mapOf = f => new Map(inRange.filter(r => r[f] != null).map(r => [r.id, r[f]]));
          const avgOf = f => { const v = inRange.filter(r => r[f] != null); return v.length ? { avg: v.reduce((a, r) => a + r[f], 0) / v.length, n: v.length } : null; };

          const lastW = [...all].reverse().find(r => r.weightKg != null && r.id <= end);
          const wIn = inRange.filter(r => r.weightKg != null);
          const delta = wIn.length >= 2 ? wIn[wIn.length - 1].weightKg - wIn[0].weightKg : null;
          const avgK = avgOf('kcal');
          const cw = Math.max(280, (chartsBox.clientWidth || el.clientWidth || 360) - 34);
          const stat = (v, l, cls = '') => h('div', { class: 'stat ' + cls }, h('div', { class: 'v' }, v), h('div', { class: 'l' }, l));
          const nut = NUTS.find(n => n.k === nutSel) || NUTS[0];

          chartsBox.replaceChildren(h('div', { class: 'card' },
            h('div', { class: 'chips scroll', role: 'radiogroup', 'aria-label': 'Zeitraum' }, RANGES.map(r => h('button', { type: 'button', class: 'chip', role: 'radio', 'aria-checked': String(r.id === range), onclick: async () => { range = r.id; renderCharts(); await ctx.settings.set('range', range); } }, r.label))),
            h('div', { class: 'stats' },
              stat(lastW ? `${fmtKg(lastW.weightKg)} kg` : '–', lastW ? `Gewicht · ${fmtLong(lastW.id)}` : 'Gewicht'),
              stat(delta == null ? '–' : `${delta > 0 ? '+' : delta < 0 ? '−' : '±'}${fmtKg(Math.abs(delta))} kg`, 'Δ Zeitraum'),
              stat(avgK ? `${fmtKcal(avgK.avg)} kcal` : '–', `Ø/Tag (${avgK ? avgK.n : 0} T.)${kcalGoal ? ` · Ziel ${fmtKcal(kcalGoal)}` : ''}`)),
            h('div', { class: 'stats nut-stats' }, NUTS.map(n => { const a = avgOf(n.k); return stat(a ? `${fmtG(a.avg)} g` : '–', `Ø ${n.label}${nutGoals[n.k] != null ? ` · Ziel ${fmtG(nutGoals[n.k])}` : ''}`, 'mini'); })),
            h('div', { class: 'chart-title' }, h('span', {}, 'Gewicht'), h('span', { class: 'small muted' }, 'kg')),
            chart(ctx, { title: 'Gewicht', keys, values: mapOf('weightKg'), type: 'line', goal: weightGoal, fmt: v => fmtKg(v), unit: 'kg', zero: false, width: cw }),
            h('div', { class: 'chart-title' }, h('span', {}, 'Kalorien'), h('span', { class: 'small muted' }, 'kcal pro Tag')),
            chart(ctx, { title: 'Kalorien', keys, values: mapOf('kcal'), type: 'bar', goal: kcalGoal, fmt: v => fmtKcal(v), unit: 'kcal', zero: true, width: cw }),
            h('div', { class: 'chart-title' }, h('span', {}, 'Nährstoffe'), h('span', { class: 'small muted' }, 'g pro Tag')),
            h('div', { class: 'chips scroll', role: 'radiogroup', 'aria-label': 'Nährstoff', style: { marginTop: '6px' } }, NUTS.map(n => h('button', { type: 'button', class: 'chip', role: 'radio', 'aria-checked': String(n.k === nut.k), onclick: async () => { nutSel = n.k; renderCharts(); await ctx.settings.set('nutChart', nutSel); } }, n.label))),
            chart(ctx, { title: nut.label, keys, values: mapOf(nut.k), type: 'bar', goal: nutGoals[nut.k] ?? null, fmt: v => fmtG(v), unit: 'g', zero: true, width: cw })));

          const planned = all.filter(r => r.id > end);
          const rows = [...inRange, ...planned].reverse().slice(0, 120);
          histBox.replaceChildren(...(rows.length ? [h('details', { class: 'fold' },
            h('summary', {}, `Einträge (${inRange.length})${planned.length ? ` + ${planned.length} geplant` : ''}`),
            h('div', { class: 'card' }, h('div', { class: 'table-scroll' }, h('table', { class: 'simple hist' },
              h('thead', {}, h('tr', {}, h('th', {}, 'Tag'), h('th', { class: 'num' }, 'kg'), h('th', { class: 'num' }, 'kcal'), NUTS.map(n => h('th', { class: 'num', title: n.label }, n.short)))),
              h('tbody', {}, rows.map(r => h('tr', { title: 'Bearbeiten', onclick: () => { day = r.id; renderEdit(); window.scrollTo({ top: 0, behavior: 'smooth' }); } },
                h('td', {}, fmtLong(r.id), r.id > end ? h('span', { class: 'pill blue', style: { marginLeft: '6px' } }, 'geplant') : null),
                h('td', { class: 'num' }, r.weightKg != null ? fmtKg(r.weightKg) : '–'),
                h('td', { class: 'num' }, r.kcal != null ? fmtKcal(r.kcal) : '–'),
                NUTS.map(n => h('td', { class: 'num' }, fmtG(r[n.k] ?? null)))))))),
              h('p', { class: 'small muted' }, `Nährstoffe in Gramm: ${NUTS.map(n => `${n.short} = ${n.label}`).join(', ')}.`),
              inRange.length > rows.length ? h('p', { class: 'small muted' }, `Die ${rows.length} neuesten von ${inRange.length} Einträgen.`) : null))] : []));
        };

        const re = ctx.util.debounce(renderCharts, 150);
        ctx.events.on('store:changed', e => {
          if (e.moduleId !== 'ernaehrung') return;
          re();
          // Änderung von einem anderen Gerät/Tab – nicht neu zeichnen, während hier getippt wird
          if (e.remote && !editBox.contains(document.activeElement)) renderEdit();
        });
        ctx.events.on('app:visible', () => re());
        await renderEdit();
        await renderCharts();
      },
    });
  })();
  /* ==== ENDE MODUL: ernaehrung ==== */
  </script>

  <script>
  /* ==== MODUL: wecker ==== */
  (() => {
    /* Eine Web-App darf auf dem iPhone keine System-Wecker stellen. Das Modul übergibt die Uhrzeiten daher
       per URL an zwei Kurzbefehle (App „Kurzbefehle“), die der Nutzer einmalig anlegt:
         „PA Wecker stellen“  – Eingabe: Text, eine Uhrzeit „HH:MM“ pro Zeile → je Zeile „Wecker erstellen“
         „PA Wecker löschen“  – keine Eingabe → „Alle Wecker abrufen“ → „Wecker löschen“
       Namen und Eingabeformat nie ändern, sonst passen bestehende Kurzbefehle nicht mehr. */
    const SC_SET = 'PA Wecker stellen';
    const SC_DEL = 'PA Wecker löschen';
    const MAX = 30;
    const DEF = { start: '06:00', count: 10, gapMin: 3 };
    const PRESETS = ['05:30', '06:00', '06:30', '07:00', '07:30', '08:00'];
    const pad = n => String(n).padStart(2, '0');
    const fmt = m => `${pad(Math.floor(m / 60) % 24)}:${pad(m % 60)}`;
    const toMin = s => { const m = /^(\d{1,2}):(\d{2})/.exec(String(s || '')); return m && +m[1] < 24 && +m[2] < 60 ? +m[1] * 60 + +m[2] : null; };
    const times = (start, count, gap) => { const s = toMin(start); return s == null ? [] : Array.from({ length: count }, (_, i) => fmt((s + i * gap) % 1440)); };
    const clamp = (v, lo, hi, d) => { const n = Math.round(Number(v)); return Number.isFinite(n) && String(v).trim() !== '' ? Math.min(hi, Math.max(lo, n)) : d; };
    const runUrl = (name, text) => 'shortcuts://run-shortcut?name=' + encodeURIComponent(name) + (text != null ? '&input=text&text=' + encodeURIComponent(text) : '');
    /** Zeile für den Kurzbefehl: „TT.MM.JJJJ HH:MM“ – Datum des tatsächlichen Klingelns, damit iOS den Text sicher als Datum erkennt */
    const stamp = d => `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    const lines = (start, count, gap) => { const s = toMin(start); if (s == null) return []; const f = firstRing(s); return Array.from({ length: count }, (_, i) => stamp(new Date(f.getTime() + i * gap * 60000))); };
    /** Wecker ohne Wiederholung klingeln beim nächsten Erreichen der Uhrzeit */
    const firstRing = (startMin, now = new Date()) => { const d = new Date(now); d.setHours(Math.floor(startMin / 60), startMin % 60, 0, 0); if (d <= now) d.setDate(d.getDate() + 1); return d; };

    App.register({
      id: 'wecker', name: 'Wecker', icon: 'alarm', order: 30,
      description: 'Viele Wecker auf einmal stellen und alle Wecker löschen (über iOS-Kurzbefehle)', category: 'Alltag',
      version: '1.2.0', schemaVersion: 1, migrations: {},
      /* Daten (lokal, nicht synchronisiert): Einstellung „cfg“ { start: 'HH:MM', count, gapMin },
         Wert „letzte“ { at, kind: 'set'|'test'|'delete', times: ['HH:MM', …] } */

      async mount(el, ctx) {
        const { h, toast } = ctx.ui; const U = ctx.util;
        let cfg = { ...DEF, ...(await ctx.settings.get('cfg', {})) };
        const startIn = h('input', { type: 'time', value: cfg.start, 'aria-label': 'Erster Wecker' });
        const countIn = h('input', { type: 'number', inputmode: 'numeric', min: 1, max: MAX, step: 1, value: cfg.count, 'aria-label': 'Anzahl Wecker', onfocus: e => e.target.select() });
        const gapIn = h('input', { type: 'number', inputmode: 'numeric', min: 1, max: 60, step: 1, value: cfg.gapMin, 'aria-label': 'Abstand in Minuten', onfocus: e => e.target.select() });
        const chips = h('div', { class: 'chips scroll', role: 'radiogroup', 'aria-label': 'Schnellwahl erster Wecker' });
        const preview = h('div', { class: 'preview' });
        const setBtn = h('button', { type: 'button', class: 'btn btn-primary btn-block big', disabled: ctx.readOnly });
        const delBox = h('div');
        const lastBox = h('p', { class: 'small muted last' });
        const save = U.debounce(() => { if (!ctx.readOnly) ctx.settings.set('cfg', cfg).catch(() => {}); }, 500);
        const remember = (kind, list) => { if (!ctx.readOnly) ctx.store.set('letzte', { at: Date.now(), kind, times: list }).then(renderLast).catch(() => {}); };
        const open = url => { location.href = url; };   // direkt aus dem Tipp-Ereignis, sonst blockiert iOS den Wechsel zu Kurzbefehle
        /** Uhrzeiten in die Zwischenablage legen (der Kurzbefehl liest sie dort mit „Zwischenablage abrufen“), dann Kurzbefehl starten.
            Zusätzlich gehen sie als URL-Eingabe mit. Schlägt das Kopieren fehl, wird nichts gestartet – sonst würde der Kurzbefehl alte Inhalte lesen. */
        const sendTimes = async (kind, list, payload) => {
          const text = payload.join('\n');
          try { await navigator.clipboard.writeText(text); }
          catch (_) { toast('Zwischenablage nicht verfügbar – bitte erneut tippen', { type: 'error' }); return; }
          remember(kind, list);
          open(runUrl(SC_SET, text));
        };

        const update = () => {
          cfg = {
            start: toMin(startIn.value) != null ? startIn.value.slice(0, 5) : cfg.start,
            count: clamp(countIn.value, 1, MAX, cfg.count),
            gapMin: clamp(gapIn.value, 1, 60, cfg.gapMin),
          };
          const list = times(cfg.start, cfg.count, cfg.gapMin);
          const first = firstRing(toMin(cfg.start));
          const today = U.sameDay(first, new Date());
          const dayTxt = `${U.formatDate(first.getTime(), false)}, ${first.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' })}`;
          setBtn.replaceChildren(ctx.ui.icon('alarm'), `${cfg.count} Wecker stellen`);
          chips.replaceChildren(...PRESETS.map(p => h('button', { type: 'button', class: 'chip', role: 'radio', 'aria-checked': String(p === cfg.start),
            onclick: () => { startIn.value = p; update(); } }, p)));
          preview.replaceChildren(
            h('div', { class: 'when' + (today ? ' warn' : '') }, today
              ? `Heute! ${list[0]}–${list[list.length - 1]}`
              : `${dayTxt} · ${list[0]}–${list[list.length - 1]}`),
            h('div', { class: 'times' }, list.map(t => h('span', { class: 'pill' }, t))));
          save();
        };
        [startIn, countIn, gapIn].forEach(i => i.addEventListener('input', update));
        [countIn, gapIn].forEach(i => i.addEventListener('blur', () => { countIn.value = cfg.count; gapIn.value = cfg.gapMin; }));

        setBtn.onclick = () => {
          const list = times(cfg.start, cfg.count, cfg.gapMin);
          if (!list.length) { toast('Bitte eine Uhrzeit wählen', { type: 'error' }); return; }
          sendTimes('set', list, lines(cfg.start, cfg.count, cfg.gapMin));
        };

        const renderDel = (confirming = false) => {
          if (!confirming) {
            delBox.replaceChildren(h('button', { type: 'button', class: 'btn btn-block big btn-danger-outline', disabled: ctx.readOnly, onclick: () => renderDel(true) }, ctx.ui.icon('trash'), 'Alle löschen'));
            return;
          }
          delBox.replaceChildren(h('div', { class: 'confirm' },
            h('p', { style: { margin: '0 0 10px' } }, 'Auch eigene Wecker in der Uhr-App.'),
            h('div', { class: 'row nowrap' },
              h('button', { type: 'button', class: 'btn grow', onclick: () => renderDel(false) }, 'Abbrechen'),
              h('button', { type: 'button', class: 'btn btn-danger grow', onclick: () => { remember('delete', []); setTimeout(() => renderDel(false), 1500); open(runUrl(SC_DEL)); } }, 'Ja, alle löschen'))));
        };

        const renderLast = async () => {
          const l = await ctx.store.get('letzte', null);
          if (!l) { lastBox.textContent = ''; return; }
          const what = l.kind === 'delete' ? '„Alle löschen“' : l.kind === 'test' ? `Testwecker ${l.times[0]} Uhr` : `${l.times.length} Wecker (${l.times[0]}–${l.times[l.times.length - 1]} Uhr)`;
          lastBox.textContent = `Zuletzt: ${what} · ${U.formatDate(l.at)}`;
        };

        el.append(h('div', {},
          h('div', { class: 'head' }, h('h2', {}, 'Wecker')),
          U.isIOS() ? null : h('div', { class: 'ro-banner' }, 'Nur iPhone/iPad'),
          h('div', { class: 'card' },
            h('div', { class: 'fields' },
              h('label', { class: 'field' }, h('span', {}, 'Ab'), startIn),
              h('label', { class: 'field' }, h('span', {}, 'Anzahl'), countIn),
              h('label', { class: 'field' }, h('span', {}, 'Min'), gapIn)),
            chips, preview, setBtn, lastBox),
          h('div', { class: 'card' }, delBox)));

        update();
        renderDel(false);
        await renderLast();
        ctx.events.on('app:visible', () => { update(); renderLast(); });
      },
    });
  })();
  /* ==== ENDE MODUL: wecker ==== */
  </script>

  <script>
  /* ==== MODUL: ziele ==== */
  (() => {
    /* Punkte-Regeln – Punkte werden beim Speichern im Datensatz festgehalten, spätere Regeländerungen ändern die Vergangenheit nicht. */
    const DAY_POINTS = 1;          // Tag mit allen Tageszielen erledigt
    const WEEK_GOAL_POINTS = 3;    // je erledigtem Wochenziel (Extra-Punkte)
    const WEEK_ALL_BONUS = 5;      // alle Wochenziele erledigt
    const EDIT_DAYS = 7;           // so viele Tage zurück lässt sich nachtragen
    const EDIT_WEEKS = 2;          // so viele Wochen zurück lässt sich nachtragen
    const REM = { daily: 'abfrage-tag', weekly: 'abfrage-woche' };
    const REM_TITLE = { daily: 'Tägliche Ziele: Hast du heute alles geschafft?', weekly: 'Wochenziele: Wie lief deine Woche?' };
    const REM_IV = { daily: 1440, weekly: 10080 };
    const DEFAULTS = { dailyOn: true, dailyTime: 20 * 60 + 30, weeklyOn: true, weeklyTime: 20 * 60 };
    const KIND_LABEL = { daily: 'Tagesziel', weekly: 'Wochenziel' };

    let goals, checkins, ledger;
    let mounted = false, bgCtx = null, bgSubsLive = false;

    /* ---------- Datum ---------- */
    const pad = n => String(n).padStart(2, '0');
    const dayStart = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
    const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
    const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const weekStart = d => { const x = dayStart(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }; // Montag
    function isoWeek(d) {
      const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
      t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
      const y0 = Date.UTC(t.getUTCFullYear(), 0, 1);
      return { year: t.getUTCFullYear(), week: Math.ceil(((t - y0) / 86400000 + 1) / 7) };
    }
    const atTime = (d, min) => { const x = new Date(d); x.setHours(Math.floor(min / 60), min % 60, 0, 0); return x.getTime(); };
    const dm = d => `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.`;
    /** Zeitraum (Tag oder ISO-Woche Mo–So) */
    function period(kind, date) {
      if (kind === 'daily') { const s = dayStart(date); return { kind, key: dayKey(s), start: s.getTime(), end: addDays(s, 1).getTime(), date: s }; }
      const s = weekStart(date), w = isoWeek(s);
      return { kind, key: `${w.year}-W${pad(w.week)}`, week: w.week, start: s.getTime(), end: addDays(s, 7).getTime(), date: s };
    }
    const prevPeriod = p => period(p.kind, addDays(p.date, p.kind === 'daily' ? -1 : -7));
    const recId = (kind, key) => (kind === 'daily' ? 'd-' : 'w-') + key;
    const periodLabel = p => {
      if (p.kind === 'weekly') return `KW ${p.week} · ${dm(p.date)}–${dm(addDays(p.date, 6))}`;
      const today = dayStart(new Date());
      if (p.start === today.getTime()) return 'Heute';
      if (p.start === addDays(today, -1).getTime()) return 'Gestern';
      return p.date.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' });
    };

    async function cfg(ctx) { const o = {}; for (const [k, v] of Object.entries(DEFAULTS)) o[k] = await ctx.settings.get(k, v); return o; }

    /* ---------- Auswertung ---------- */
    function pointsFor(kind, items) {
      if (!items.length) return 0;
      const n = items.filter(i => i.done).length;
      if (kind === 'daily') return n === items.length ? DAY_POINTS : 0;
      return n * WEEK_GOAL_POINTS + (n === items.length ? WEEK_ALL_BONUS : 0);
    }
    const byOrder = (a, b) => (a.order ?? a.createdAt ?? 0) - (b.order ?? b.createdAt ?? 0);

    /** Ziele eines Zeitraums mit Erledigt-Status. Laufender Zeitraum: aktuelle Ziele; vergangener: gespeicherter Stand oder die Ziele, die es damals gab. */
    async function view(kind, p, rawGoals) {
      const now = Date.now();
      const rec = await checkins.get(recId(kind, p.key));
      const current = now >= p.start && now < p.end;
      let list;
      if (!current && rec && Array.isArray(rec.goals)) list = rec.goals;
      else {
        const raw = rawGoals || await goals.raw();
        list = raw.filter(g => g.type === kind && (current ? !g.deletedAt : ((g.createdAt || 0) < p.end && (!g.deletedAt || g.deletedAt >= p.end)))).sort(byOrder);
      }
      const done = (rec && rec.done) || {};
      const items = list.map(g => ({ id: g.id, title: g.title, done: !!done[g.id] }));
      const nDone = items.filter(i => i.done).length;
      return { kind, p, rec, items, nDone, complete: items.length > 0 && nDone === items.length, points: pointsFor(kind, items), current };
    }

    async function save(kind, p, items, extra = {}) {
      const id = recId(kind, p.key);
      const data = {
        kind, key: p.key, start: p.start,
        goals: items.map(i => ({ id: i.id, title: i.title })),
        done: Object.fromEntries(items.filter(i => i.done).map(i => [i.id, true])),
        complete: items.length > 0 && items.every(i => i.done),
        points: pointsFor(kind, items),
        answeredAt: Date.now(), ...extra,
      };
      return (await checkins.get(id)) ? checkins.update(id, data) : checkins.add({ ...data, id });
    }

    /** Nach Änderungen an den Zielen: gespeicherten Stand von heute und dieser Woche nachziehen */
    async function refreshCurrent() {
      const raw = await goals.raw();
      for (const kind of ['daily', 'weekly']) {
        const v = await view(kind, period(kind, new Date()), raw);
        if (!v.rec) continue;
        const sig = a => JSON.stringify((a || []).map(g => g.id + '|' + g.title));
        if (sig(v.rec.goals) !== sig(v.items) || v.rec.points !== v.points || !!v.rec.complete !== v.complete) await save(kind, v.p, v.items, { answeredAt: v.rec.answeredAt });
      }
    }

    function streakOf(kind, cur, map) {
      let n = cur.complete ? 1 : 0, p = prevPeriod(cur.p);
      for (let i = 0; i < 10000; i++) { const r = map.get(recId(kind, p.key)); if (!r || !r.complete) break; n++; p = prevPeriod(p); }
      return n;
    }
    function bestOf(kind, recs, cur) {
      const keys = new Set(recs.filter(r => r.kind === kind && r.complete && r.key !== cur.p.key).map(r => r.key));
      if (cur.complete) keys.add(cur.p.key);
      let best = 0;
      for (const r of recs.filter(x => x.kind === kind && keys.has(x.key) && x.start)) {
        // nur am Anfang einer Serie zählen
        const p = period(kind, new Date(r.start));
        if (keys.has(prevPeriod(p).key)) continue;
        let n = 0, q = p;
        while (keys.has(q.key) && n < 10000) { n++; q = period(kind, addDays(q.date, kind === 'daily' ? 1 : 7)); }
        best = Math.max(best, n);
      }
      return Math.max(best, cur.complete ? 1 : 0);
    }

    async function stats() {
      const now = new Date();
      const raw = await goals.raw();
      const [d, w, recs, led] = await Promise.all([view('daily', period('daily', now), raw), view('weekly', period('weekly', now), raw), checkins.all(), ledger.all()]);
      const map = new Map(recs.map(r => [r.id, r]));
      const curIds = new Set([recId('daily', d.p.key), recId('weekly', w.p.key)]);
      let points = d.points + w.points;
      for (const r of recs) if (!curIds.has(r.id)) points += Number(r.points) || 0;
      points += led.reduce((a, e) => a + (Number(e.amount) || 0), 0);  // künftige Ausgaben/Gutschriften anderer Funktionen
      return { d, w, points, streakD: streakOf('daily', d, map), streakW: streakOf('weekly', w, map), bestD: bestOf('daily', recs, d), map };
    }

    /* ---------- Abfrage-Erinnerungen ---------- */
    /* Je Art eine Erinnerung im Kern-Erinnerungsdienst (Intervall 1 Tag bzw. 1 Woche), ausgerichtet auf die Abfragezeit.
       Der Server löst sie auch bei geschlossener App aus; die App richtet sie bei jedem Öffnen wieder genau aus
       (z. B. nach „1 Std später“, Zeitumstellung oder „Erledigt“ in der Mitteilung). */
    async function arm(ctx, kind) {
      const c = await cfg(ctx);
      const on = kind === 'daily' ? c.dailyOn : c.weeklyOn;
      const time = kind === 'daily' ? c.dailyTime : c.weeklyTime;
      const id = REM[kind];
      const r = await ctx.reminders.get(id);
      const has = (await goals.all()).some(g => g.type === kind);
      if (!on || !has) { if (r) await ctx.reminders.remove(id); return; }
      const now = Date.now();
      const p = period(kind, new Date(now));
      const askDay = kind === 'daily' ? p.date : addDays(p.date, 6);   // Wochenziele: Sonntag
      const cur = atTime(askDay, time);
      const next = atTime(addDays(askDay, kind === 'daily' ? 1 : 7), time);
      const v = await view(kind, p);
      const target = v.complete || now >= cur ? next : cur;           // schon alles erledigt → heute/diese Woche nicht mehr fragen
      const snoozed = !v.complete && now >= cur && r && !r.done && r.nextAt && r.nextAt > now && r.nextAt < next;
      // Nie löschen und neu anlegen: Der Server behält „zuletzt gesendet“, das Gerät hielte die Abfrage sonst
      // bei jedem Abgleich für neu ausgelöst → Endlosschleife (Tab-Leiste flackert, Hinweis „Ansehen“ kehrt zurück).
      if (!r) {
        await ctx.reminders.set(id, { intervalMin: REM_IV[kind], title: REM_TITLE[kind] });
        await ctx.reminders.snoozeUntil(id, target);
      } else if (r.done) {
        await ctx.reminders.reopen(id);
        await ctx.reminders.snoozeUntil(id, target);
      } else if (r.unseen && (r.lastSentAt || 0) < p.start) {
        await ctx.reminders.snoozeUntil(id, target);      // Abfrage aus dem vorigen Zeitraum: als erledigt abräumen
      } else if (!snoozed && (r.nextAt || 0) !== target) {   // auch kleine Verschiebungen (Takt des Servers) korrigieren, damit nichts wandert
        // moveTo lässt „ungesehen“ stehen – sonst verschwände die gerade gezeigte Abfrage sofort wieder (bzw. bliebe als Leiche stehen)
        if (ctx.reminders.moveTo) await ctx.reminders.moveTo(id, target); else await ctx.reminders.snoozeUntil(id, target);
      }
    }
    let arming = false, armAgain = false;
    async function armAll(ctx) {
      if (ctx.readOnly) return;
      if (arming) { armAgain = true; return; }
      arming = true;
      try { do { armAgain = false; await arm(ctx, 'daily'); await arm(ctx, 'weekly'); } while (armAgain); }
      catch (e) { ctx.log.warn('Abfrage planen: ' + e.message); }
      finally { arming = false; }
    }
    function subscribeBg(ctx) {
      const re = ctx.util.debounce(() => armAll(ctx), 700);
      ctx.events.on('reminders:changed', e => { if (!e || !e.moduleId || e.moduleId === 'ziele') re(); });
      ctx.events.on('store:changed', e => { if (e && e.moduleId === 'ziele') re(); });
      ctx.events.on('app:visible', re);
      // Abos, die während der Anzeige des Moduls entstehen, löst der Kern beim Verlassen – dann in unmount() neu anlegen
      bgSubsLive = !mounted;
    }

    /* ---------- Aktionen ---------- */
    async function toggle(ctx, kind, p, goalId) {
      const before = await view(kind, p);
      const items = before.items.map(i => i.id === goalId ? { ...i, done: !i.done } : i);
      await save(kind, p, items);
      const gained = pointsFor(kind, items) - before.points;
      if (gained > 0) {
        const s = await stats();
        if (kind === 'daily' && items.every(i => i.done)) ctx.ui.toast(`Alle Tagesziele geschafft · +${gained} ${gained === 1 ? 'Punkt' : 'Punkte'} · ${s.streakD} ${s.streakD === 1 ? 'Tag' : 'Tage'} in Folge`);
        else if (kind === 'weekly') ctx.ui.toast(items.every(i => i.done) ? `Alle Wochenziele geschafft · +${gained} Extra-Punkte` : `+${gained} Extra-Punkte`);
      }
    }

    function kindChips(ctx, kind, onChange) {
      const { h } = ctx.ui;
      const box = h('div', { class: 'chips', role: 'radiogroup', 'aria-label': 'Art des Ziels' });
      const draw = () => box.replaceChildren(...['daily', 'weekly'].map(k => h('button', { type: 'button', class: 'chip', role: 'radio', 'aria-checked': String(k === kind), onclick: () => { kind = k; onChange(k); draw(); } }, k === 'daily' ? 'Jeden Tag' : 'Jede Woche')));
      draw();
      return box;
    }

    async function openAdd(ctx, kind) {
      const { h, dialog, toast } = ctx.ui;
      const titleIn = h('input', { type: 'text', placeholder: kind === 'daily' ? 'z. B. 10 Minuten lesen' : 'z. B. 3× Sport', autofocus: true, enterkeyhint: 'done', autocomplete: 'off', 'aria-label': 'Ziel' });
      const ok = await dialog(close => h('form', { onsubmit: e => { e.preventDefault(); if (titleIn.value.trim()) close(true); else titleIn.focus(); } },
        h('h3', {}, 'Neues Ziel'),
        h('div', { class: 'stack' }, titleIn, kindChips(ctx, kind, k => { kind = k; })),
        h('div', { class: 'dlg-actions' },
          h('button', { type: 'button', class: 'btn', onclick: () => close(false) }, 'Abbrechen'),
          h('button', { type: 'submit', class: 'btn btn-primary' }, 'Hinzufügen'))), { label: 'Neues Ziel' });
      if (!ok) return;
      await goals.add({ title: titleIn.value.trim().slice(0, 200), type: kind, order: Date.now() });
      await refreshCurrent();
      if (ctx.notify.permission() === 'default') toast('Benachrichtigungen aus', { action: 'Erlauben', onAction: () => ctx.notify.request(), timeout: 9000 });
      else toast('Hinzugefügt');
    }

    async function openEdit(ctx, id) {
      const { h, dialog, confirm, toast } = ctx.ui;
      const g = await goals.get(id);
      if (!g) { toast('Ziel nicht gefunden'); return; }
      let kind = g.type;
      const titleIn = h('input', { type: 'text', value: g.title, autofocus: true, 'aria-label': 'Ziel' });
      const res = await dialog(close => h('form', { onsubmit: e => { e.preventDefault(); close('save'); } },
        h('h3', {}, 'Ziel bearbeiten'),
        h('div', { class: 'stack' }, titleIn, kindChips(ctx, kind, k => { kind = k; }),
          h('p', { class: 'small muted', style: { margin: 0 } }, `Seit ${ctx.util.formatDate(g.createdAt, false)}`)),
        h('div', { class: 'dlg-actions' },
          h('button', { type: 'button', class: 'btn btn-ghost', style: { marginRight: 'auto', color: 'var(--danger)' }, onclick: () => close('delete') }, 'Löschen'),
          h('button', { type: 'button', class: 'btn', onclick: () => close() }, 'Abbrechen'),
          h('button', { type: 'submit', class: 'btn btn-primary' }, 'Speichern'))), { label: 'Ziel bearbeiten' });
      if (res === 'save') {
        const title = titleIn.value.trim();
        if (!title) { toast('Ziel darf nicht leer sein'); return; }
        await goals.update(id, { title: title.slice(0, 200), type: kind });
        await refreshCurrent();
        toast('Gespeichert');
      } else if (res === 'delete') {
        if (!(await confirm(`„${g.title}“ löschen? Punkte und Verlauf bleiben erhalten.`, { ok: 'Löschen', danger: true }))) return;
        await goals.remove(id);
        await refreshCurrent();
        toast('Gelöscht', { action: 'Rückgängig', onAction: async () => { await goals.update(id, { deletedAt: null }); await refreshCurrent(); } });
      }
    }

    /** Vergangenen Tag / vergangene Woche nachtragen */
    async function openPast(ctx, kind, p) {
      const { h, dialog, toast } = ctx.ui;
      const v = await view(kind, p);
      if (!v.items.length) { toast('Für diesen Zeitraum gab es keine Ziele.'); return; }
      const boxes = v.items.map(i => ({ i, el: h('input', { type: 'checkbox', checked: i.done }) }));
      const ok = await dialog(close => h('form', { onsubmit: e => { e.preventDefault(); close(true); } },
        h('h3', {}, kind === 'daily' ? `Nachtragen: ${p.date.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' })}` : `Nachtragen: ${periodLabel(p)}`),
        h('div', {}, boxes.map(b => h('label', { class: 'switch' }, b.el, h('span', {}, b.i.title)))),
        h('div', { class: 'dlg-actions' },
          h('button', { type: 'button', class: 'btn', onclick: () => close(false) }, 'Abbrechen'),
          h('button', { type: 'submit', class: 'btn btn-primary' }, 'Speichern'))), { label: 'Nachtragen' });
      if (!ok) return;
      const items = boxes.map(b => ({ ...b.i, done: b.el.checked }));
      await save(kind, p, items);
      const pts = pointsFor(kind, items);
      toast(pts ? `Gespeichert · ${pts} ${pts === 1 ? 'Punkt' : 'Punkte'}` : 'Gespeichert');
    }

    async function openSettings(ctx) {
      const { h, dialog, toast } = ctx.ui; const U = ctx.util;
      const c = await cfg(ctx);
      const dOn = h('input', { type: 'checkbox', checked: c.dailyOn });
      const dTime = h('input', { type: 'time', value: U.minToTime(c.dailyTime), 'aria-label': 'Uhrzeit der täglichen Abfrage' });
      const wOn = h('input', { type: 'checkbox', checked: c.weeklyOn });
      const wTime = h('input', { type: 'time', value: U.minToTime(c.weeklyTime), 'aria-label': 'Uhrzeit der Abfrage am Sonntag' });
      const ok = await dialog(close => h('form', { onsubmit: e => { e.preventDefault(); close(true); } },
        h('h3', { class: 'row', style: { gap: '8px' } }, ctx.ui.icon('settings'), 'Ziele'),
        h('div', { class: 'stack' },
          h('label', { class: 'switch' }, dOn, h('span', {}, 'Täglich abfragen')),
          h('label', { class: 'field' }, h('span', {}, 'Uhrzeit'), dTime),
          h('label', { class: 'switch' }, wOn, h('span', {}, 'Sonntags abfragen')),
          h('label', { class: 'field' }, h('span', {}, 'Uhrzeit'), wTime)),
        h('div', { class: 'dlg-actions' },
          h('button', { type: 'button', class: 'btn', onclick: () => close(false) }, 'Abbrechen'),
          h('button', { type: 'submit', class: 'btn btn-primary' }, 'Speichern'))), { label: 'Ziele – Einstellungen' });
      if (!ok) return;
      const dt = U.timeToMin(dTime.value), wt = U.timeToMin(wTime.value);
      await ctx.settings.set('dailyOn', dOn.checked);
      await ctx.settings.set('weeklyOn', wOn.checked);
      if (dt != null) await ctx.settings.set('dailyTime', dt);
      if (wt != null) await ctx.settings.set('weeklyTime', wt);
      toast('Gespeichert');
      armAll(ctx);
    }

    App.register({
      id: 'ziele', name: 'Tägliche Ziele', icon: 'target', order: 15,
      description: 'Tages- und Wochenziele mit Abfrage am Abend, Serie und Punkten', category: 'Alltag',
      version: '1.1.0', schemaVersion: 1, migrations: {},
      reminderToast: false,   // keine In-App-Leiste „… Ansehen“ für die Abfrage; nur die Mitteilung des Systems

      async init(ctx) {
        goals = ctx.store.collection('goals', { sync: true });        // { title, type: 'daily'|'weekly', order }
        checkins = ctx.store.collection('checkins', { sync: true });  // id d-JJJJ-MM-TT / w-JJJJ-Www: { kind, key, start, goals, done, complete, points, answeredAt }
        ledger = ctx.store.collection('ledger', { sync: true });      // für künftige Funktionen: { amount, reason, at } (Ausgaben negativ)
      },

      async background(ctx) {
        bgCtx = ctx;
        subscribeBg(ctx);
        setInterval(() => armAll(ctx), 5 * 60000);
        await armAll(ctx);
      },

      async mount(el, ctx) {
        mounted = true;
        const { h } = ctx.ui; const U = ctx.util;
        const hintBox = h('div'), statsBox = h('div'), dayBox = h('div'), weekBox = h('div'), histBox = h('div');
