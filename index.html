              } },
                h('h3', {}, 'Sync-Passwort ändern'),
                h('p', { class: 'small muted' }, 'Alle Daten werden mit dem neuen Passwort neu verschlüsselt und hochgeladen. Alle anderen Geräte werden abgemeldet und müssen sich mit dem neuen Passwort neu verbinden (ihre lokalen Daten bleiben erhalten).'),
                h('div', { class: 'stack' }, field('Bisheriges Sync-Passwort', cur), field('Neues Sync-Passwort', n1), field('Neues Sync-Passwort wiederholen', n2), msg),
                h('div', { class: 'dlg-actions' }, h('button', { type: 'button', class: 'btn', onclick: () => close(false) }, 'Abbrechen'), sub));
            }, { modal: true, label: 'Sync-Passwort ändern' });
            if (ok) { toast('Sync-Passwort geändert'); renderSync(); }
          };
          b.off = h('button', { class: 'btn btn-sm' }, 'Dieses Gerät abmelden');
          b.off.onclick = async () => {
            if (!await confirm('Dieses Gerät vom Push-Dienst abmelden? Es bekommt dann keine Pushes mehr und gleicht nicht mehr ab. Alle Daten auf diesem Gerät bleiben erhalten.', { ok: 'Abmelden', danger: true })) return;
            await Y.disconnect(); toast('Abgemeldet – lokale Daten bleiben erhalten'); renderSync();
          };
          parts.sync.replaceChildren(card('cloud Push & Sync',
            h('dl', { class: 'kv' },
              h('dt', {}, 'Status'), h('dd', {}, statusText),
              h('dt', {}, 'Zuletzt'), h('dd', {}, st.lastOkAt ? U.relTime(st.lastOkAt) : '–'),
              h('dt', {}, 'Ausstehend'), h('dd', {}, pending ? `${pending} Änderung(en)` : 'nichts'),
              h('dt', {}, 'Push hier'), h('dd', {}, pushText),
              h('dt', {}, 'Gerät'), h('dd', {}, st.deviceName || '–'),
              h('dt', {}, 'Server'), h('dd', {}, st.api)),
            h('div', { class: 'row', style: { marginTop: '12px' } }, b.sync, P.supported() ? b.push : null, b.test),
            !P.supported() && U.isIOS() ? h('p', { class: 'small muted' }, '' + P.unsupportedReason()) : null,
            h('p', { class: 'small muted' }, 'Erinnerungen löst jetzt der Server aus – auch wenn alle Geräte die App geschlossen haben. Die Ruhezeiten unten gelten auch dort. Inhalte (Titel, Notizen) sind Ende-zu-Ende-verschlüsselt.'),
            h('details', { class: 'fold' }, h('summary', {}, 'Push-Diagnose'), diagBox, h('button', { class: 'btn btn-sm', style: { marginTop: '8px' }, onclick: loadDiag }, 'Aktualisieren')),
            h('details', { class: 'fold' }, h('summary', {}, 'Geräte & Konto'),
              h('div', { class: 'row' }, b.dev, b.pw, b.off), devBox)));
        };
        await renderSync();

        /* Datensicherung */
        const renderBackup = async () => {
          const list = await S.Backup.list();
          const fileIn = h('input', { type: 'file', accept: 'application/json,.json', class: 'sr-only', onchange: async e => {
            const f = e.target.files[0]; e.target.value = ''; if (!f) return;
            try {
              const data = JSON.parse(await f.text()); S.Backup.validate(data);
              const mode = await choose('Sicherung importieren', [
                { label: 'Zusammenführen (neuere Einträge gewinnen)', value: 'merge', primary: true },
                { label: 'Ersetzen (aktuelle Daten der enthaltenen Module überschreiben)', value: 'replace', danger: true },
              ], `Datei vom ${data.exportedAt ? new Date(data.exportedAt).toLocaleString('de-DE') : '?'}, App-Version ${data.appVersion}. Vorher wird automatisch ein Schnappschuss angelegt.`);
              if (!mode) return;
              const rep = await S.Backup.importData(data, mode);
              await confirm(`Importiert: ${rep.imported.join(', ') || '–'}${rep.skipped.length ? '\nÜbersprungen: ' + rep.skipped.join(', ') : ''}\n\nDie App wird jetzt neu geladen.`, { ok: 'Neu laden', cancel: 'Später' }) && location.reload();
            } catch (err) { toast('Import fehlgeschlagen: ' + err.message, { type: 'error' }); }
          } });
          const lastExport = await S.lastExportAt();
          parts.sicherung.replaceChildren(card('save Datensicherung',
            h('p', { class: 'small muted', style: { marginTop: 0 } }, S.Sync.enabled() ? 'Deine Daten liegen in diesem Browser und verschlüsselt auf deinem Push-Dienst. Exportiere trotzdem gelegentlich eine Sicherungsdatei (sie ist unverschlüsselt) und lege sie sicher ab.' : 'Deine Daten liegen nur in diesem Browser. Exportiere regelmäßig eine Sicherungsdatei und lege sie sicher ab (sie ist unverschlüsselt).'),
            h('p', { class: 'small' }, lastExport ? `Letzter Export: ${U.formatDateTimeFull(lastExport)}` : 'Noch kein Export.'),
            h('div', { class: 'row' },
              h('button', { class: 'btn btn-primary', onclick: async () => { await S.Backup.exportFile(); toast('Sicherung exportiert'); } }, ctx.ui.icon('download'), 'Exportieren'),
              h('button', { class: 'btn', onclick: () => fileIn.click() }, ctx.ui.icon('upload'), 'Importieren'), fileIn,
              h('button', { class: 'btn', onclick: async () => { await S.Backup.snapshot('manuell'); toast('Schnappschuss angelegt'); renderBackup(); } }, ctx.ui.icon('save'), 'Schnappschuss')),
            h('details', { class: 'fold' }, h('summary', {}, `Automatische Schnappschüsse (${list.length})`),
              list.length ? h('table', { class: 'simple' }, h('tbody', {}, list.map(b => h('tr', {},
                h('td', {}, U.formatDateTimeFull(b.createdAt), h('div', { class: 'small muted' }, `${b.reason} · v${b.appVersion} · ${U.formatBytes(b.size)}`)),
                h('td', { style: { textAlign: 'right' } },
                  h('button', { class: 'btn btn-sm', onclick: () => U.download(`persoenliche-app-schnappschuss-${b.id}.json`, JSON.stringify(b.data, null, 2)), 'aria-label': 'Herunterladen' }, ctx.ui.icon('download')),
                  ' ',
                  h('button', { class: 'btn btn-sm', onclick: async () => {
                    if (!await confirm(`Auf den Stand vom ${U.formatDateTimeFull(b.createdAt)} zurücksetzen?\nDer aktuelle Stand wird vorher als Schnappschuss gesichert.`, { ok: 'Wiederherstellen', danger: true })) return;
                    try { await S.Backup.importData(b.data, 'replace', 'vor Wiederherstellung'); location.reload(); } catch (err) { toast('Fehler: ' + err.message, { type: 'error' }); }
                  } }, 'Wiederherstellen')))))) : h('p', { class: 'muted small' }, 'Noch keine.'))));
        };
        await renderBackup();

        /* Speicher */
        const renderStorage = async () => {
          const st = await S.storage();
          parts.speicher.replaceChildren(card('database Speicher',
            h('dl', { class: 'kv' },
              h('dt', {}, 'Dauerhaft'), h('dd', {}, st.persisted == null ? 'unbekannt' : st.persisted ? 'ja – der Browser löscht die Daten nicht automatisch' : 'nein – der Browser könnte Daten bei Speichermangel löschen'),
              h('dt', {}, 'Belegt'), h('dd', {}, st.usage != null ? `${U.formatBytes(st.usage)} von ${U.formatBytes(st.quota)}` : 'unbekannt'),
              h('dt', {}, 'Installiert'), h('dd', {}, U.isStandalone() ? 'ja (Home-Bildschirm/App)' : 'nein (Browser-Tab)')),
            st.persisted === false ? h('button', { class: 'btn', style: { marginTop: '10px' }, onclick: async () => { const ok = await S.requestPersist(); toast(ok ? 'Speicher ist jetzt dauerhaft' : 'Browser hat abgelehnt – Installation als App hilft oft'); renderStorage(); } }, 'Dauerhaften Speicher anfordern') : null));
        };
        await renderStorage();

        /* Module */
        const renderModules = () => {
          const hidden = S.Settings.get('hiddenModules');
          const mods = S.Registry.list({ includeHidden: true }).filter(m => !m.system);
          parts.module.replaceChildren(card('grid Module', ...mods.map(m => {
            return h('div', { style: { borderTop: '1px solid var(--border)', paddingTop: '10px', marginTop: '10px' } },
              h('div', { class: 'row' }, h('strong', { class: 'grow row', style: { gap: '8px' } }, ctx.ui.icon(m.icon), m.name), h('span', { class: 'pill' }, `v${m.version || '?'} · Schema ${m.schemaVersion}`)),
              S.Registry.isReadOnly(m.id) ? h('div', { class: 'ro-banner' }, '' + S.Registry.st(m.id).lockReason) : null,
              sw('Anzeigen', !hidden.includes(m.id), async v => {
                const cur = S.Settings.get('hiddenModules').filter(x => x !== m.id);
                if (!v) cur.push(m.id);
                await S.Settings.set('hiddenModules', cur);
                toast(v ? `${m.name} wird angezeigt` : `${m.name} ausgeblendet (Daten bleiben erhalten)`);
              }),
              h('details', { class: 'fold' }, h('summary', {}, 'Gefahrenbereich'),
                h('button', { class: 'btn btn-danger btn-sm', onclick: async () => {
                  if (!await confirm(`Alle Daten von „${m.name}“ löschen?`, { ok: 'Weiter', danger: true })) return;
                  if (!await confirm(`Wirklich? Vorher wird ein Schnappschuss angelegt, über den du die Daten wiederherstellen kannst.`, { ok: 'Endgültig löschen', danger: true })) return;
                  await S.Backup.deleteModuleData(m.id); toast(`Daten von ${m.name} gelöscht`); renderBackup();
                } }, 'Daten dieses Moduls löschen')));
          })));
        };
        renderModules();

        /* Über */
        parts.ueber.append(card('info Über',
          h('dl', { class: 'kv' }, h('dt', {}, 'Version'), h('dd', {}, S.CONFIG.APP_VERSION), h('dt', {}, 'Datenbank'), h('dd', {}, S.CONFIG.DB_NAME)),
          h('div', { class: 'row', style: { marginTop: '10px' } }, h('button', { class: 'btn btn-sm', onclick: async () => { await S.VersionGuard.checkRemote(); toast('Auf Updates geprüft'); } }, 'Auf Updates prüfen')),
          h('details', { class: 'fold' }, h('summary', {}, 'Änderungsprotokoll'),
            ...S.CHANGELOG.map(c => h('div', {}, h('strong', {}, `${c.version} · ${c.date}`), h('ul', { class: 'small' }, c.items.map(i => h('li', {}, i))))))));

        /* Diagnose */
        const renderDiag = () => {
          const tests = S.Schedule.selfTest();
          const allOk = tests.every(t => t.ok);
          parts.diagnose.replaceChildren(card('activity Diagnose',
            h('details', { class: 'fold' }, h('summary', {}, `Eskalationsregel – Testtabelle: ${allOk ? 'alle bestanden' : 'Fehler'}`),
              h('table', { class: 'simple' }, h('thead', {}, h('tr', {}, h('th', {}, 'Verbleibend (Stufe 1 Tag)'), h('th', {}, 'Erwartet'), h('th', {}, 'Ergebnis'))),
                h('tbody', {}, tests.map(t => h('tr', {}, h('td', {}, t.label), h('td', {}, typeof t.expected === 'number' ? `${t.expected} Min` : t.expected), h('td', { class: t.ok ? 'test-ok' : 'test-fail' }, (typeof t.got === 'number' ? `${t.got} Min` : t.got) + (t.ok ? ' ✓' : ' ✗'))))))),
            h('details', { class: 'fold' }, h('summary', {}, `Protokoll (${S.Log.entries.length})`),
              h('div', { class: 'log' }, S.Log.entries.slice().reverse().map(e => `${new Date(e.ts).toLocaleString('de-DE')} [${e.level}] ${e.moduleId}: ${e.msg}\n`)),
              h('div', { class: 'row', style: { marginTop: '8px' } },
                h('button', { class: 'btn btn-sm', onclick: () => U.download('persoenliche-app-diagnose.json', JSON.stringify({ version: S.CONFIG.APP_VERSION, ua: navigator.userAgent, log: S.Log.entries }, null, 2)) }, 'Protokoll herunterladen'),
                h('button', { class: 'btn btn-sm', onclick: () => { S.Log.entries.length = 0; S.Log.persist(); renderDiag(); } }, 'Leeren')))));
        };
        renderDiag();

        ctx.events.on('notify:permission', renderNotify);
        ctx.events.on('push:changed', () => renderSync());
        let lastSyncState = S.Sync.status;
        ctx.events.on('sync:status', ({ state }) => { if (state !== 'syncing' && state !== lastSyncState) { lastSyncState = state; renderSync(); } });
        ctx.events.on('settings:changed', ({ key }) => { if (key === 'hiddenModules') renderModules(); });
      },
    });
  })();
  /* ==== ENDE MODUL: einstellungen ==== */
  </script>

  <script>
  /* ==== MODUL: todos ==== */
  (() => {
    const OVERDUE_OPTS = [5, 10, 15, 30, 60];
    let col;

    const DEFAULT_INTERVAL = 120; // 2 Stunden
    const cfg = async ctx => ({ intervalMin: await ctx.settings.get('defaultIntervalMin', DEFAULT_INTERVAL), overdueMin: await ctx.settings.get('overdueMin', 15) });
    /** Intervall eines ToDos in Minuten (ältere Einträge haben nur eine Stufen-ID) */
    const ivOf = (ctx, t) => t.intervalMin || (ctx.reminders.STAGES.find(s => s.id === t.stage) || { min: 1440 }).min;
    const remArgs = (ctx, t) => ({ intervalMin: ivOf(ctx, t), deadline: t.deadline || null, overdueMin: t.overdueMin || 15, title: t.title });

    /** Dringlichkeit einer Abgabe → Farbe */
    function urgency(deadline, now) {
      if (!deadline) return null;
      const h = (deadline - now) / 3600000;
      if (h <= 0) return 'red';
      if (h <= 24) return 'orange';
      if (h <= 72) return 'yellow';
      return 'blue';
    }

    async function loadAll(ctx) {
      const [todos, rems] = await Promise.all([col.all(), ctx.reminders.list()]);
      const rm = new Map(rems.map(r => [r.id, r]));
      return todos.map(t => ({ ...t, _r: rm.get(t.id) || null }));
    }

    function sortOpen(now) {
      return (a, b) => {
        const ao = !!a.deadline && a.deadline <= now, bo = !!b.deadline && b.deadline <= now;
        if (ao !== bo) return ao ? -1 : 1;
        if (a.deadline && b.deadline && a.deadline !== b.deadline) return a.deadline - b.deadline;
        if (!!a.deadline !== !!b.deadline) return a.deadline ? -1 : 1;
        return (a._r?.nextAt ?? Infinity) - (b._r?.nextAt ?? Infinity);
      };
    }

    async function create(ctx, { title, note = '', intervalMin, deadline }) {
      const c = await cfg(ctx);
      const t = await col.add({ title, note, stage: 'custom', intervalMin, deadline: deadline || null, overdueMin: c.overdueMin, done: false, doneAt: null, seenAt: null });
      await ctx.reminders.set(t.id, remArgs(ctx, t));
      return t;
    }
    async function complete(ctx, id) {
      await col.update(id, { done: true, doneAt: Date.now() });
      await ctx.reminders.done(id);
    }
    async function reopen(ctx, id) {
      const t = await col.update(id, { done: false, doneAt: null });
      const r = await ctx.reminders.get(id);
      if (!r) await ctx.reminders.set(id, remArgs(ctx, t));
      else await ctx.reminders.reopen(id);
    }
    async function markSeen(ctx, id) {
      await ctx.reminders.seen(id);
      await col.update(id, { seenAt: Date.now() });
    }

    /** Schnellwahl für die Abgabe */
    function quickDeadlines() {
      const now = new Date();
      const at = (addDays, h, m = 0) => { const d = new Date(now); d.setDate(d.getDate() + addDays); d.setHours(h, m, 0, 0); return d.getTime(); };
      const opts = [];
      if (now.getHours() < 17) opts.push({ label: 'Heute 18:00', ts: at(0, 18) });
      else if (now.getHours() < 21) opts.push({ label: 'Heute 22:00', ts: at(0, 22) });
      opts.push({ label: 'Morgen 09:00', ts: at(1, 9) });
      opts.push({ label: 'Morgen 18:00', ts: at(1, 18) });
      opts.push({ label: 'In 3 Tagen', ts: at(3, 18) });
      opts.push({ label: 'In 1 Woche', ts: at(7, 18) });
      return opts;
    }

    /** Intervall frei einstellen: Tage / Stunden / Minuten */
    function intervalEditor(ctx, min, onChange) {
      const { h } = ctx.ui;
      const num = (v, max, label) => h('label', { class: 'iv-field' },
        h('input', { type: 'number', inputmode: 'numeric', min: 0, max, step: 1, value: v, 'aria-label': label, oninput: upd, onfocus: e => e.target.select() }),
        h('span', {}, label));
      const d = num(Math.floor(min / 1440), 365, 'Tage'), hh = num(Math.floor((min % 1440) / 60), 23, 'Std'), mm = num(min % 60, 59, 'Min');
      const val = el => Math.max(0, Math.floor(Number(el.querySelector('input').value) || 0));
      const total = () => val(d) * 1440 + val(hh) * 60 + val(mm);
      function upd() { const t = total(); box.classList.toggle('invalid', t < 1); if (t >= 1) onChange(t); }
      const box = h('div', { class: 'iv' }, d, hh, mm);
      return { el: box, get: total };
    }

    function deadlineEditor(ctx, current, onChange) {
      const { h } = ctx.ui; const U = ctx.util;
      const input = h('input', { type: 'datetime-local', value: U.toLocalInput(current), 'aria-label': 'Abgabe Datum und Uhrzeit', onchange: () => onChange(U.fromLocalInput(input.value)) });
      const quick = h('div', { class: 'chips' },
        h('button', { type: 'button', class: 'chip', onclick: () => { input.value = ''; onChange(null); } }, 'Keine'),
        ...quickDeadlines().map(q => h('button', { type: 'button', class: 'chip', onclick: () => { input.value = U.toLocalInput(q.ts); onChange(q.ts); } }, q.label)));
      return { el: h('div', { class: 'stack' }, quick, h('div', { class: 'dl-row' }, input)), input, set: ts => { input.value = U.toLocalInput(ts); } };
    }

    /** Meta-Zeile eines ToDos */
    function metaLine(ctx, t, now) {
      const { h } = ctx.ui; const U = ctx.util;
      const r = t._r;
      const out = [h('span', { class: 'pill', title: 'Erinnerungs-Intervall' }, ctx.ui.icon('repeat'), 'alle ' + U.formatDuration(ivOf(ctx, t)))];
      if (t.deadline) {
        const u = urgency(t.deadline, now);
        const txt = t.deadline <= now ? `Überfällig seit ${U.formatDuration((now - t.deadline) / 60000)}` : `Abgabe ${U.formatDate(t.deadline)} · ${U.relTime(t.deadline, now)}`;
        out.push(h('span', { class: 'pill ' + u }, ctx.ui.icon(t.deadline <= now ? 'alert' : 'calendar'), txt));
      }
      if (!t.done && r && r.nextAt) out.push(h('span', { class: 'pill', title: U.formatDateTimeFull(r.nextAt) }, ctx.ui.icon('bell'), r.nextAt <= now ? 'gleich' : U.relTime(r.nextAt, now)));
      if (r && r.sentCount) out.push(h('span', { class: 'pill', title: 'Bisherige Erinnerungen' }, `${r.sentCount}× erinnert`));
      if (t.done && t.doneAt) out.push(h('span', { class: 'pill green' }, ctx.ui.icon('check'), U.formatDate(t.doneAt)));
      return h('div', { class: 't-meta' }, out);
    }

    /** Bearbeiten-Dialog */
    async function openEdit(ctx, id) {
      const { h, dialog, confirm, toast } = ctx.ui; const U = ctx.util;
      const t = await col.get(id);
      if (!t) { toast('ToDo nicht gefunden'); return; }
      const r = await ctx.reminders.get(id);
      if (r && r.unseen) await markSeen(ctx, id);
      let iv = ivOf(ctx, t), deadline = t.deadline;
      const titleIn = h('input', { type: 'text', value: t.title, autofocus: true, 'aria-label': 'Titel' });
      const noteIn = h('textarea', { 'aria-label': 'Notiz', placeholder: 'Notiz (optional)' }); noteIn.value = t.note || '';
      const overdueSel = h('select', {}, OVERDUE_OPTS.map(m => h('option', { value: m, selected: (t.overdueMin || 15) === m }, `alle ${m} Minuten`)));
      const preview = h('div', { class: 'small muted' });
      const upd = () => {
        if (t.done) { preview.textContent = 'Erledigt – keine Erinnerungen.'; return; }
        const changed = iv !== ivOf(ctx, t) || (deadline || null) !== (t.deadline || null) || Number(overdueSel.value) !== (t.overdueMin || 15);
        const n = changed || !r ? ctx.reminders.preview({ intervalMin: iv, deadline, overdueMin: Number(overdueSel.value) }) : r.nextAt;
        preview.textContent = n ? `${changed ? 'Nach dem Speichern: n' : 'N'}ächste Erinnerung ${U.relTime(n)} (${U.formatDate(n)})` : '';
      };
      overdueSel.onchange = upd;
      const dl = deadlineEditor(ctx, deadline, v => { deadline = v; upd(); });
      upd();
      const result = await dialog(close => h('form', { onsubmit: e => { e.preventDefault(); close('save'); } },
        h('h3', {}, 'ToDo bearbeiten'),
        h('div', { class: 'stack' },
          titleIn, noteIn,
          h('div', { class: 'small muted' }, 'Intervall – so oft wirst du erinnert, bis es erledigt ist'),
          intervalEditor(ctx, iv, v => { iv = v; upd(); }).el,
          h('div', { class: 'small muted' }, 'Abgabe – je näher, desto öfter wirst du erinnert'),
          dl.el,
          h('label', { class: 'field' }, h('span', {}, 'Nach Ablauf der Abgabe erinnern'), overdueSel),
          preview,
          r ? h('div', { class: 'small muted' }, `Bisher ${r.sentCount}× erinnert${r.lastSentAt ? ', zuletzt ' + U.relTime(r.lastSentAt) : ''} · angelegt ${U.formatDate(t.createdAt)}`) : null),
        h('div', { class: 'dlg-actions' },
          h('button', { type: 'button', class: 'btn btn-ghost', style: { marginRight: 'auto', color: 'var(--danger)' }, onclick: () => close('delete') }, 'Löschen'),
          h('button', { type: 'button', class: 'btn', onclick: () => close() }, 'Abbrechen'),
          h('button', { type: 'submit', class: 'btn btn-primary' }, 'Speichern'))), { label: 'ToDo bearbeiten' });

      if (result === 'save') {
        const title = titleIn.value.trim();
        if (!title) { toast('Titel darf nicht leer sein'); return; }
        const overdueMin = Number(overdueSel.value);
        const nt = await col.update(id, { title, note: noteIn.value, stage: 'custom', intervalMin: iv, deadline: deadline || null, overdueMin });
        await ctx.reminders.set(id, remArgs(ctx, nt));
        toast('Gespeichert');
      } else if (result === 'delete') {
        if (await confirm(`„${t.title}“ löschen?`, { ok: 'Löschen', danger: true })) {
          await col.remove(id); await ctx.reminders.remove(id);
          toast('Gelöscht', { action: 'Rückgängig', onAction: async () => { await col.update(id, { deletedAt: null }); await ctx.reminders.set(id, remArgs(ctx, t)); if (t.done) await ctx.reminders.done(id); } });
        }
      }
    }

    /** Fenster „Neues ToDo“ – liegt über der Modul-Oberfläche */
    async function openCreate(ctx) {
      const { h, dialog, toast } = ctx.ui; const U = ctx.util;
      const c = await cfg(ctx);
      let iv = c.intervalMin, deadline = null;
      const titleIn = h('input', { type: 'text', class: 'title-input', placeholder: 'Was ist zu tun?', enterkeyhint: 'done', 'aria-label': 'Titel', autocomplete: 'off', autofocus: true });
      const noteIn = h('textarea', { 'aria-label': 'Notiz', placeholder: 'Notiz (optional)', rows: 2 });
      const preview = h('div', { class: 'preview' });
      const upd = () => {
        const n = ctx.reminders.preview({ intervalMin: iv, deadline, overdueMin: c.overdueMin });
        preview.textContent = `Erste Erinnerung ${U.relTime(n)} (${U.formatDate(n)})` + (deadline ? ' – danach immer häufiger bis zur Abgabe.' : `, danach alle ${U.formatDuration(iv)}, bis du es abhakst.`);
      };
      const dl = deadlineEditor(ctx, deadline, v => { deadline = v; upd(); });
      upd();
      const ok = await dialog(close => {
        const form = h('form', { class: 'composer', onsubmit: e => { e.preventDefault(); if (titleIn.value.trim()) close(true); else titleIn.focus(); } },
          h('h3', {}, 'Neues ToDo'),
          titleIn,
          h('div', { class: 'lbl' }, 'Intervall – so oft wirst du erinnert, bis es erledigt ist'),
          intervalEditor(ctx, iv, v => { iv = v; upd(); }).el,
          h('div', { class: 'lbl' }, 'Abgabe (optional) – je näher, desto öfter'),
          dl.el,
          h('div', { style: { marginTop: '10px' } }, noteIn),
          preview,
          h('div', { class: 'dlg-actions' },
            h('button', { type: 'button', class: 'btn', onclick: () => close(false) }, 'Abbrechen'),
            h('button', { type: 'submit', class: 'btn btn-primary' }, 'Anlegen')));
        titleIn.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); form.requestSubmit(); } });
        return form;
      }, { label: 'Neues ToDo' });
      if (!ok) return;
      try {
        await create(ctx, { title: titleIn.value.trim(), note: noteIn.value.trim() ? noteIn.value : '', intervalMin: iv, deadline });
        if (ctx.notify.permission() === 'default') toast('Damit ich dich erinnern kann, erlaube Benachrichtigungen.', { action: 'Erlauben', onAction: () => ctx.notify.request(), timeout: 9000 });
        else toast('ToDo angelegt');
      } catch (err) { toast('Fehler: ' + err.message, { type: 'error' }); }
    }

    /** Einstellungen des Moduls – direkt im Modul */
    async function openSettings(ctx) {
      const { h, dialog, toast } = ctx.ui;
      const c = await cfg(ctx);
      let iv = c.intervalMin;
      const ivEd = intervalEditor(ctx, iv, v => { iv = v; });
      const overSel = h('select', {}, OVERDUE_OPTS.map(m => h('option', { value: m, selected: m === c.overdueMin }, `alle ${m} Minuten`)));
      const ok = await dialog(close => h('form', { onsubmit: e => { e.preventDefault(); close(true); } },
        h('h3', { class: 'row', style: { gap: '8px' } }, ctx.ui.icon('settings'), 'ToDo-Einstellungen'),
        h('div', { class: 'stack' },
          h('div', { class: 'field' }, h('span', { class: 'small muted', style: { display: 'block', marginBottom: '4px' } }, 'Standard-Intervall für neue ToDos'), ivEd.el),
          h('label', { class: 'field' }, h('span', {}, 'Erinnern nach Ablauf der Abgabe (Standard für neue ToDos)'), overSel),
          h('p', { class: 'small muted', style: { margin: 0 } }, 'Ruhezeiten und Benachrichtigungen gelten für alle Module – sie stehen im Tab „Einstellungen“.')),
        h('div', { class: 'dlg-actions' },
          h('button', { type: 'button', class: 'btn', onclick: () => close(false) }, 'Abbrechen'),
          h('button', { type: 'submit', class: 'btn btn-primary' }, 'Speichern'))), { label: 'ToDo-Einstellungen' });
      if (!ok) return;
      if (ivEd.get() >= 1) await ctx.settings.set('defaultIntervalMin', ivEd.get());
      await ctx.settings.set('overdueMin', Number(overSel.value));
      toast('Gespeichert');
    }

    /** Alle ausgelösten Erinnerungen als gesehen markieren (Modul ist offen und sichtbar) */
    async function markAllSeen(ctx) {
      if (ctx.readOnly || document.visibilityState !== 'visible') return;
      const rems = await ctx.reminders.list();
      for (const r of rems) if (r.unseen) await ctx.reminders.seen(r.id);
    }

    let highlightId = null;

    App.register({
      id: 'todos', name: 'ToDos', icon: 'todos', order: 10,
      description: 'Aufgaben mit hartnäckigen Erinnerungen', category: 'Alltag',
      version: '1.3.0', schemaVersion: 1, migrations: {},

      async init(ctx) { col = ctx.store.collection('todos', { sync: true }); },

      async mount(el, ctx, route) {
        const { h, toast } = ctx.ui; const U = ctx.util;
        const openBox = h('div');
        const doneBox = h('div');
        el.append(
          h('div', { class: 'head' },
            h('h2', {}, 'ToDos'),
            h('button', { class: 'btn btn-ghost', title: 'ToDo-Einstellungen', 'aria-label': 'ToDo-Einstellungen', onclick: () => openSettings(ctx), disabled: ctx.readOnly }, ctx.ui.icon('settings'))),
          openBox, doneBox,
          h('button', { class: 'btn btn-primary fab', onclick: () => openCreate(ctx), disabled: ctx.readOnly }, ctx.ui.icon('plus'), 'Neues ToDo'));

        let doneOpen = false;

        const row = (t, now) => {
          const u = t.deadline && !t.done ? urgency(t.deadline, now) : null;
          return h('li', { class: 'todo' + (t.done ? ' done' : '') + (u === 'red' ? ' overdue' : u === 'orange' ? ' soon' : '') + (t.id === highlightId ? ' flash' : ''), 'data-id': t.id },
            h('button', { class: 'check', 'aria-label': t.done ? 'Wieder öffnen' : 'Abhaken', title: t.done ? 'Wieder öffnen' : 'Abhaken', disabled: ctx.readOnly, onclick: async () => {
              if (t.done) { await reopen(ctx, t.id); toast('Wieder geöffnet – Erinnerungen laufen weiter'); }
              else { await complete(ctx, t.id); toast(`„${t.title}“ erledigt `, { action: 'Rückgängig', onAction: () => reopen(ctx, t.id) }); }
            } }, h('span')),
            h('div', { class: 't-body', onclick: () => openEdit(ctx, t.id) },
              h('div', { class: 't-title' }, t.title),
              t.note ? h('div', { class: 't-note' }, t.note) : null,
              metaLine(ctx, t, now)),
            t.done ? h('div', { class: 'done-actions' }, h('button', { class: 'btn btn-ghost btn-sm', title: 'Löschen', 'aria-label': 'Löschen', disabled: ctx.readOnly, onclick: async e => {
              e.stopPropagation();
              await col.remove(t.id); await ctx.reminders.remove(t.id);
              toast('Gelöscht', { action: 'Rückgängig', onAction: async () => { await col.update(t.id, { deletedAt: null }); } });
            } }, ctx.ui.icon('trash'))) : null);
        };

        const render = async () => {
          const now = Date.now();
          const all = await loadAll(ctx);
          const open = all.filter(t => !t.done).sort(sortOpen(now));
          const done = all.filter(t => t.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
          openBox.replaceChildren(
            h('div', { class: 'section-title' }, `Aktiv (${open.length})`),
            open.length ? h('ul', { class: 'todo-list' }, open.map(t => row(t, now))) : h('div', { class: 'card empty' }, 'Nichts offen. Neues ToDo über den Knopf unten.'));
          if (done.length) {
            const det = h('details', { class: 'fold', open: doneOpen, ontoggle: () => { doneOpen = det.open; } },
              h('summary', {}, `Erledigt (${done.length})`),
              h('ul', { class: 'todo-list' }, done.slice(0, 200).map(t => row(t, now))));
            doneBox.replaceChildren(det);
          } else doneBox.replaceChildren();
          if (highlightId) {
            const li = openBox.querySelector(`li[data-id="${CSS.escape(highlightId)}"]`) || doneBox.querySelector(`li[data-id="${CSS.escape(highlightId)}"]`);
            if (li) li.scrollIntoView({ block: 'center', behavior: 'smooth' });
            highlightId = null;
          }
          if (all.some(t => t._r && t._r.unseen)) markAllSeen(ctx);
        };

        const re = U.debounce(render, 150);
        ctx.events.on('store:changed', e => { if (e.moduleId === 'todos') re(); });
        ctx.events.on('reminders:changed', re);
        ctx.events.on('reminder:fired', re);
        ctx.events.on('app:visible', re);
        ctx.every(30000, render);
        this._render = render;
        if (route.parts[0]) await this.onRoute(route, ctx); else await render();
      },

      /** #/todos/<id> (z. B. aus der Startseiten-Kachel) markiert das ToDo in der Liste – kein Bearbeiten-Fenster */
      async onRoute(route, ctx) {
        const id = route.parts[0];
        if (!id) return;
        highlightId = id;
        ctx.router.navigate('todos', { replace: true });
        if (this._render) await this._render();
      },

      unmount() { this._render = null; },

      async onReminderAction(itemId, action, ctx) {
        if (action === 'done') { const t = await col.get(itemId); if (t && !t.done) await col.update(itemId, { done: true, doneAt: Date.now() }); }
        if (action === 'snooze') { const t = await col.get(itemId); if (t) await col.update(itemId, { seenAt: Date.now() }); }
      },
    });
  })();
  /* ==== ENDE MODUL: todos ==== */
  </script>

  <script>/* ==== BOOT ==== */ App.boot();</script>
</body>
</html>
