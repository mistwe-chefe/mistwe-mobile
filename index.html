        const ensureResult = () => { if (S.mode === 'edit' && S.root.length) exe(); return S.mode !== 'error'; };
        const storeVar = name => {

          S.vars[name] = v; S.note = '→' + name; if (S.mode !== 'result') { S.res = { kind: 'num', v, hints: { dec: false, pi: false, rad: new Set(), trig: false } }; S.mode = 'result'; }

        };
        const mem = sign => {
          if (!ensureResult()) return;

        };
        const calcVars = async () => {
          const used = []; const walk = s => s.forEach(n => { if (n.k === 't' && n.v.startsWith('v:') && !used.includes(n.v.slice(2))) used.push(n.v.slice(2)); if (n.s) n.s.forEach(walk); });
          const eqAt = S.root.findIndex(n => n.k === 't' && n.v === '=');
          walk(eqAt === 1 ? S.root.slice(2) : S.root);

          }

        };

        /* ---- Menüs im Display ---- */
        const openMenu = (title, items, parent = null) => { S.menu = { title, items, sel: 0, parent }; };
        const closeMenu = () => { S.menu = S.menu && S.menu.parent ? S.menu.parent : null; };
        const pickMenu = k => { const m = S.menu; const it = m && m.items[k]; if (!it) return; if (it.sub) { openMenu(it.label, it.sub(), m); return; } S.menu = null; it.run(); };
        const setupMenu = () => openMenu('SETUP', [
          { label: 'Ein-/Ausgabe', sub: () => [['MathI/MathO', 'mathO'], ['MathI/DecimalO', 'decO']].map(([l, v]) => ({ label: l, on: S.setup.io === v, run: () => { S.setup.io = v; saveSetup(); } })) },
          { label: 'Winkeleinheit', sub: () => [['Grad (D)', 'D'], ['Bogenmaß (R)', 'R'], ['Neugrad (G)', 'G']].map(([l, v]) => ({ label: l, on: S.setup.ang === v, run: () => { S.setup.ang = v; saveSetup(); } })) },
          { label: 'Zahlenformat', sub: () => [
            { label: 'Norm 1', on: S.setup.fmt.t === 'norm' && S.setup.fmt.n === 1, run: () => { S.setup.fmt = { t: 'norm', n: 1 }; saveSetup(); } },
            { label: 'Norm 2', on: S.setup.fmt.t === 'norm' && S.setup.fmt.n === 2, run: () => { S.setup.fmt = { t: 'norm', n: 2 }; saveSetup(); } },
            { label: 'Fix', on: S.setup.fmt.t === 'fix', sub: () => Array.from({ length: 10 }, (_, n) => ({ label: 'Fix ' + n, on: S.setup.fmt.t === 'fix' && S.setup.fmt.n === n, run: () => { S.setup.fmt = { t: 'fix', n }; saveSetup(); } })) },
            { label: 'Sci', on: S.setup.fmt.t === 'sci', sub: () => Array.from({ length: 10 }, (_, k) => { const n = k + 1 === 10 ? 10 : k + 1; return { label: 'Sci ' + n, on: S.setup.fmt.t === 'sci' && S.setup.fmt.n === n, run: () => { S.setup.fmt = { t: 'sci', n }; saveSetup(); } }; }) },

          { label: 'Bruchergebnis', sub: () => [['d/c (unecht)', 'dc'], ['a b/c (gemischt)', 'abc']].map(([l, v]) => ({ label: l, on: S.setup.frac === v, run: () => { S.setup.frac = v; saveSetup(); } })) },
        ]);
        const optnMenu = () => {
          const ins = (label, act) => ({ label, run: () => doAct(act) });
          openMenu('OPTN', [
            { label: 'Hyperbelfunktionen', sub: () => ['sinh', 'cosh', 'tanh', 'asinh', 'acosh', 'atanh'].map(f => ins(FN[f].slice(0, -1), 'ins:f:' + f)) },
            { label: 'Winkeleinheit', sub: () => [ins('° (Grad)', 'ins:a:d'), ins('ʳ (Bogenmaß)', 'ins:a:r'), ins('ᵍ (Neugrad)', 'ins:a:g')] },
            { label: 'Technische Symbole', sub: () => ['k', 'M', 'G', 'T', 'm', 'μ', 'n', 'p', 'f'].map(s => ins(`${s} (10^${Math.round(Math.log10(ENGSYM[s]))})`, 'ins:e:' + s)) },
            { label: 'Analysis', sub: () => [ins('∫ Integral', 'tpl:int'), ins('d/dx Ableitung', 'tpl:der'), ins('Σ Summe', 'tpl:sum')] },
            { label: 'Numerische Berechnung', sub: () => [ins('GCD (ggT)', 'ins:f:GCD'), ins('LCM (kgV)', 'ins:f:LCM'), ins('Int', 'ins:f:Int'), ins('Intg', 'ins:f:Intg'), ins('Abs', 'tpl:abs'), ins('Rnd', 'ins:f:Rnd'), ins('RndFix', 'ins:f:RndFix')] },
            { label: 'Wahrscheinlichkeit', sub: () => [ins('x!', 'ins:p:!'), ins('nPr', 'ins:nPr'), ins('nCr', 'ins:nCr'), ins('Ran#', 'ins:c:Ran#'), ins('RanInt#', 'ins:f:RanInt')] },

        const fmtShort = v => { const d = fmtDec(v, { ...S.setup, fmt: { t: 'norm', n: 1 } }); return d.m + (d.e != null ? '×10^' + d.e : ''); };
        const rclMenu = () => openMenu('RECALL', VARS.map(v => ({ label: `${v} = ${fmtShort(S.vars[v])}`, run: () => doAct('ins:v:' + v) })));
        const resetMenu = () => openMenu('RESET', [
          { label: 'Setup-Daten', run: async () => { if (await ctx.ui.confirm('Setup zurücksetzen?')) { S.setup = { ...SETUP_DEF }; saveSetup(); } render(); } },
          { label: 'Variablen/Speicher', run: async () => { if (await ctx.ui.confirm('Variablen und Ans löschen?', { danger: true })) { VARS.forEach(v => { S.vars[v] = 0; }); S.ans = 0; save(); } render(); } },
          { label: 'Alles initialisieren', run: async () => { if (await ctx.ui.confirm('Setup, Variablen und Verlauf löschen?', { danger: true })) { S.setup = { ...SETUP_DEF }; saveSetup(); VARS.forEach(v => { S.vars[v] = 0; }); S.ans = 0; S.hist = []; clearInput(); save(); } render(); } },
        ]);
        const appMenu = () => openMenu('MENU', [
          { label: 'Berechnungen', on: S.app === 'calc', run: () => { S.app = 'calc'; clearInput(); } },
          { label: 'Tabelle', on: S.app === 'table', run: () => { S.app = 'table'; S.tbl.stage = 'f'; setRoot(JSON.parse(JSON.stringify(S.tbl.f))); S.mode = 'edit'; } },
          { label: 'Gleichungen', on: S.app === 'eqn', sub: () => [
            { label: 'Gleichungssystem', sub: () => [2, 3, 4].map(n => ({ label: n + ' Unbekannte', run: () => startEqn('sim', n) })) },
            { label: 'Polynom', sub: () => [2, 3, 4].map(n => ({ label: 'Grad ' + n, run: () => startEqn('poly', n) })) },
          ] },
        ]);

        /* ---- App: Tabelle ---- */
        const T_STAGES = ['f', 'start', 'end', 'step'];
        const tblExe = () => {
          const t = S.tbl;
          if (t.stage === 'view') return;
          if (t.stage === 'f') {
            if (!S.root.length) return;
            t.f = JSON.parse(JSON.stringify(S.root));
          } else {
            try { const v = r14(evalSlot(S.root, env())); t[t.stage] = v; } catch (e) { S.mode = 'error'; S.err = e.message || 'Syntax ERROR'; return; }
          }
          const next = T_STAGES[T_STAGES.indexOf(t.stage) + 1];
          if (next) { t.stage = next; setRoot(numToks(t[next])); S.mode = 'edit'; S.replaceNext = true; return; }
          if (t.step === 0 || (t.end - t.start) / t.step < 0) { S.mode = 'error'; S.err = 'Range ERROR'; t.stage = 'start'; setRoot(numToks(t.start)); return; }
          const n = Math.floor(r14((t.end - t.start) / t.step)) + 1;
          if (n > 45) { S.mode = 'error'; S.err = 'Range ERROR (max. 45 Zeilen)'; t.stage = 'start'; setRoot(numToks(t.start)); return; }
          t.rows = Array.from({ length: n }, (_, k) => {
            const x = r14(t.start + k * t.step);
            try { return [x, r14(evalSlot(t.f, { ...env(), vars: { ...S.vars, x } }))]; } catch (_) { return [x, null]; }
          });

        };

        /* ---- App: Gleichungen ---- */
        const startEqn = (type, n) => {
          const e = S.eqn; e.type = type; e.n = n; e.r = 0; e.c = 0; e.editing = false; e.res = null; e.sel = 0;
          e.M = type === 'sim' ? Array.from({ length: n }, () => Array(n + 1).fill(0)) : [Array(n + 1).fill(0)];
          S.app = 'eqn'; S.mode = 'coef'; setRoot([]);
        };
        const eqCols = () => S.eqn.type === 'sim' ? S.eqn.n + 1 : S.eqn.n + 1;
        const eqRows = () => S.eqn.type === 'sim' ? S.eqn.n : 1;
        const eqMove = (dr, dc) => { const e = S.eqn; let r = e.r, c = e.c + dc; if (c >= eqCols()) { c = 0; r++; } if (c < 0) { c = eqCols() - 1; r--; } r += dr; e.r = Math.max(0, Math.min(eqRows() - 1, r)); e.c = Math.max(0, Math.min(eqCols() - 1, c)); };
        const eqCommit = () => {
          const e = S.eqn;
          try { e.M[e.r][e.c] = r14(evalSlot(S.root, env())); } catch (err) { S.mode = 'error'; S.err = err.message || 'Syntax ERROR'; return false; }
          e.editing = false; setRoot([]); return true;
        };
        const eqSolve = () => {
          const e = S.eqn;
          if (e.type === 'sim') {
            const n = e.n, A = e.M.map(r => r.slice());
            let rank = 0; const piv = [];
            for (let c = 0; c < n && rank < n; c++) {
              let p = rank; for (let r = rank + 1; r < n; r++) if (Math.abs(A[r][c]) > Math.abs(A[p][c])) p = r;
              if (Math.abs(A[p][c]) < 1e-12) continue;
              [A[rank], A[p]] = [A[p], A[rank]];
              for (let r = 0; r < n; r++) if (r !== rank) { const f = A[r][c] / A[rank][c]; for (let k = c; k <= n; k++) A[r][k] -= f * A[rank][k]; }
              piv.push(c); rank++;
            }
            if (rank < n) { const incons = A.slice(rank).some(r => Math.abs(r[n]) > 1e-9); e.res = { msg: incons ? 'Keine Lösung' : 'Unendlich viele Lösungen' }; }
            else { const names = ['x', 'y', 'z', 't']; e.res = { list: piv.map((c, r) => ({ name: names[c], re: r14(A[r][n] / A[r][c]), im: 0 })).sort((a, b) => names.indexOf(a.name) - names.indexOf(b.name)) }; }
          } else {
            const co = e.M[0];
            if (co[0] === 0) { S.mode = 'error'; S.err = 'Math ERROR (Leitkoeffizient 0)'; return; }
            const roots = polyRoots(co);
            const D = e.n === 2 ? co[1] * co[1] - 4 * co[0] * co[2] : null;
            e.res = { list: roots.map((z, k) => ({ name: 'x' + '₁₂₃₄'[k], re: z[0], im: z[1] })), rad: D != null ? [squarefree(Math.abs(D))].filter(q => q && q > 1) : [2, 3, 5, 6, 7] };
          }
          e.sel = 0; S.mode = 'eres';
        };
        function polyRoots(co) {
          const n = co.length - 1, a = co.map(c => c / co[0]);
          const mul = (p, q) => [p[0] * q[0] - p[1] * q[1], p[0] * q[1] + p[1] * q[0]];
          const div = (p, q) => { const d = q[0] * q[0] + q[1] * q[1]; return [(p[0] * q[0] + p[1] * q[1]) / d, (p[1] * q[0] - p[0] * q[1]) / d]; };
          const ev = z => a.reduce((acc, c) => { const m = mul(acc, z); return [m[0] + c, m[1]]; }, [0, 0]);
          let z = Array.from({ length: n }, (_, k) => { let w = [1, 0]; for (let j = 0; j <= k; j++) w = mul(w, [0.4, 0.9]); return w; });
          for (let it = 0; it < 2000; it++) {
            let delta = 0;
            z = z.map((zi, i) => { let den = [1, 0]; z.forEach((zj, j) => { if (j !== i) den = mul(den, [zi[0] - zj[0], zi[1] - zj[1]]); }); const step = div(ev(zi), den); delta = Math.max(delta, Math.hypot(...step)); return [zi[0] - step[0], zi[1] - step[1]]; });
            if (delta < 1e-15) break;
          }
          return z.map(([re, im]) => { if (Math.abs(im) < 1e-9 * (1 + Math.abs(re))) im = 0; return [r14(re), r14(im)]; })
            .sort((p, q) => (p[1] !== 0) - (q[1] !== 0) || q[0] - p[0] || q[1] - p[1]);
        }

        /* ---- Tasten-Verarbeitung ---- */
        const varOfKey = k => k && k.v;
        function press(key) {
          if (!S.on) { if (key.id === 'on') { S.on = true; clearInput(); S.menu = null; } return render(); }
          let act = key.act;

          else if (S.alpha && key.al) act = key.al[1];

          if (S.pending === 'sto') { S.pending = null; if (act !== 'shift' && act !== 'alpha') { if (varOfKey(key) && key.act !== 'sto') storeVar(varOfKey(key)); return render(); } }

          doAct(act, key);
          render();
        }
        function menuKey(act, key) {
          const m = S.menu;
          if (act === 'up') m.sel = (m.sel - 1 + m.items.length) % m.items.length;
          else if (act === 'down') m.sel = (m.sel + 1) % m.items.length;
          else if (act === 'exe' || act === 'right') pickMenu(m.sel);
          else if (act === 'ac' || act === 'left' || act === 'on') closeMenu();
          else if (act === 'menu' || act === 'optn' || act === 'setup') { S.menu = null; doAct(act); }
          else if (act === 'shift' || act === 'alpha') { S[act] = !S[act]; }
          else if (/^ins:[1-9]$/.test(act)) pickMenu(Number(act.slice(4)) - 1);
          else if (S.menu && S.menu.title === 'RECALL' && varOfKey(key)) { S.menu = null; doAct('ins:v:' + varOfKey(key)); }
        }
        function doAct(act, key) {
          S.note = S.mode === 'result' ? S.note : '';
          // Apps mit eigenen Zuständen
          if (S.app === 'table' && S.mode === 'view') {
            const t = S.tbl;
            if (act === 'up') t.sel = Math.max(0, t.sel - 1);
            else if (act === 'down') t.sel = Math.min(t.rows.length - 1, t.sel + 1);
            else if (act === 'ac' || act === 'on') { t.stage = 'f'; setRoot(JSON.parse(JSON.stringify(t.f))); S.mode = 'edit'; }
            else if (act === 'menu' || act === 'setup' || act === 'shift' || act === 'alpha' || act === 'off') { if (act === 'shift' || act === 'alpha') S[act] = !S[act]; else generic(act); }
            return;
          }
          if (S.app === 'eqn' && (S.mode === 'coef' || S.mode === 'eres' || (S.mode === 'error' && S.eqn.type))) {
            const e = S.eqn;
            if (S.mode === 'error') { if (['ac', 'left', 'right', 'del', 'on'].includes(act)) { S.mode = e.res ? 'eres' : 'coef'; S.err = null; } return; }
            if (S.mode === 'eres') {
              if (act === 'up') e.sel = Math.max(0, e.sel - 1);
              else if (act === 'down') e.sel = Math.min((e.res.list || [1]).length - 1, e.sel + 1);
              else if (act === 'ac' || act === 'exe' || act === 'on') { S.mode = 'coef'; e.res = null; }
              else if (act === 'sd') S.view = S.view === 'dec' ? 'auto' : 'dec';
              else generic(act);
              return;
            }
            if (!e.editing) {
              if (act === 'up') eqMove(-1, 0); else if (act === 'down') eqMove(1, 0);
              else if (act === 'left') eqMove(0, -1); else if (act === 'right') eqMove(0, 1);
              else if (act === 'exe') eqSolve();
              else if (act === 'ac' || act === 'on') { S.app = 'eqn'; appMenu(); pickMenu(2); }
              else if (act.startsWith('ins:') || act.startsWith('tpl:')) { e.editing = true; setRoot([]); S.mode = 'edit'; editAct(act); S.mode = 'coef'; }
              else if (act === 'del') { e.M[e.r][e.c] = 0; }
              else generic(act);
              return;
            }
            if (act === 'exe') { if (eqCommit()) eqMove(0, 1); return; }
            if (act === 'up' || act === 'down') { if (eqCommit()) eqMove(act === 'up' ? -1 : 1, 0); return; }
            if (act === 'ac') { e.editing = false; setRoot([]); return; }
            if (/^(ins|tpl):/.test(act) || ['del', 'left', 'right', 'undo', 'ins', 'dms'].includes(act)) { S.mode = 'edit'; editAct(act, key); S.mode = 'coef'; }
            else generic(act);
            return;
          }
          if (S.app === 'table' && S.mode !== 'view') {
            if (act === 'exe') { if (S.mode === 'error') { S.mode = 'edit'; S.err = null; return; } tblExe(); return; }
            if (S.mode === 'error') { S.mode = 'edit'; S.err = null; return; }
            if (act === 'ac' || act === 'on') { if (S.tbl.stage !== 'f') { S.tbl.stage = 'f'; setRoot(JSON.parse(JSON.stringify(S.tbl.f))); } else setRoot([]); return; }
            if (act === 'up' && S.tbl.stage !== 'f' && !vertical(-1)) { const k = T_STAGES.indexOf(S.tbl.stage) - 1; S.tbl.stage = T_STAGES[k]; setRoot(k === 0 ? JSON.parse(JSON.stringify(S.tbl.f)) : numToks(S.tbl[T_STAGES[k]])); return; }
            if (/^(ins|tpl):/.test(act) || ['del', 'left', 'right', 'down', 'up', 'undo', 'ins', 'dms'].includes(act)) editAct(act, key);
            else generic(act);
            return;
          }
          editAct(act, key);
        }
        function generic(act) {
          switch (act) {
            case 'menu': appMenu(); return true;
            case 'setup': setupMenu(); return true;
            case 'optn': optnMenu(); return true;

  <script>

    let listen, posten, gerne, online, gross;

    const norm = s => String(s || '').trim().replace(/\s+/g, ' ').toLocaleLowerCase('de-DE');
    const clean = s => String(s || '').trim().replace(/\s+/g, ' ').slice(0, 120);
    const eur = n => (n == null || !Number.isFinite(Number(n))) ? '' : Number(n).toLocaleString('de-DE', { style: 'currency', currency: 'EUR', maximumFractionDigits: Number(n) % 1 ? 2 : 0 });
    const parsePrice = s => {
      let t = String(s ?? '').replace(/[€\s]/g, '');
      if (!t) return null;
      if (t.includes(',') || /^\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, '').replace(',', '.');
      const n = Number(t);
      return Number.isFinite(n) && n >= 0 ? Math.round(n * 100) / 100 : null;
    };
    const safeUrl = u => {
      const s = String(u || '').trim(); if (!s) return null;
      try { const x = new URL(/^https?:\/\//i.test(s) ? s : 'https://' + s); return /^https?:$/.test(x.protocol) ? x.href : null; } catch (_) { return null; }
    };
    const host = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (_) { return ''; } };
    const byName = (a, b) => a.name.localeCompare(b.name, 'de');
    const todayKey = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
    const fmtKey = k => { const [y, m, d] = String(k).split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' }); };

    /** Gerne-Eintrag: fällig, wenn der übliche Abstand (aus Käufen) verstrichen ist */
    const gInfo = (g, now = Date.now()) => {
      const n = g.count || 0;
      const avg = n >= 2 && g.firstAt && g.lastAt > g.firstAt ? (g.lastAt - g.firstAt) / (n - 1) : null;
      const since = g.lastAt ? now - g.lastAt : null;
      return { avg, since, due: !!(avg && since != null && since >= avg * 0.85) };
    };
    const gSort = (a, b) => {
      const ia = gInfo(a), ib = gInfo(b);
      if (ia.due !== ib.due) return ia.due ? -1 : 1;
      if (ia.due) return (ib.since / ib.avg) - (ia.since / ia.avg);
      return byName(a, b);
    };

    /** Kauf vermerken (Abhaken eines Lebensmittels) – höchstens einmal je 12 Std */
    const noteBought = async name => {
      const k = norm(name), now = Date.now();
      const g = (await gerne.all()).find(x => norm(x.name) === k);
      if (!g || (g.lastAt && now - g.lastAt < DAY / 2)) return;
      await gerne.update(g.id, { lastAt: now, firstAt: g.firstAt || now, count: (g.count || 0) + 1 });
    };

    /* ---------- Bausteine ---------- */
    const fill = (box, ...c) => box.replaceChildren(...c.flat(Infinity).filter(x => x != null && x !== false));
    const check = (h, ctx, done, label, onclick) => h('button', { type: 'button', class: 'ek-check' + (done ? ' on' : ''), 'aria-label': label, title: label, disabled: ctx.readOnly, onclick }, h('span'));
    const iconBtn = (h, ctx, icon, label, onclick, cls = '') => h('button', { type: 'button', class: 'btn btn-ghost btn-sm ek-ib ' + cls, 'aria-label': label, title: label, disabled: ctx.readOnly, onclick }, ctx.ui.icon(icon));

    /** Formular-Dialog: fields = [{ k, label, type: 'text'|'price'|'url'|'date'|'note'|'chips', options, autofocus }] */
    const formDialog = (ctx, { title, fields, value = {}, ok = 'Speichern', onDelete }) => {
      const { h } = ctx.ui;
      return ctx.ui.dialog(close => {
        const vals = { ...value };
        const inputs = {};
        const rows = fields.map(f => {
          if (f.type === 'chips') {
            const box = h('div', { class: 'chips', role: 'radiogroup', 'aria-label': f.label });
            const draw = () => fill(box, ...f.options.map(o => h('button', { type: 'button', class: 'chip', role: 'radio', 'aria-checked': String(vals[f.k] === o.v), onclick: () => { vals[f.k] = o.v; draw(); } }, o.label)));
            draw();
            return h('div', { class: 'field' }, h('span', { class: 'ek-lbl' }, f.label), box);
          }
          const attrs = { autofocus: f.autofocus, 'aria-label': f.label };
          let inp;
          if (f.type === 'note') inp = h('textarea', { ...attrs, rows: 2 }, '');
          else if (f.type === 'date') inp = h('input', { ...attrs, type: 'date' });
          else if (f.type === 'price') inp = h('input', { ...attrs, type: 'text', inputmode: 'decimal', placeholder: '€' });
          else if (f.type === 'url') inp = h('input', { ...attrs, type: 'text', inputmode: 'url', autocapitalize: 'off', spellcheck: 'false', placeholder: 'https://' });
          else inp = h('input', { ...attrs, type: 'text', enterkeyhint: 'done' });
          const v = vals[f.k];
          inp.value = v == null ? '' : f.type === 'price' ? String(v).replace('.', ',') : String(v);
          inputs[f.k] = inp;
          return h('label', { class: 'field' }, h('span', {}, f.label), inp);
        });
        const submit = e => {
          e.preventDefault();
          const out = { ...vals };
          for (const f of fields) {
            const inp = inputs[f.k]; if (!inp) continue;
            const s = inp.value.trim();
            if (f.type === 'price') { out[f.k] = parsePrice(s); if (s && out[f.k] == null) { inp.focus(); ctx.ui.toast('Preis ungültig', { type: 'error' }); return; } }
            else if (f.type === 'url') { out[f.k] = safeUrl(s); if (s && !out[f.k]) { inp.focus(); ctx.ui.toast('Link ungültig', { type: 'error' }); return; } }
            else if (f.type === 'date') out[f.k] = s || null;
            else if (f.type === 'note') out[f.k] = s.slice(0, 2000);
            else out[f.k] = clean(s);
          }
          if (!out.name) { inputs.name && inputs.name.focus(); return; }
          close(out);
        };
        return h('form', { class: 'ek-form', onsubmit: submit },
          h('h3', {}, title), h('div', { class: 'stack' }, rows),
          h('div', { class: 'dlg-actions' },
            onDelete ? h('button', { type: 'button', class: 'btn btn-ghost ek-del', 'aria-label': 'Löschen', title: 'Löschen', onclick: () => close('__delete') }, ctx.ui.icon('trash')) : null,
            h('button', { type: 'button', class: 'btn', onclick: () => close(undefined) }, 'Abbrechen'),
            h('button', { type: 'submit', class: 'btn btn-primary' }, ok)));
      }, { label: title }).then(async r => {
        if (r === '__delete') { if (onDelete) await onDelete(); return undefined; }
        return r;
      });
    };

    /** Gemeinsame Postenzeile (Lebensmittel, Drogerie) */
    const postRow = (h, ctx, p, { isFav, onFav } = {}) => h('li', { class: 'ek-item' + (p.done ? ' done' : '') },
      check(h, ctx, p.done, p.done ? 'Wieder offen' : 'Abhaken', async () => {
        const done = !p.done;
        await posten.update(p.id, { done, doneAt: done ? Date.now() : null });
        if (done && p.area === 'food') await noteBought(p.name);
      }),
      h('div', { class: 'ek-body', onclick: () => editPost(ctx, p) },
        h('span', { class: 'ek-name' }, p.name),
        p.qty ? h('span', { class: 'pill' }, p.qty) : null),
      onFav ? iconBtn(h, ctx, 'star', isFav ? 'Aus Gerne-Liste entfernen' : 'Zur Gerne-Liste', onFav, isFav ? 'fav on' : 'fav') : null,
      iconBtn(h, ctx, 'x', 'Entfernen', async () => {
        await posten.remove(p.id);
        ctx.ui.toast(`„${p.name}“ entfernt`, { action: 'Rückgängig', onAction: () => posten.update(p.id, { deletedAt: null }) });
      }));

    const editPost = async (ctx, p) => {
      if (ctx.readOnly) return;
      const r = await formDialog(ctx, {
        title: 'Bearbeiten', value: p,
        fields: [{ k: 'name', label: 'Name', autofocus: true }, { k: 'qty', label: 'Menge' }],
        onDelete: () => posten.remove(p.id),
      });
      if (r) await posten.update(p.id, { name: r.name, qty: r.qty || '' });
    };

    /** Posten hinzufügen; vorhandenen (auch abgehakten) gleichen Namens wieder öffnen statt doppelt anlegen */
    const addPost = async (ctx, area, listId, name) => {
      name = clean(name); if (!name) return;
      const k = norm(name);
      const same = (await posten.query(p => p.area === area && (p.listId || null) === (listId || null) && norm(p.name) === k))[0];
      if (same && !same.done) { ctx.ui.toast(`„${same.name}“ steht schon drauf`); return; }
      if (same) { await posten.update(same.id, { done: false, doneAt: null }); return; }
      await posten.add({ area, listId: listId || null, name, qty: '', done: false, doneAt: null });
    };

    /** Eingabezeile mit Vorschlägen (Chips) und Autovervollständigung */
    const adder = (h, ctx, { key, inputs, onAdd, suggest, datalistId }) => {
      let inp = inputs.get(key);
      if (!inp) {
        inp = h('input', { type: 'text', placeholder: 'Hinzufügen …', 'aria-label': 'Hinzufügen', enterkeyhint: 'enter', autocomplete: 'off', list: datalistId, disabled: ctx.readOnly });
        inputs.set(key, inp);
      }
      const chips = h('div', { class: 'chips scroll ek-sugg' });
      const drawChips = () => {
        const list = suggest ? suggest(norm(inp.value)) : [];
        chips.hidden = !list.length;
        chips.replaceChildren(...list.slice(0, 20).map(s => h('button', { type: 'button', class: 'chip' + (s.due ? ' due' : ''), disabled: ctx.readOnly, onclick: () => onAdd(s.name) }, ctx.ui.icon('plus'), s.name)));
      };
      inp.oninput = drawChips;
      const go = () => { const v = inp.value; inp.value = ''; drawChips(); onAdd(v); };
      inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); go(); } };
      drawChips();
      return h('div', { class: 'ek-adder' },
        h('div', { class: 'row nowrap' }, inp, h('button', { type: 'button', class: 'btn btn-primary ek-add', 'aria-label': 'Hinzufügen', title: 'Hinzufügen', disabled: ctx.readOnly, onclick: go }, ctx.ui.icon('plus'))),
        chips);
    };

    /* ---------- Gerne-Liste ---------- */
    const openGerne = async ctx => {
      const { h } = ctx.ui;
      await ctx.ui.dialog(close => {
        const listBox = h('ul', { class: 'ek-list ek-gerne' });
        const inp = h('input', { type: 'text', placeholder: 'Lebensmittel …', 'aria-label': 'Lebensmittel', autofocus: true, enterkeyhint: 'enter', disabled: ctx.readOnly });
        const draw = async () => {
          const all = (await gerne.all()).sort(byName);
          listBox.replaceChildren(...(all.length ? all.map(g => {
            const i = gInfo(g);
            return h('li', { class: 'ek-item' },
              h('div', { class: 'ek-body' }, h('span', { class: 'ek-name' }, g.name),
                i.avg ? h('span', { class: 'pill' + (i.due ? ' orange' : ''), title: 'üblicher Abstand' }, ctx.ui.icon('repeat'), `${Math.max(1, Math.round(i.avg / DAY))} T`) : null),
              iconBtn(h, ctx, 'trash', 'Entfernen', async () => { await gerne.remove(g.id); draw(); }));
          }) : [h('li', { class: 'empty' }, 'Leer')]));
        };
        const add = async () => {
          const name = clean(inp.value); inp.value = ''; inp.focus();
          if (!name) return;
          if ((await gerne.all()).some(g => norm(g.name) === norm(name))) { ctx.ui.toast(`„${name}“ ist schon drin`); return; }
          await gerne.add({ name, lastAt: null, firstAt: null, count: 0 });
          draw();
        };
        inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); add(); } };
        draw();
        return h('div', { class: 'ek-form' },
          h('h3', {}, ctx.ui.icon('star'), ' Gerne-Liste'),
          h('div', { class: 'row nowrap' }, inp, h('button', { type: 'button', class: 'btn btn-primary ek-add', 'aria-label': 'Hinzufügen', disabled: ctx.readOnly, onclick: add }, ctx.ui.icon('plus'))),
          listBox,
          h('div', { class: 'dlg-actions' }, h('button', { type: 'button', class: 'btn btn-primary', onclick: () => close() }, 'Fertig')));
      }, { label: 'Gerne-Liste' });
    };

    const toggleFav = async (ctx, name) => {
      const g = (await gerne.all()).find(x => norm(x.name) === norm(name));
      if (g) { await gerne.remove(g.id); ctx.ui.toast(`„${g.name}“ aus Gerne-Liste`); }
      else { await gerne.add({ name: clean(name), lastAt: null, firstAt: null, count: 0 }); ctx.ui.toast(`„${clean(name)}“ in Gerne-Liste`); }
    };

    /* ---------- Neue Lebensmittel-Liste ---------- */
    const newFoodList = async ctx => {
      const { h } = ctx.ui;
      const favs = (await gerne.all()).sort(gSort);
      const active = (await listen.query(l => l.kind === 'food' && !l.done));
      const openOld = (await posten.query(p => p.area === 'food' && !p.done && active.some(l => l.id === p.listId)));
      const r = await ctx.ui.dialog(close => {
        const sel = new Set(favs.filter(g => gInfo(g).due).map(g => g.id));
        let carry = openOld.length > 0;
        const title = h('input', { type: 'text', value: `Einkauf ${new Date().toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' })}`, 'aria-label': 'Name' });
        const chips = h('div', { class: 'chips ek-pick' });
        const draw = () => chips.replaceChildren(...favs.map(g => h('button', { type: 'button', class: 'chip' + (sel.has(g.id) ? ' on' : ''), 'aria-pressed': String(sel.has(g.id)),
          onclick: () => { sel.has(g.id) ? sel.delete(g.id) : sel.add(g.id); draw(); } }, g.name)));
        draw();
        return h('form', { class: 'ek-form', onsubmit: e => { e.preventDefault(); close({ title: clean(title.value) || 'Einkauf', names: favs.filter(g => sel.has(g.id)).map(g => g.name), carry }); } },
          h('h3', {}, 'Neue Liste'),
          h('label', { class: 'field' }, h('span', {}, 'Name'), title),
          favs.length
            ? h('div', {},
                h('div', { class: 'row ek-pickhead' }, h('span', { class: 'ek-lbl grow' }, ctx.ui.icon('star'), ' Vorschläge'),
                  h('button', { type: 'button', class: 'btn btn-ghost btn-sm', onclick: () => { favs.forEach(g => sel.add(g.id)); draw(); } }, 'Alle'),
                  h('button', { type: 'button', class: 'btn btn-ghost btn-sm', onclick: () => { sel.clear(); draw(); } }, 'Keine')),
                chips)
            : h('p', { class: 'small muted' }, 'Gerne-Liste leer'),
          openOld.length ? h('label', { class: 'switch' }, h('input', { type: 'checkbox', checked: carry, onchange: e => { carry = e.target.checked; } }), `${openOld.length} offene übernehmen`) : null,
          h('div', { class: 'dlg-actions' },
            h('button', { type: 'button', class: 'btn', onclick: () => close(undefined) }, 'Abbrechen'),
            h('button', { type: 'submit', class: 'btn btn-primary' }, 'Anlegen')));
      }, { label: 'Neue Liste' });
      if (!r) return null;
      const list = await listen.add({ kind: 'food', title: r.title, done: false, doneAt: null });
      const have = new Set();
      if (r.carry) {
        for (const p of openOld) { await posten.update(p.id, { listId: list.id }); have.add(norm(p.name)); }
        for (const l of active) await listen.update(l.id, { done: true, doneAt: Date.now() });
      }
      for (const n of r.names) if (!have.has(norm(n))) { have.add(norm(n)); await posten.add({ area: 'food', listId: list.id, name: n, qty: '', done: false, doneAt: null }); }
      return list;
    };

    /* ---------- Ansichten ---------- */
    const renderFood = async (box, ctx, st) => {
      const { h } = ctx.ui; const U = ctx.util;
      const [ls, ps, favs] = await Promise.all([listen.query(l => l.kind === 'food'), posten.query(p => p.area === 'food'), gerne.all()]);
      const favSet = new Set(favs.map(g => norm(g.name)));
      const active = ls.filter(l => !l.done).sort((a, b) => b.createdAt - a.createdAt);
      const finished = ls.filter(l => l.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
      const itemsOf = id => ps.filter(p => p.listId === id);
      const dl = h('datalist', { id: 'ek-dl-food' }, [...new Set([...favs.map(g => g.name), ...ps.map(p => p.name)])].sort((a, b) => a.localeCompare(b, 'de')).map(n => h('option', { value: n })));

      const listCard = l => {
        const its = itemsOf(l.id);
        const open = its.filter(p => !p.done).sort((a, b) => a.createdAt - b.createdAt);
        const done = its.filter(p => p.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
        const onList = new Set(its.map(p => norm(p.name)));
        const suggest = q => favs.filter(g => !onList.has(norm(g.name)) && (!q || norm(g.name).includes(q))).sort(gSort).map(g => ({ name: g.name, due: gInfo(g).due }));
        return h('div', { class: 'card ek-card' },
          h('div', { class: 'ek-lhead' },
            h('button', { type: 'button', class: 'ek-ltitle', disabled: ctx.readOnly, onclick: () => editList(ctx, l) }, l.title || 'Einkauf'),
            its.length ? h('span', { class: 'pill' + (open.length ? '' : ' green') }, `${done.length}/${its.length}`) : null,
            iconBtn(h, ctx, 'check', 'Abschließen', async () => {
              await listen.update(l.id, { done: true, doneAt: Date.now() });
              ctx.ui.toast('Liste abgeschlossen', { action: 'Rückgängig', onAction: () => listen.update(l.id, { done: false, doneAt: null }) });
            })),
          adder(h, ctx, { key: 'food:' + l.id, inputs: st.inputs, datalistId: 'ek-dl-food', suggest, onAdd: n => addPost(ctx, 'food', l.id, n) }),
          open.length || done.length
            ? h('ul', { class: 'ek-list' }, [...open, ...done].map(p => postRow(h, ctx, p, { isFav: favSet.has(norm(p.name)), onFav: () => toggleFav(ctx, p.name) })))
            : null);
      };

      fill(box, dl,
        active.length ? h('div', {}, active.map(listCard))
          : h('div', { class: 'card empty ek-empty' }, h('button', { type: 'button', class: 'btn btn-primary', disabled: ctx.readOnly, onclick: () => newFoodList(ctx) }, ctx.ui.icon('plus'), 'Neue Liste')),
        finished.length ? h('details', { class: 'fold', open: st.foldFood || null, ontoggle: e => { st.foldFood = e.target.open; } },
          h('summary', {}, `Erledigt (${finished.length})`),
          h('ul', { class: 'ek-list' }, finished.slice(0, 30).map(l => {
            const its = itemsOf(l.id);
            return h('li', { class: 'ek-item' },
              h('div', { class: 'ek-body', onclick: () => editList(ctx, l) },
                h('span', { class: 'ek-name' }, l.title || 'Einkauf'),
                h('span', { class: 'pill' }, U.formatDate(l.doneAt, false)),
                h('span', { class: 'pill' }, `${its.filter(p => p.done).length}/${its.length}`)),
              iconBtn(h, ctx, 'repeat', 'Wieder öffnen', () => listen.update(l.id, { done: false, doneAt: null })));
          }))) : null);
    };

    const editList = async (ctx, l) => {
      if (ctx.readOnly) return;
      const r = await formDialog(ctx, {
        title: 'Liste', value: { name: l.title },
        fields: [{ k: 'name', label: 'Name', autofocus: true }],
        onDelete: async () => {
          if (!(await ctx.ui.confirm(`„${l.title}“ mit allen Posten löschen?`, { ok: 'Löschen', danger: true }))) return;
          for (const p of await posten.query(p => p.listId === l.id)) await posten.remove(p.id);
          await listen.remove(l.id);
        },
      });
      if (r) await listen.update(l.id, { title: r.name });
    };

    const renderDrug = async (box, ctx, st) => {
      const { h } = ctx.ui;
      const ps = await posten.query(p => p.area === 'drug');
      const open = ps.filter(p => !p.done).sort((a, b) => a.createdAt - b.createdAt);
      const done = ps.filter(p => p.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
      // frühere Posten als Vorschläge (Autovervollständigung, häufigste zuerst)
      const all = (await posten.raw()).filter(p => p.area === 'drug');
      const freq = new Map();
      for (const p of all) { const k = norm(p.name); const e = freq.get(k) || { name: p.name, n: 0 }; e.n++; freq.set(k, e); }
      const onList = new Set(open.map(p => norm(p.name)));
      const suggest = q => q ? [...freq.entries()].filter(([k]) => !onList.has(k) && k.includes(q)).sort((a, b) => b[1].n - a[1].n).map(([, e]) => ({ name: e.name })) : [];
      fill(box, 
        h('datalist', { id: 'ek-dl-drug' }, [...freq.values()].map(e => h('option', { value: e.name }))),
        h('div', { class: 'card ek-card' },
          adder(h, ctx, { key: 'drug', inputs: st.inputs, datalistId: 'ek-dl-drug', suggest, onAdd: n => addPost(ctx, 'drug', null, n) }),
          open.length || done.length ? h('ul', { class: 'ek-list' }, [...open, ...done].map(p => postRow(h, ctx, p))) : null,
          done.length ? h('div', { class: 'ek-foot' }, h('button', { type: 'button', class: 'btn btn-ghost btn-sm', disabled: ctx.readOnly, onclick: async () => {
            for (const p of done) await posten.remove(p.id);
            ctx.ui.toast(`${done.length} entfernt`, { action: 'Rückgängig', onAction: async () => { for (const p of done) await posten.update(p.id, { deletedAt: null }); } });
          } }, ctx.ui.icon('trash'), 'Erledigte')) : null));
    };

    /* Online-Einkäufe */
    const ONLINE_FIELDS = [
      { k: 'name', label: 'Was', autofocus: true }, { k: 'shop', label: 'Shop' }, { k: 'url', label: 'Link', type: 'url' },
      { k: 'price', label: 'Preis', type: 'price' },
      { k: 'status', label: 'Status', type: 'chips', options: [{ v: 'open', label: 'Offen' }, { v: 'ordered', label: 'Bestellt' }, { v: 'received', label: 'Erhalten' }] },
      { k: 'eta', label: 'Lieferung', type: 'date' }, { k: 'note', label: 'Notiz', type: 'note' },
    ];
    const setOnlineStatus = (o, status) => online.update(o.id, {
      status, orderedAt: status === 'open' ? null : (o.orderedAt || Date.now()), receivedAt: status === 'received' ? (o.receivedAt || Date.now()) : null,
    });
    const editOnline = async (ctx, o) => {
      if (ctx.readOnly) return;
      const r = await formDialog(ctx, { title: o ? 'Bearbeiten' : 'Online-Einkauf', value: o || { status: 'open' }, fields: ONLINE_FIELDS, ok: o ? 'Speichern' : 'Anlegen', onDelete: o ? () => online.remove(o.id) : null });
      if (!r) return;
      const data = { name: r.name, shop: r.shop || '', url: r.url || null, price: r.price, eta: r.eta || null, note: r.note || '' };
      if (o) { await online.update(o.id, data); if (r.status !== (o.status || 'open')) await setOnlineStatus({ ...o, ...data }, r.status); }
      else await online.add({ ...data, status: r.status || 'open', orderedAt: r.status !== 'open' ? Date.now() : null, receivedAt: r.status === 'received' ? Date.now() : null });
    };
    const renderOnline = async (box, ctx, st) => {
      const { h } = ctx.ui; const U = ctx.util;
      const all = await online.all();
      const of = s => all.filter(o => (o.status || 'open') === s);
      const today = todayKey();
      const row = o => {
        const s = o.status || 'open';
        const next = s === 'open' ? { to: 'ordered', icon: 'check', label: 'Bestellt' } : s === 'ordered' ? { to: 'received', icon: 'download', label: 'Erhalten' } : { to: 'ordered', icon: 'repeat', label: 'Doch nicht erhalten' };
        return h('li', { class: 'ek-item' + (s === 'received' ? ' done' : '') },
          h('div', { class: 'ek-body', onclick: () => editOnline(ctx, o) },
            h('span', { class: 'ek-name' }, o.name),
            h('div', { class: 'ek-meta' },
              o.shop || o.url ? h('span', { class: 'pill' }, o.shop || host(o.url)) : null,
              o.price != null ? h('span', { class: 'pill' }, eur(o.price)) : null,
              s === 'ordered' && o.eta ? h('span', { class: 'pill ' + (o.eta < today ? 'orange' : 'blue') }, ctx.ui.icon('calendar'), fmtKey(o.eta)) : null,
              s === 'ordered' && !o.eta && o.orderedAt ? h('span', { class: 'pill', title: 'Bestellt' }, ctx.ui.icon('check'), U.formatDate(o.orderedAt, false)) : null,
              s === 'received' && o.receivedAt ? h('span', { class: 'pill green' }, U.formatDate(o.receivedAt, false)) : null)),
          o.url ? h('a', { class: 'btn btn-ghost btn-sm ek-ib', href: o.url, target: '_blank', rel: 'noopener noreferrer', 'aria-label': 'Link öffnen', title: 'Link öffnen' }, ctx.ui.icon('external')) : null,
          h('button', { type: 'button', class: 'btn btn-sm ek-step' + (s === 'received' ? ' btn-ghost' : ''), title: next.label, 'aria-label': next.label, disabled: ctx.readOnly, onclick: () => setOnlineStatus(o, next.to) }, ctx.ui.icon(next.icon), s === 'received' ? null : next.label));
      };
      const toOrder = of('open').sort((a, b) => a.createdAt - b.createdAt);
      const ordered = of('ordered').sort((a, b) => (a.eta || '9').localeCompare(b.eta || '9') || (a.orderedAt || 0) - (b.orderedAt || 0));
      const received = of('received').sort((a, b) => (b.receivedAt || 0) - (a.receivedAt || 0));
      const sec = (title, items, sum) => items.length ? h('div', {},
        h('div', { class: 'ek-sec' }, h('span', { class: 'grow' }, `${title} (${items.length})`), sum ? h('span', {}, eur(sum)) : null),
        h('ul', { class: 'ek-list card-list' }, items.map(row))) : null;
      const sum = l => l.reduce((s, o) => s + (Number(o.price) || 0), 0);
      fill(box, 
        !toOrder.length && !ordered.length ? h('div', { class: 'empty' }, 'Nichts offen') : null,
        sec('Zu bestellen', toOrder, sum(toOrder)),
        sec('Unterwegs', ordered),
        received.length ? h('details', { class: 'fold', open: st.foldOnline || null, ontoggle: e => { st.foldOnline = e.target.open; } },
          h('summary', {}, `Erhalten (${received.length})`), h('ul', { class: 'ek-list card-list' }, received.slice(0, 50).map(row))) : null);
    };

    /* Größere Anschaffungen */
    const BIG_FIELDS = [
      { k: 'name', label: 'Was', autofocus: true }, { k: 'price', label: 'Preis ca.', type: 'price' },
      { k: 'prio', label: 'Priorität', type: 'chips', options: PRIO }, { k: 'url', label: 'Link', type: 'url' }, { k: 'note', label: 'Notiz', type: 'note' },
    ];
    const editBig = async (ctx, b) => {
      if (ctx.readOnly) return;
      const r = await formDialog(ctx, { title: b ? 'Bearbeiten' : 'Anschaffung', value: b || { prio: 2 }, fields: BIG_FIELDS, ok: b ? 'Speichern' : 'Anlegen', onDelete: b ? () => gross.remove(b.id) : null });
      if (!r) return;
      const data = { name: r.name, price: r.price, prio: r.prio || 2, url: r.url || null, note: r.note || '' };
      if (b) await gross.update(b.id, data); else await gross.add({ ...data, done: false, doneAt: null });
    };
    const renderBig = async (box, ctx, st) => {
      const { h } = ctx.ui; const U = ctx.util;
      const all = await gross.all();
      const open = all.filter(b => !b.done).sort((a, b) => (a.prio || 2) - (b.prio || 2) || a.createdAt - b.createdAt);
      const done = all.filter(b => b.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
      const total = open.reduce((s, b) => s + (Number(b.price) || 0), 0);
      const row = b => h('li', { class: 'ek-item' + (b.done ? ' done' : '') + (!b.done && b.prio === 1 ? ' hi' : '') },
        check(h, ctx, b.done, b.done ? 'Wieder offen' : 'Gekauft', () => gross.update(b.id, { done: !b.done, doneAt: b.done ? null : Date.now() })),
        h('div', { class: 'ek-body', onclick: () => editBig(ctx, b) },
          h('span', { class: 'ek-name' }, b.name),
          h('div', { class: 'ek-meta' },
            b.price != null ? h('span', { class: 'pill' }, eur(b.price)) : null,
            !b.done ? h('span', { class: 'pill' + (b.prio === 1 ? ' red' : b.prio === 3 ? '' : ' blue') }, (PRIO.find(p => p.v === (b.prio || 2)) || PRIO[1]).label) : null,
            b.done && b.doneAt ? h('span', { class: 'pill green' }, U.formatDate(b.doneAt, false)) : null,
            b.note ? h('span', { class: 'ek-note' }, b.note) : null)),
        b.url ? h('a', { class: 'btn btn-ghost btn-sm ek-ib', href: b.url, target: '_blank', rel: 'noopener noreferrer', 'aria-label': 'Link öffnen', title: 'Link öffnen' }, ctx.ui.icon('external')) : null);
      fill(box, 
        open.length ? h('div', {},
          total ? h('div', { class: 'ek-sec' }, h('span', { class: 'grow' }, `Offen (${open.length})`), h('span', {}, 'Σ ' + eur(total))) : null,
          h('ul', { class: 'ek-list card-list' }, open.map(row))) : h('div', { class: 'empty' }, 'Nichts geplant'),
        done.length ? h('details', { class: 'fold', open: st.foldBig || null, ontoggle: e => { st.foldBig = e.target.open; } },
          h('summary', {}, `Gekauft (${done.length})`), h('ul', { class: 'ek-list card-list' }, done.slice(0, 50).map(row))) : null);
    };

    const RENDER = { food: renderFood, drug: renderDrug, online: renderOnline, big: renderBig };

    App.register({
      id: 'einkaufen', name: 'Einkaufen', icon: 'cart', order: 25, homeTile: false,
      description: 'Lebensmittel mit Gerne-Liste, Drogerie, Online-Einkäufe, größere Anschaffungen', category: 'Alltag',
      version: '1.0.1', schemaVersion: 1, migrations: {},
      /* Daten (synchronisiert):
           listen  { kind: 'food', title, done, doneAt }
           posten  { area: 'food'|'drug', listId|null, name, qty, done, doneAt }
           gerne   { name, lastAt, firstAt, count }          – Kaufhistorie für „fällig“
           online  { name, shop, url, price, status: 'open'|'ordered'|'received', orderedAt, receivedAt, eta: 'JJJJ-MM-TT', note }
           gross   { name, price, prio: 1|2|3, url, note, done, doneAt }
         Einstellung (lokal): tab */

      async init(ctx) {
        listen = ctx.store.collection('listen', { sync: true });
        posten = ctx.store.collection('posten', { sync: true });
        gerne = ctx.store.collection('gerne', { sync: true });
        online = ctx.store.collection('online', { sync: true });
        gross = ctx.store.collection('gross', { sync: true });
      },

      async mount(el, ctx) {
        const { h } = ctx.ui;
        const st = { tab: await ctx.settings.get('tab', 'food'), inputs: new Map() };
        if (!RENDER[st.tab]) st.tab = 'food';
        const tabsBox = h('div', { class: 'chips scroll ek-tabs', role: 'tablist', 'aria-label': 'Bereich' });
        const actions = h('div', { class: 'row nowrap ek-actions' });
        const body = h('div', { class: 'ek-view' });

        const counts = async () => {
          const [ps, on, gr] = await Promise.all([posten.query(p => !p.done), online.query(o => (o.status || 'open') !== 'received'), gross.query(b => !b.done)]);
          const ls = new Set((await listen.query(l => l.kind === 'food' && !l.done)).map(l => l.id));
          return { food: ps.filter(p => p.area === 'food' && ls.has(p.listId)).length, drug: ps.filter(p => p.area === 'drug').length, online: on.length, big: gr.length };
        };
        const drawHead = async () => {
          const c = await counts();
          tabsBox.replaceChildren(...TABS.map(t => h('button', { type: 'button', class: 'chip' + (t.id === st.tab ? ' on' : ''), role: 'tab', 'aria-selected': String(t.id === st.tab),
            onclick: () => { if (st.tab === t.id) return; st.tab = t.id; ctx.settings.set('tab', t.id).catch(() => {}); render(); } },
            t.name, c[t.id] ? h('span', { class: 'ek-n' }, String(c[t.id])) : null)));
          const plus = (label, fn) => h('button', { type: 'button', class: 'btn btn-primary ek-add', 'aria-label': label, title: label, disabled: ctx.readOnly, onclick: fn }, ctx.ui.icon('plus'));
          actions.replaceChildren(...(
            st.tab === 'food' ? [h('button', { type: 'button', class: 'btn btn-ghost', 'aria-label': 'Gerne-Liste', title: 'Gerne-Liste', onclick: () => openGerne(ctx) }, ctx.ui.icon('star')), plus('Neue Liste', () => newFoodList(ctx))]
            : st.tab === 'online' ? [plus('Online-Einkauf', () => editOnline(ctx))]
            : st.tab === 'big' ? [plus('Anschaffung', () => editBig(ctx))]
            : []));
        };
        let busy = null, again = false;
        const render = async () => {
          if (busy) { again = true; return busy; }
          busy = (async () => {
            do {
              again = false;
              const focused = document.activeElement;
              await drawHead();
              await RENDER[st.tab](body, ctx, st);
              const on = tabsBox.querySelector('.chip.on'); if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest', inline: 'nearest' });
              if (focused && focused.tagName === 'INPUT' && body.contains(focused) && document.activeElement !== focused) focused.focus();
            } while (again);
          })();
          try { await busy; } finally { busy = null; }
        };
        const reRender = ctx.util.debounce(render, 60);
        el.append(h('div', {},
          h('div', { class: 'ek-head' }, h('h2', {}, 'Einkaufen'), actions),
          tabsBox, body));
        ctx.events.on('store:changed', e => { if (e && e.moduleId === 'einkaufen') reRender(); });
        ctx.events.on('app:visible', reRender);
        await render();
      },

      /** Kennzahl für die Startseite: offene Posten auf Lebensmittel- und Drogerie-Listen */
      async homeStats() {
        const ls = new Set((await listen.query(l => l.kind === 'food' && !l.done)).map(l => l.id));
        const n = (await posten.query(p => !p.done && (p.area === 'drug' || ls.has(p.listId)))).length;
        return n ? [{ icon: 'cart', value: n, title: `${n} offen zum Einkaufen`, route: 'einkaufen' }] : [];
      },
    });
  })();
  /* ==== ENDE MODUL: einkaufen ==== */
  </script>

  <script>/* ==== BOOT ==== */ App.boot();</script>
</body>
</html>
