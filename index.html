        el.append(
          h('div', { class: 'head' },
            h('h2', {}, 'Tägliche Ziele'),
            h('button', { class: 'btn btn-ghost', title: 'Einstellungen', 'aria-label': 'Einstellungen', onclick: () => openSettings(ctx), disabled: ctx.readOnly }, ctx.ui.icon('settings'))),
          hintBox, statsBox, dayBox, weekBox, histBox);
        let histOpen = false, dismissed = {};

        const stat = (icon, value, label) => h('div', { class: 'stat' }, h('div', { class: 'v' }, ctx.ui.icon(icon), String(value)), h('div', { class: 'l' }, label));

        const goalRow = (kind, p, it) => h('li', { class: 'goal' + (it.done ? ' done' : '') },
          h('button', { class: 'check', 'aria-label': it.done ? `„${it.title}“ nicht erledigt` : `„${it.title}“ erledigt`, 'aria-pressed': String(it.done), disabled: ctx.readOnly, onclick: () => toggle(ctx, kind, p, it.id) }, h('span', {}, ctx.ui.icon('check'))),
          h('div', { class: 'g-body', onclick: () => !ctx.readOnly && openEdit(ctx, it.id) }, h('div', { class: 'g-title' }, it.title)));

        const periodCard = (kind, v, c, rem, now) => {
          const isD = kind === 'daily';
          const time = isD ? c.dailyTime : c.weeklyTime;
          const askAt = atTime(isD ? v.p.date : addDays(v.p.date, 6), time);
          // Hinweis nur einmal: weg, sobald nach der Abfragezeit etwas abgehakt oder er weggeklickt wurde
          const answered = v.rec && (v.rec.answeredAt || 0) >= askAt;
          const asking = v.items.length && !v.complete && now >= askAt && !answered && dismissed[kind] !== v.p.key;
          const head = h('div', { class: 'card-head' },
            h('h3', {}, isD ? 'Heute' : 'Woche'),
            h('span', { class: 'muted small' }, isD ? v.p.date.toLocaleDateString('de-DE', { weekday: 'short', day: 'numeric', month: 'numeric' }) : periodLabel(v.p)));
          let status = null;
          if (v.items.length) {
            status = v.complete
              ? h('span', { class: 'pill green' }, ctx.ui.icon('check'), `+${v.points}`)
              : h('span', { class: 'pill' }, `${v.nDone}/${v.items.length}` + (!isD && v.points ? ` · +${v.points}` : ''));
          }
          const on = isD ? c.dailyOn : c.weeklyOn;
          const next = on && rem && rem.nextAt ? h('span', { class: 'pill', title: U.formatDateTimeFull(rem.nextAt) }, ctx.ui.icon('bell'), U.formatDate(rem.nextAt)) : (!on && v.items.length ? h('span', { class: 'pill' }, ctx.ui.icon('bell-off')) : null);
          return h('div', { class: 'card period' + (asking ? ' asking' : '') },
            head,
            asking ? h('div', { class: 'ask' }, ctx.ui.icon('bell'),
              h('span', { class: 'grow' }, 'Geschafft? Abhaken.'),
              h('button', { class: 'btn btn-ghost btn-sm', 'aria-label': 'Hinweis ausblenden', onclick: async () => { dismissed = { ...dismissed, [kind]: v.p.key }; await ctx.settings.set('askDismissed', dismissed); render(); } }, 'OK')) : null,
            v.items.length
              ? h('ul', { class: 'goal-list' }, v.items.map(it => goalRow(kind, v.p, it)))
              : h('div', { class: 'empty small' }, isD ? 'Keine Tagesziele' : 'Keine Wochenziele'),
            h('div', { class: 'card-foot' },
              h('div', { class: 't-meta grow' }, status, next),
              h('button', { class: 'btn btn-sm', title: isD ? 'Tagesziel' : 'Wochenziel', 'aria-label': isD ? 'Neues Tagesziel' : 'Neues Wochenziel', onclick: () => openAdd(ctx, kind), disabled: ctx.readOnly }, ctx.ui.icon('plus'))));
        };

        const histRow = (kind, v, editable) => {
          let pill;
          if (!v.items.length) pill = h('span', { class: 'pill' }, 'keine Ziele');
          else if (v.complete) pill = h('span', { class: 'pill green' }, ctx.ui.icon('check'), 'geschafft');
          else if (!v.rec) pill = h('span', { class: 'pill' }, 'nicht beantwortet');
          else pill = h('span', { class: 'pill ' + (v.nDone ? 'yellow' : 'red') }, `${v.nDone} von ${v.items.length}`);
          const pts = v.rec ? (Number(v.rec.points) || 0) : 0;
          const can = editable && v.items.length && !ctx.readOnly;
          return h('li', { class: 'hist-row' + (can ? ' clickable' : ''), onclick: can ? () => openPast(ctx, kind, v.p) : null },
            h('span', { class: 'grow' }, periodLabel(v.p)), pill,
            h('span', { class: 'pts' }, pts ? `+${pts}` : ''),
            can ? ctx.ui.icon('chevron', 'muted') : h('span', { class: 'chev-sp' }));
        };

        const render = async () => {
          const now = Date.now();
          const [c, s, remD, remW] = await Promise.all([cfg(ctx), stats(), ctx.reminders.get(REM.daily), ctx.reminders.get(REM.weekly)]);
          dismissed = (await ctx.settings.get('askDismissed', {})) || {};

          const perm = ctx.notify.permission();
          const anyGoals = s.d.items.length || s.w.items.length;
          hintBox.replaceChildren(...(anyGoals && perm === 'denied' ? [h('div', { class: 'card hint' },
            ctx.ui.icon(perm === 'denied' ? 'bell-off' : 'bell'),
            h('div', { class: 'grow small' }, 'Benachrichtigungen blockiert'),
            perm === 'default' ? h('button', { class: 'btn btn-sm btn-primary', onclick: async () => { await ctx.notify.request(); render(); } }, 'Erlauben') : null)] : []));

          statsBox.replaceChildren(h('div', { class: 'card' },
            h('div', { class: 'stats' },
              stat('star', s.points.toLocaleString('de-DE'), 'Punkte'),
              stat('flame', s.streakD, 'Tage'),
              stat('calendar', s.streakW, 'Wochen')),
            s.bestD > 1 ? h('div', { class: 'small muted rules' }, `Rekord ${s.bestD} Tage`) : null));

          dayBox.replaceChildren(periodCard('daily', s.d, c, remD, now));
          weekBox.replaceChildren(periodCard('weekly', s.w, c, remW, now));

          // Verlauf & Nachtragen
          const raw = await goals.raw();
          const days = []; let p = prevPeriod(s.d.p);
          for (let i = 0; i < 14; i++) { days.push({ v: await view('daily', p, raw), editable: i < EDIT_DAYS }); p = prevPeriod(p); }
          const weeks = []; p = prevPeriod(s.w.p);
          for (let i = 0; i < 6; i++) { weeks.push({ v: await view('weekly', p, raw), editable: i < EDIT_WEEKS }); p = prevPeriod(p); }
          const firstGoal = raw.reduce((m, g) => Math.min(m, g.createdAt || Infinity), Infinity);
          const dayRows = days.filter(x => x.v.p.end > firstGoal), weekRows = weeks.filter(x => x.v.p.end > firstGoal);
          if (!dayRows.length && !weekRows.length) { histBox.replaceChildren(); }
          else {
            const det = h('details', { class: 'fold', open: histOpen, ontoggle: () => { histOpen = det.open; } },
              h('summary', {}, 'Verlauf'),
              h('div', { class: 'card' },
                dayRows.length ? [h('div', { class: 'section-title' }, 'Tage'), h('ul', { class: 'hist' }, dayRows.map(x => histRow('daily', x.v, x.editable)))] : null,
                weekRows.length ? [h('div', { class: 'section-title' }, 'Wochen'), h('ul', { class: 'hist' }, weekRows.map(x => histRow('weekly', x.v, x.editable)))] : null));
            histBox.replaceChildren(det);
          }

          // Modul ist offen → ausgelöste Abfragen gelten als gesehen
          if (!ctx.readOnly && document.visibilityState === 'visible') for (const r of [remD, remW]) if (r && r.unseen) await ctx.reminders.seen(r.id);
        };

        const re = U.debounce(render, 150);
        ctx.events.on('store:changed', e => { if (e.moduleId === 'ziele') re(); });
        ctx.events.on('reminders:changed', re);
        ctx.events.on('reminder:fired', re);
        ctx.events.on('app:visible', re);
        ctx.events.on('notify:permission', re);
        ctx.every(60000, render);   // Tageswechsel, Abfragezeit erreicht
        await render();
      },

      unmount() {
        mounted = false;
        if (bgCtx && !bgSubsLive) setTimeout(() => subscribeBg(bgCtx), 0);
      },

      /** „Erledigt“ / „1 Std später“ aus der Mitteilung: keine Ziele automatisch abhaken (welche, ist unbekannt).
          Nach „Erledigt“ beendet der Kern die Erinnerung; armAll() legt sie für den nächsten Abend neu an. */
      async onReminderAction(itemId, action, ctx) { ctx.log.info(`Abfrage ${itemId}: ${action}`); },

      /** Kennzahlen für die Startseite (oben rechts) */
      async homeStats() {
        const s = await stats();
        return [
          { icon: 'flame', value: s.streakD, title: `${s.streakD} ${s.streakD === 1 ? 'Tag' : 'Tage'} in Folge`, route: 'ziele' },
          { icon: 'star', value: s.points.toLocaleString('de-DE'), title: 'Punkte', route: 'ziele' },
        ];
      },
    });
  })();
  /* ==== ENDE MODUL: ziele ==== */
  </script>

  <script>/* ==== BOOT ==== */ App.boot();</script>
</body>
</html>
